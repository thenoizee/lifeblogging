<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NoteTrackr</title>
    <!-- Updated Browser Icon (Pen Nib) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'128'%20height%3D'128'%20viewBox%3D'0%200%20128%20128'%3E%3Cdefs%3E%3C%2Fdefs%3E%3Crect%20width%3D'128'%20height%3D'128'%20rx%3D'25.6'%20fill%3D'%23f59e0b'%20fill-opacity%3D'0'%20%2F%3E%3Cg%20transform%3D'translate(0%2C%200)%20rotate(0%2C%2064%2C%2064)'%3E%3Csvg%20x%3D'16'%20y%3D'16'%20width%3D'96'%20height%3D'96'%20viewBox%3D'0%200%20512%20512'%3E%3Cpath%20fill%3D'%23f59e0b'%20fill-opacity%3D'1'%20d%3D'M368.4%2018.3L312.7%2074.1%20437.9%20199.3l55.7-55.7c21.9-21.9%2021.9-57.3%200-79.2L447.6%2018.3c-21.9-21.9-57.3-21.9-79.2%200zM288%2094.6l-9.2%202.8L134.7%20140.6c-19.9%206-35.7%2021.2-42.3%2041L3.8%20445.8c-3.8%2011.3-1%2023.9%207.3%2032.4L164.7%20324.7c-3-6.3-4.7-13.3-4.7-20.7c0-26.5%2021.5-48%2048-48s48%2021.5%2048%2048s-21.5%2048-48%2048c-7.4%200-14.4-1.7-20.7-4.7L33.7%20500.9c8.6%208.3%2021.1%2011.2%2032.4%207.3l264.3-88.6c19.7-6.6%2035-22.4%2041-42.3l43.2-144.1%202.8-9.2L288%2094.6z'%20%2F%3E%3C%2Fsvg%3E%3C%2Fg%3E%3C%2Fsvg%3E">    <meta name="theme-color" content="#f59e0b">
    
    <script>
        try {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        } catch (e) {}
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            future: { hoverOnlyWhenSupported: true },
            theme: { extend: { colors: { primary: '#f59e0b', 'primary-hover': '#d97706' } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #111827; --card-dark: #1f2937; --text-dark: #f9fafb;
            --bg-light: #f3f4f6; --card-light: #ffffff; --text-light: #111827;
            --bg: var(--bg-light); --card: var(--card-light); --text: var(--text-light);
        }
        .dark { --bg: var(--bg-dark); --card: var(--card-dark); --text: var(--text-dark); }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); color: var(--text); 
            overflow: hidden; height: 100dvh; width: 100vw; margin: 0;
            display: flex; flex-direction: column;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .drawer-open { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .privacy-mode textarea {
            color: transparent !important; text-shadow: 0 0 10px rgba(0, 0, 0, 0.5); transition: all 0.3s ease;
        }
        .dark .privacy-mode textarea { text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
        .privacy-mode textarea:hover, .privacy-mode textarea:focus { color: var(--text) !important; text-shadow: none; }

        .color-dot.selected { ring-width: 2px; ring-offset-width: 2px; ring-color: var(--text); }
        .dark .color-dot.selected { ring-offset-color: var(--card-dark); }
        .color-dot:not(.selected) { ring-width: 2px; ring-color: transparent; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="flex justify-between items-center px-4 py-3 bg-[var(--bg)] border-b border-gray-200 dark:border-gray-800 shrink-0 z-10">
        <div class="flex items-center gap-2 md:gap-4">
            <a href="/" class="w-8 h-8 flex items-center justify-center rounded-full text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-800 hover:text-amber-500 transition-colors" title="Back to Hub">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-amber-100 dark:bg-amber-900/30 flex items-center justify-center text-amber-500">
                    <i class="fa-solid fa-pen-nib"></i>
                </div>
                <h1 class="font-bold text-lg tracking-tight hidden sm:block">NoteTrackr</h1>
            </div>
        </div>
        <div class="flex items-center gap-2 md:gap-3">
            <span id="save-status" class="text-[10px] font-bold text-gray-400 uppercase tracking-widest opacity-0 transition-opacity hidden md:inline"><i class="fa-solid fa-cloud-arrow-up mr-1 text-amber-500"></i>Saved</span>
            
            <!-- Highly Visible Undo/Redo Controls -->
            <div class="flex items-center bg-[var(--card)] rounded-lg border border-gray-200 dark:border-gray-700 shadow-sm p-0.5">
                <button onclick="execUndo()" id="btn-undo" class="w-8 h-8 rounded flex items-center justify-center text-gray-500 hover:text-amber-500 hover:bg-gray-100 dark:hover:bg-gray-800 disabled:opacity-30 transition" title="Undo"><i class="fa-solid fa-rotate-left"></i></button>
                <div class="w-px h-4 bg-gray-200 dark:bg-gray-700"></div>
                <button onclick="execRedo()" id="btn-redo" class="w-8 h-8 rounded flex items-center justify-center text-gray-500 hover:text-amber-500 hover:bg-gray-100 dark:hover:bg-gray-800 disabled:opacity-30 transition" title="Redo"><i class="fa-solid fa-rotate-right"></i></button>
            </div>

            <button onclick="togglePrivacyMode()" id="privacy-btn" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-500 transition-colors" title="Toggle Privacy Blur">
                <i class="fa-solid fa-eye"></i>
            </button>
            <button onclick="toggleHistory()" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-500 transition-colors" title="View Local Notes (Esc)">
                <i class="fa-solid fa-clock-rotate-left"></i>
            </button>
        </div>
    </header>

    <!-- Main Editor Area -->
    <main class="flex-1 w-full max-w-3xl mx-auto flex flex-col relative z-0" id="editor-container">
        
        <!-- Editing Banner -->
        <div id="edit-banner" class="hidden bg-blue-50 dark:bg-blue-900/20 border-b border-blue-100 dark:border-blue-800/50 px-6 py-2 flex justify-between items-center">
            <span class="text-xs font-bold text-blue-600 dark:text-blue-400 uppercase tracking-widest"><i class="fa-solid fa-pen-to-square mr-1"></i> Auto-Saving Edits</span>
            <button onclick="clearEditorState()" class="text-xs bg-white dark:bg-gray-800 border border-blue-200 dark:border-blue-700 px-3 py-1 rounded-full text-blue-600 dark:text-blue-400 font-bold shadow-sm hover:bg-blue-100 dark:hover:bg-blue-900/40 transition">New Note</button>
        </div>

        <textarea id="note-input" class="flex-1 w-full bg-transparent resize-none p-6 outline-none text-gray-800 dark:text-gray-200 text-lg md:text-xl leading-relaxed custom-scrollbar placeholder-gray-400 dark:placeholder-gray-600 pb-32" placeholder="Start typing instantly..." autofocus></textarea>
        
        <!-- Floating Word Count -->
        <div class="absolute bottom-[90px] md:bottom-[80px] left-6 flex justify-between items-center pointer-events-none">
            <div id="word-count" class="text-[10px] font-mono text-gray-400 font-bold bg-[var(--bg)] px-2 py-1 rounded-md opacity-70">0 chars &bull; 0 words</div>
        </div>

        <!-- Push Action Bar -->
        <div class="absolute bottom-6 left-4 right-4 md:left-6 md:right-6 bg-[var(--card)] border border-gray-200 dark:border-gray-700 shadow-2xl rounded-2xl p-2 flex gap-2 backdrop-blur-xl bg-opacity-95 dark:bg-opacity-95 flex-col md:flex-row">
            
            <div class="flex items-center justify-center gap-3 md:pr-4 md:border-r border-gray-200 dark:border-gray-700 py-1 md:py-0">
                <button onclick="selectColor('gray')" class="color-dot selected w-5 h-5 rounded-full bg-gray-400 hover:scale-110 transition-transform" data-color="gray" title="No Tag"></button>
                <button onclick="selectColor('blue')" class="color-dot w-5 h-5 rounded-full bg-blue-500 hover:scale-110 transition-transform" data-color="blue" title="Blue Tag"></button>
                <button onclick="selectColor('green')" class="color-dot w-5 h-5 rounded-full bg-green-500 hover:scale-110 transition-transform" data-color="green" title="Green Tag"></button>
                <button onclick="selectColor('red')" class="color-dot w-5 h-5 rounded-full bg-red-500 hover:scale-110 transition-transform" data-color="red" title="Red Tag"></button>
            </div>

            <button onclick="saveLocalNote()" id="btn-save-local" class="flex-1 flex flex-col items-center justify-center py-2 md:py-2.5 rounded-xl bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:text-amber-500 hover:bg-amber-50 dark:hover:bg-amber-900/20 transition-colors" title="Save Locally (Ctrl+Enter)">
                <i class="fa-solid fa-hard-drive text-lg mb-1"></i>
                <span class="text-[10px] font-bold uppercase tracking-wider" id="label-save-local">Save to Device</span>
            </button>
            
            <div class="hidden md:block w-px bg-gray-200 dark:bg-gray-700 my-2"></div>
            
            <button onclick="pushToTaskTrackr()" class="flex-1 flex flex-col items-center justify-center py-2 md:py-2.5 rounded-xl text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/20 transition-colors group" title="Create a new task in TaskTrackr containing this note">
                <i class="fa-solid fa-check-double text-lg mb-0.5 group-hover:scale-110 transition-transform"></i>
                <span class="text-[10px] font-bold uppercase tracking-wider mb-0.5">TaskTrackr</span>
                <span class="text-[8px] font-medium opacity-80 capitalize">Create Task <i class="fa-solid fa-arrow-up-right-from-square ml-0.5 text-[7px]"></i></span>
            </button>
            
            <button onclick="pushToLoggr()" class="flex-1 flex flex-col items-center justify-center py-2 md:py-2.5 rounded-xl text-green-500 hover:bg-green-50 dark:hover:bg-green-900/20 transition-colors group" title="Create a new log entry in Loggr containing this note">
                <i class="fa-solid fa-pen-to-square text-lg mb-0.5 group-hover:scale-110 transition-transform"></i>
                <span class="text-[10px] font-bold uppercase tracking-wider mb-0.5">Loggr</span>
                <span class="text-[8px] font-medium opacity-80 capitalize">Create Log <i class="fa-solid fa-arrow-up-right-from-square ml-0.5 text-[7px]"></i></span>
            </button>
        </div>
    </main>

    <!-- History Drawer -->
    <div id="history-drawer" class="fixed inset-0 bg-[var(--bg)] z-50 hidden flex-col transform translate-y-full transition-transform duration-300">
        <header class="flex justify-between items-center px-4 py-4 bg-[var(--card)] border-b border-gray-200 dark:border-gray-800 shrink-0">
            <h2 class="font-bold text-lg"><i class="fa-solid fa-shield-halved text-green-500 mr-2"></i>Device Notes</h2>
            <button onclick="toggleHistory()" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors" title="Close (Esc)">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </header>
        <div class="flex-1 overflow-y-auto custom-scrollbar p-4 max-w-3xl mx-auto w-full">
            <div id="history-list" class="space-y-3 pb-8"></div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed top-16 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-4 py-2 rounded-full text-sm font-bold shadow-xl transition-all duration-300 opacity-0 pointer-events-none z-[100] flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-amber-400"></i> <span id="toast-msg"></span>
    </div>

    <script>
        const DRAFT_KEY = 'notetrackr_draft';
        const HISTORY_KEY = 'notetrackr_history';
        const input = document.getElementById('note-input');
        const status = document.getElementById('save-status');
        
        let saveTimeout;
        let selectedColor = 'gray';
        let privacyMode = false;
        let currentNoteId = null; 
        
        // Custom Undo/Redo Engine
        let undoStack = [''];
        let redoStack = [];
        let typingTimer;
        let isUndoRedoAction = false;

        // Initialize state
        const savedDraft = localStorage.getItem(DRAFT_KEY);
        if (savedDraft) {
            input.value = savedDraft;
            undoStack[0] = savedDraft;
        }
        updateWordCount();
        updateUndoUI();

        input.addEventListener('input', () => {
            localStorage.setItem(DRAFT_KEY, input.value);
            updateWordCount();
            
            // AUTO-SAVE EDITS DIRECTLY TO DEVICE IN REAL-TIME
            if (currentNoteId) {
                const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
                const noteIndex = history.findIndex(n => n.id === currentNoteId);
                if (noteIndex !== -1) {
                    history[noteIndex].text = input.value;
                    history[noteIndex].date = new Date().toISOString();
                    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
                }
            }
            
            // Undo Stack logic (debounce to capture chunks of typing)
            if (!isUndoRedoAction) {
                clearTimeout(typingTimer);
                typingTimer = setTimeout(() => {
                    if (undoStack[undoStack.length - 1] !== input.value) {
                        undoStack.push(input.value);
                        if (undoStack.length > 50) undoStack.shift(); 
                        redoStack = []; 
                        updateUndoUI();
                    }
                }, 600);
            }
            isUndoRedoAction = false; // reset flag
            
            status.classList.remove('opacity-0');
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => { status.classList.add('opacity-0'); }, 1000);
        });

        function execUndo() {
            if (undoStack.length > 1) {
                redoStack.push(undoStack.pop());
                input.value = undoStack[undoStack.length - 1];
            } else if (undoStack.length === 1 && input.value !== '') {
                redoStack.push(input.value);
                input.value = '';
            }
            isUndoRedoAction = true;
            input.dispatchEvent(new Event('input'));
            updateUndoUI();
        }

        function execRedo() {
            if (redoStack.length > 0) {
                const val = redoStack.pop();
                undoStack.push(val);
                input.value = val;
                isUndoRedoAction = true;
                input.dispatchEvent(new Event('input'));
                updateUndoUI();
            }
        }

        function updateUndoUI() {
            document.getElementById('btn-undo').disabled = undoStack.length <= 1 && input.value === '';
            document.getElementById('btn-redo').disabled = redoStack.length === 0;
        }

        function updateWordCount() {
            const text = input.value;
            const chars = text.length;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            document.getElementById('word-count').textContent = `${chars} chars • ${words} words`;
        }

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); saveLocalNote(); }
            if (e.key === 'Escape') {
                const drawer = document.getElementById('history-drawer');
                if (!drawer.classList.contains('hidden')) toggleHistory();
            }
        });

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('opacity-0', '-translate-y-4');
            setTimeout(() => { toast.classList.add('opacity-0', '-translate-y-4'); }, 2500);
        }

        function extractTitleAndBody(text) {
            const lines = text.split('\n');
            let title = lines[0].trim();
            let body = '';
            if (lines.length === 1) {
                if (title.length > 40) { title = title.substring(0, 40) + '...'; body = text.trim(); }
                else { body = text.trim(); }
            } else {
                title = title.substring(0, 100);
                body = lines.slice(1).join('\n').trim();
            }
            return { title, body };
        }

        function selectColor(color) {
            selectedColor = color;
            document.querySelectorAll('.color-dot').forEach(dot => {
                if (dot.dataset.color === color) dot.classList.add('selected');
                else dot.classList.remove('selected');
            });
            // Auto-update color if editing a note
            if (currentNoteId) {
                const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
                const noteIndex = history.findIndex(n => n.id === currentNoteId);
                if (noteIndex !== -1) {
                    history[noteIndex].color = selectedColor;
                    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
                }
            }
        }

        function togglePrivacyMode() {
            privacyMode = !privacyMode;
            const container = document.getElementById('editor-container');
            const btn = document.getElementById('privacy-btn');
            if (privacyMode) {
                container.classList.add('privacy-mode');
                btn.innerHTML = '<i class="fa-solid fa-eye-slash text-amber-500"></i>';
                btn.classList.add('bg-amber-100', 'dark:bg-amber-900/30');
            } else {
                container.classList.remove('privacy-mode');
                btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
                btn.classList.remove('bg-amber-100', 'dark:bg-amber-900/30');
            }
        }

        function clearEditorState() {
            input.value = '';
            localStorage.removeItem(DRAFT_KEY);
            currentNoteId = null;
            selectColor('gray');
            undoStack = [''];
            redoStack = [];
            
            document.getElementById('edit-banner').classList.add('hidden');
            
            // Reset main button back to creation mode
            const btnSave = document.getElementById('btn-save-local');
            btnSave.classList.replace('text-amber-500', 'text-gray-600');
            btnSave.classList.replace('dark:text-amber-500', 'dark:text-gray-300');
            document.getElementById('label-save-local').textContent = 'Save to Device';
            
            updateWordCount();
            updateUndoUI();
            input.focus();
        }

        // 1. PUSH TO TASKTRACKR (Direct Injection + New Tab)
        function pushToTaskTrackr() {
            const text = input.value.trim();
            if (!text) return showToast('Note is empty');
            const { title, body } = extractTitleAndBody(text);

            const tempId = 'temp_nt_' + Date.now();
            const nowIso = new Date().toISOString();
            
            const tempTask = {
                id: tempId, title: title, content: body, projectId: 'inbox', priority: 0, status: 0,
                dueDate: null, isAllDay: false, source: 'notetrackr', contextMode: 'inherit', _depth: 0, tags: [],
                editHistory: [{ action: 'Created from NoteTrackr', timestamp: nowIso }]
            };
            const payload = { title: title, content: body, parentId: null, priority: 0, tags: [], isAllDay: false, startDate: null, dueDate: null, completedAt: null, repeatFlag: null, status: 0, items: [] };

            const pendingTasks = JSON.parse(localStorage.getItem('pendingTasks') || '[]');
            pendingTasks.push({ tempId, destination: 'ticktick', payload, isEdit: false, mergedTask: tempTask });
            localStorage.setItem('pendingTasks', JSON.stringify(pendingTasks));

            const taskCache = JSON.parse(localStorage.getItem('ticktrackr_tasks') || '[]');
            taskCache.push(tempTask);
            localStorage.setItem('ticktrackr_tasks', JSON.stringify(taskCache));

            clearEditorState();
            showToast('Injected into TaskTrackr!');
            window.open('/tasktrackr/', '_blank');
        }

        // 2. PUSH TO LOGGR (Direct Injection + New Tab)
        function pushToLoggr() {
            const text = input.value.trim();
            if (!text) return showToast('Note is empty');
            const now = new Date();
            
            const pendingLogs = JSON.parse(localStorage.getItem('pendingLogs') || '[]');
            pendingLogs.push({
                attributeName: "Quick Note",
                attributeValue: text,
                tags: ["notetrackr", "note"],
                date: now.toISOString(),
                createdAt: { seconds: Math.floor(now.getTime() / 1000), nanoseconds: 0 },
                collectionName: "manual",
                docId: 'note_' + Date.now() + Math.random().toString(36).substring(2,9)
            });
            localStorage.setItem('pendingLogs', JSON.stringify(pendingLogs));
            
            clearEditorState();
            showToast('Sent to Loggr!');
            window.open('/log/', '_blank');
        }

        // 3. SAVE LOCAL ONLY (Update or Create)
        function saveLocalNote() {
            const text = input.value.trim();
            if (!text) return showToast('Note is empty');

            const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            
            if (currentNoteId) {
                // If editing, changes were already auto-saved. 
                // Clicking this acts as a "Done" button to exit the editor.
                showToast('Edit Mode Closed');
                clearEditorState();
            } else {
                // Create new
                history.unshift({
                    id: 'local_' + Date.now(),
                    text: text,
                    date: new Date().toISOString(),
                    color: selectedColor,
                    pinned: false
                });
                localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
                showToast('Saved to Device');
                clearEditorState();
            }
            
            renderHistory();
        }

        function toggleHistory() {
            const drawer = document.getElementById('history-drawer');
            if (drawer.classList.contains('hidden')) {
                renderHistory();
                drawer.classList.remove('hidden');
                setTimeout(() => { drawer.classList.remove('translate-y-full'); }, 10);
            } else {
                drawer.classList.add('translate-y-full');
                setTimeout(() => { drawer.classList.add('hidden'); }, 300);
            }
        }

        function togglePin(id, event) {
            event.stopPropagation();
            const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            const note = history.find(n => n.id === id);
            if (note) {
                note.pinned = !note.pinned;
                localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
                renderHistory();
            }
        }

        function renderHistory() {
            let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            const list = document.getElementById('history-list');
            
            if (history.length === 0) {
                list.innerHTML = `<div class="text-center p-8 text-gray-500 italic border-2 border-dashed border-gray-200 dark:border-gray-800 rounded-2xl">No device notes yet.</div>`;
                return;
            }

            history.sort((a, b) => {
                if (a.pinned && !b.pinned) return -1;
                if (!a.pinned && b.pinned) return 1;
                return new Date(b.date) - new Date(a.date);
            });
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));

            const colorMap = {
                'gray': 'border-gray-200 dark:border-gray-800',
                'blue': 'border-blue-500/50 bg-blue-50/10 dark:bg-blue-900/10',
                'green': 'border-green-500/50 bg-green-50/10 dark:bg-green-900/10',
                'red': 'border-red-500/50 bg-red-50/10 dark:bg-red-900/10'
            };

            list.innerHTML = history.map(note => {
                const date = new Date(note.date).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                const borderColor = colorMap[note.color || 'gray'] || colorMap['gray'];
                const pinIcon = note.pinned ? 'fa-solid text-amber-500 opacity-100' : 'fa-solid opacity-0 group-hover:opacity-100';
                
                return `
                    <div class="bg-[var(--card)] border ${borderColor} rounded-2xl p-4 shadow-sm group hover:shadow-md transition-all cursor-pointer" onclick="loadNoteToEditor('${note.id}')">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-bold text-gray-400 uppercase tracking-widest flex items-center gap-2">
                                <i class="fa-regular fa-clock"></i> ${date}
                            </span>
                            <div class="flex gap-3">
                                <button onclick="togglePin('${note.id}', event)" class="text-gray-400 hover:text-amber-500 transition-colors w-6 h-6 flex items-center justify-center ${note.pinned ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'}" title="Pin Note"><i class="${pinIcon} fa-thumbtack"></i></button>
                                <button onclick="deleteNote('${note.id}', event)" class="text-gray-400 hover:text-red-500 transition-colors w-6 h-6 flex items-center justify-center opacity-0 group-hover:opacity-100" title="Delete Note"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                        <p class="text-sm text-gray-700 dark:text-gray-300 whitespace-pre-wrap line-clamp-4 leading-relaxed">${note.text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</p>
                    </div>
                `;
            }).join('');
        }

        function loadNoteToEditor(id) {
            const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            const note = history.find(n => n.id === id);
            if (!note) return;

            if (input.value.trim() && !currentNoteId && input.value !== note.text) {
                // We were drafting a new note. Save it before loading this one.
                saveLocalNote(); 
            }

            input.value = note.text;
            localStorage.setItem(DRAFT_KEY, note.text);
            selectColor(note.color || 'gray');
            currentNoteId = note.id;
            
            // Transform UI into "Edit Mode"
            document.getElementById('edit-banner').classList.remove('hidden');
            
            const btnSave = document.getElementById('btn-save-local');
            btnSave.classList.replace('text-gray-600', 'text-amber-500');
            btnSave.classList.replace('dark:text-gray-300', 'dark:text-amber-500');
            document.getElementById('label-save-local').textContent = 'Done Editing';
            
            undoStack = [note.text];
            redoStack = [];
            updateWordCount();
            updateUndoUI();
            
            toggleHistory();
            input.focus();
        }

        function deleteNote(id, event) {
            event.stopPropagation();
            if (!confirm("Delete this device note permanently?")) return;
            let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            history = history.filter(n => n.id !== id);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            
            if (currentNoteId === id) clearEditorState();
            
            renderHistory();
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
