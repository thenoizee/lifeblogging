        // HELPER: Centralized Cache Invalidator
        // Flushes all progress and history caches whenever data changes so stats and queues stay in sync
        window.invalidateProgressCaches = () => {
            if (!currentUser) return;
            // 1. Invalidate Lifetime Stats & History Caches
            // FIX: We intentionally DO NOT delete full history cache here to prevent massive read spikes.
            // It is now smartly updated via unshift() and filter() in the logging functions natively.
            
            // 2. Invalidate Up Next Cache
            localStorage.removeItem('vidtrackr_smart_up_next_local_v5');
            localStorage.removeItem('vidtrackr_smart_up_next_local_v5_timestamp');
            
            // 3. Invalidate Session Progress Snapshot so Progress tab re-evaluates
            sessionStorage.removeItem('vidtrackr_local_progress');
        };

        // New Database Helper: Logs completed or partial watches securely to Firebase
        // Updated to accept a platform parameter to log where it was watched
        window.logWatchToFirebase = async (item, type, progress, date, rating = null, platform = null, isImport = false) => {
            if (!currentUser) return false;
            try {
                // Robust ID extraction for movies, shows, and episodes
                let targetId = item.ids?.trakt || item.ids?.tmdb || item.id;
                
                // For episodes, prefer the TMDB composite ID so it natively matches the TMDB router 
                // and correctly loads older history from the DB without hitting the 200-item fallback limit.
                if (type === 'episode') {
                    const sTmdb = item.show?.ids?.tmdb;
                    const s = item.season !== undefined ? item.season : item.season_number;
                    const e = item.number !== undefined ? item.number : item.episode_number;
                    if (sTmdb && s !== undefined && e !== undefined) {
                        targetId = `${sTmdb}-${s}-${e}`;
                    } else if (!targetId) {
                        targetId = item.show?.ids?.tmdb || item.show?.ids?.trakt;
                    }
                } else if (item.ids?.tmdb) {
                    // Prefer TMDB ID for movies/shows for cross-platform consistency
                    targetId = item.ids.tmdb;
                }

                const payload = {
                    type: type,
                    media: item,
                    progress: progress,
                    watchedAt: date,
                    loggedAt: new Date().toISOString(),
                    itemId: targetId ? String(targetId) : null
                };
                // Append platform if a tag was selected
                if (platform) payload.platform = platform;
                
                if (rating) {
                    payload.rating = parseInt(rating);
                    payload.ratedAt = new Date().toISOString();
                }

                // Create a deterministic ID to prevent duplicates (Item ID + Exact Watch Timestamp)
                const safeDateId = new Date(date).getTime() || Date.now();
                const docId = targetId ? `${targetId}_${safeDateId}` : null;
                
                // If we have a deterministic ID, use it to safely upsert and prevent duplicate imports. 
                // Otherwise, fallback to generating a random document ID.
                const docRef = docId 
                    ? doc(db, `users/${currentUser.uid}/history`, docId) 
                    : doc(collection(db, `users/${currentUser.uid}/history`));

                // We use setDoc with merge:true and a deterministic ID (Item ID + Watch Timestamp) 
                // to automatically upsert data. This prevents duplicate entries while completely 
                // eliminating the need for an expensive getDoc() read operation before writing!
                await setDoc(docRef, payload, { merge: true });
                
                // Smartly update the local full history cache to prevent aggressive invalidations
                try {
                    const histCacheKey = `vidtrackr_full_history_${currentUser.uid}`;
                    const cachedHist = localStorage.getItem(histCacheKey);
                    if (cachedHist) {
                        let histArr = JSON.parse(cachedHist);
                        histArr.unshift({ ...payload, _docId: docId });
                        if (histArr.length > 2500) histArr = histArr.slice(0, 2500);
                        localStorage.setItem(histCacheKey, JSON.stringify(histArr));
                    }
                } catch(e) { console.warn("Failed to update history cache locally", e); }
                
                // --- NoSQL Denormalization for Series Progress ---
                // We only execute this if it's NOT a bulk import to protect your database read costs.
                if (type === 'episode' && progress >= 100 && !isImport) {
                    const showTmdbId = item.show?.ids?.tmdb || item.show?.ids?.trakt;
                    const s = parseInt(item.season !== undefined ? item.season : item.season_number);
                    const e = parseInt(item.number !== undefined ? item.number : item.episode_number);
                    
                    if (showTmdbId && !isNaN(s) && !isNaN(e)) {
                        const progressRef = doc(db, `users/${currentUser.uid}/series_progress`, String(showTmdbId));
                        const pSnap = await getDoc(progressRef);
                        let maxS = s, maxE = e;
                        
                        if (pSnap.exists()) {
                            const pData = pSnap.data();
                            maxS = pData.maxSeason || 1;
                            maxE = pData.maxEpisode || 1;
                            if (s > maxS || (s === maxS && e > maxE)) {
                                maxS = s;
                                maxE = e;
                            }
                        }
                        
                        await setDoc(progressRef, {
                            showTmdbId: showTmdbId,
                            showObj: item.show,
                            maxSeason: maxS,
                            maxEpisode: maxE,
                            lastWatchedAt: date || new Date().toISOString()
                        }, { merge: true });
                    }
                }
                
                // Bust all progress, history, and Up Next caches so all tabs update immediately
                window.invalidateProgressCaches();
                
                return true;
            } catch (e) {
                console.error("Firebase Log Error:", e);
                return false;
            }
        };

        async function handleAction(actionType) {
            if (!currentModalItem || !currentModalItem.item || !currentModalItem.item.ids) {
                showToast("Error: Invalid item data", "error");
                els.modal.classList.add('hidden');
                return;
            }

            els.modal.classList.add('hidden'); 
            showLoader(); 
            
            // Support both TMDB IDs and Trakt IDs seamlessly
            const traktId = currentModalItem.item.ids.trakt || currentModalItem.item.id;
            const type = currentModalItem.type;
            const rootKey = type === 'episode' ? 'episodes' : (type === 'show' ? 'shows' : 'movies'); 
            const ids = { ids: { trakt: traktId } }; 
            
            // Get inputs
            const dateStr = document.getElementById('custom-date').value; 
            const date = dateStr ? new Date(dateStr).toISOString() : selectedDate; 
            const rating = parseInt(els.ratingSlider.value); 
            const minutes = parseInt(document.getElementById('custom-progress').value);
            const runtime = currentModalItem.item.runtime || 0;

            try { 
                // 1. Handle Rating
                if (actionType === 'rate-only' || actionType === 'rate-log') {
                    // Only push rating to Trakt if explicitly enabled
                    if (traktAccessToken && primaryDataSource === 'trakt') {
                        const payloadRate = { [rootKey]: [{ ...ids, rating: rating, rated_at: new Date().toISOString() }] }; 
                        await fetch(`${TRAKT_API_URL}/sync/ratings`, { method: 'POST', headers: traktHeader(), body: JSON.stringify(payloadRate) }); 
                    }
                    // Push rating to Firebase Local DB
                    if (currentUser) {
                        await setDoc(doc(db, `users/${currentUser.uid}/ratings`, String(traktId)), { rating: rating, ratedAt: new Date().toISOString() }, { merge: true });
                    }
                    userRatings.set(parseInt(traktId), rating); 
                    userRatingDetails.set(parseInt(traktId), { rating: rating, ratedAt: new Date().toISOString() });
                    if(actionType === 'rate-only') showToast(`Rated ${rating}/10`);
                }

                // 2. Handle Logging vs Scrobbling (Partial Watch)
                if (actionType !== 'rate-only') {
                    let progress = 100;
                    if (minutes > 0 && runtime > 0 && minutes < runtime) {
                        progress = Math.min(100, (minutes / runtime) * 100);
                    }
                    
                    const passedRating = (actionType === 'rate-log') ? rating : null;
                    
                    // A. Log to your independent Firebase database
                    if (progress < 100 && currentUser) {
                        // Save partial progress locally
                        const pbPayload = { id: traktId, progress: progress, type: type, paused_at: new Date().toISOString(), [type === 'episode' ? 'episode' : 'movie']: currentModalItem.item, show: currentModalItem.item.show || null };
                        await setDoc(doc(db, `users/${currentUser.uid}/playback`, String(traktId)), pbPayload);
                        userPlayback.set(parseInt(traktId), pbPayload);
                        
                        localStorage.removeItem('vidtrackr_smart_up_next_local_v5');
                        localStorage.removeItem('vidtrackr_smart_up_next_local_v5_timestamp');
                    } else if (progress >= 100) {
                        // Log full watch with platform info and clear partial progress
                        await window.logWatchToFirebase(currentModalItem.item, type, progress, date, passedRating, selectedPlatform);
                        if (currentUser) await deleteDoc(doc(db, `users/${currentUser.uid}/playback`, String(traktId)));
                        userPlayback.delete(parseInt(traktId));
                    }
                    
                    // B. Log to Trakt (Only if enabled and authenticated)
                    if (traktAccessToken && primaryDataSource === 'trakt') {
                        if (progress < 100) {
                            const payloadScrobble = { [type === 'episode' ? 'episode' : 'movie']: { ...ids }, progress: progress, app_version: "1.0" };
                            await fetch(`${TRAKT_API_URL}/scrobble/stop`, { method: 'POST', headers: traktHeader(), body: JSON.stringify(payloadScrobble) });
                        } else {
                            const payloadLog = { [rootKey]: [{ ...ids, watched_at: date }] }; 
                            await fetch(`${TRAKT_API_URL}/sync/history`, { method: 'POST', headers: traktHeader(), body: JSON.stringify(payloadLog) }); 
                        }
                    }
                    
                    showToast(progress < 100 ? `Progress updated to ${Math.round(progress)}%` : `Logged as Watched`);

                    // --- BINGE-WATCHER AUTO-ADVANCE ---
                    if (progress >= 100 && type === 'episode' && location.hash.startsWith('#detail')) {
                        const sNum = currentModalItem.item.season || currentModalItem.item.season_number;
                        const eNum = currentModalItem.item.number || currentModalItem.item.episode_number;
                        const showTmdbId = currentModalItem.item.show?.ids?.tmdb || currentModalItem.item.show?.ids?.trakt;
                        
                        if (showTmdbId) {
                            let advanceModal = document.getElementById('auto-advance-modal');
                            if (!advanceModal) {
                                document.body.insertAdjacentHTML('beforeend', `
                                    <div id="auto-advance-modal" class="fixed inset-0 bg-black/90 flex items-center justify-center z-[100] hidden backdrop-blur-md px-4 animate-fade">
                                        <div class="card p-8 rounded-3xl shadow-2xl max-w-sm w-full border border-gray-700 text-center">
                                            <div class="w-16 h-16 bg-green-500/20 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4 border border-green-500/50 shadow-[0_0_15px_rgba(34,197,94,0.3)]">
                                                <i class="fa-solid fa-check text-2xl"></i>
                                            </div>
                                            <h3 class="text-2xl font-bold mb-2 text-white">Episode Logged!</h3>
                                            <p class="text-gray-400 mb-8 text-sm">Would you like to auto-advance to the next episode?</p>
                                            <div class="grid grid-cols-2 gap-3">
                                                <button id="btn-advance-no" class="bg-gray-800 hover:bg-gray-700 text-gray-300 py-3 rounded-xl font-bold transition border border-gray-700">Stay Here</button>
                                                <button id="btn-advance-yes" class="bg-[var(--primary)] hover:bg-red-700 text-white py-3 rounded-xl font-bold transition shadow-[0_0_15px_rgba(237,34,36,0.3)] flex items-center justify-center gap-2">Next Ep <i class="fa-solid fa-forward-step"></i></button>
                                            </div>
                                        </div>
                                    </div>
                                `);
                                advanceModal = document.getElementById('auto-advance-modal');
                            }
                            
                            document.getElementById('btn-advance-no').onclick = () => advanceModal.classList.add('hidden');
                            document.getElementById('btn-advance-yes').onclick = () => {
                                advanceModal.classList.add('hidden');
                                window.navigateEpisode(showTmdbId, sNum, eNum + 1);
                            };
                            
                            advanceModal.classList.remove('hidden');
                        }
                    }
                }
                
                // Refresh Views
                if (location.hash.startsWith('#detail')) {
                     const parts = location.hash.split('/');
                     if(parts[3] === 'season' && parts[4]) renderDetail(parts[1], parts[2], parts[4]);
                     else renderDetail(parts[1], parts[2]);
                }
                if (document.getElementById('up-next-container')) loadUpNext(); 
                if (document.getElementById('last-watched-container')) loadLastWatched();

            } catch(e) { console.error(e); showToast('Action failed', 'error'); } 
            hideLoader(); 
        }

        async function loadSearch(rawQuery) {
            if (!rawQuery) return;
            
            // Increment and capture current request token to drop older pending requests
            const currentRequestId = ++activeSearchRequestId;
            showLoader();
            
            // Decode search string properly
            const query = decodeURIComponent(rawQuery).trim();
            const cleanQuery = query.toLowerCase();

            // Add debugging to trace query execution
            console.log(`[Debug] Executing search for query: "${query}" (Request ID: ${currentRequestId})`);
            
            // Render placeholder search state immediately
            els.content.innerHTML = `
                <div class="mb-6 mt-4 animate-fade">
                    <h2 class="text-2xl font-bold border-l-4 border-[var(--primary)] px-3 mb-6">Results: "${query}"</h2>
                    <div class="flex items-center gap-3 text-gray-500 p-4">
                        <div class="animate-spin rounded-full h-5 w-5 border-2 border-[var(--primary)] border-t-transparent"></div>
                        <span class="text-sm font-bold uppercase tracking-widest">Searching...</span>
                    </div>
                </div>
            `;

            // Keep input text boxes synced with active URL query
            const dSearch = document.getElementById('search-input');
            const mSearch = document.getElementById('mobile-search-input');
            if (dSearch && dSearch.value !== query) dSearch.value = query;
            if (mSearch && mSearch.value !== query) mSearch.value = query;

            try {
                // Fetch from TMDB using the multi-search endpoint
                const rawData = await fetchTMDB(`/search/multi?query=${encodeURIComponent(query)}&include_adult=false`);
                
                // Abort if another search was triggered while waiting for the network
                if (currentRequestId !== activeSearchRequestId || !location.hash.startsWith('#search')) {
                    return;
                }

                let rawResults = rawData.results || [];

                // Normalize media types
                let data = rawResults.map(item => ({
                    ...item,
                    type: item.media_type === 'tv' ? 'show' : item.media_type
                }));

                // Filter out low-quality bootlegs, empty entries, and entries with 0 votes and no images
                data = data.filter(item => {
                    const hasImage = !!(item.poster_path || item.backdrop_path || item.profile_path);
                    const voteCount = item.vote_count || 0;
                    const pop = item.popularity || 0;

                    // Keep items that have artwork or reasonable engagement
                    if (!hasImage && voteCount === 0 && pop < 2.0) return false;
                    return true;
                });

                // Prioritize proper shows and movies over one-offs, low-rated entries, and persons
                data.sort((a, b) => {
                    const titleA = (a.title || a.name || '').toLowerCase().trim();
                    const titleB = (b.title || b.name || '').toLowerCase().trim();

                    // 1. Exact title match priority
                    const exactA = titleA === cleanQuery;
                    const exactB = titleB === cleanQuery;
                    if (exactA && !exactB) return -1;
                    if (exactB && !exactA) return 1;

                    // 2. Starts-with title match priority
                    const startsA = titleA.startsWith(cleanQuery);
                    const startsB = titleB.startsWith(cleanQuery);
                    if (startsA && !startsB) return -1;
                    if (startsB && !startsA) return 1;

                    // 3. Media type priority: shows and movies always take precedence over person results
                    const isMediaA = a.type === 'show' || a.type === 'movie';
                    const isMediaB = b.type === 'show' || b.type === 'movie';
                    if (isMediaA && !isMediaB) return -1;
                    if (isMediaB && !isMediaA) return 1;

                    // 4. Weight by vote count and popularity to surface official releases
                    const scoreA = (a.popularity || 0) + ((a.vote_count || 0) * 0.1);
                    const scoreB = (b.popularity || 0) + ((b.vote_count || 0) * 0.1);
                    return scoreB - scoreA;
                });

                if (data.length === 0) {
                    els.content.innerHTML = `<div class="text-center p-20 text-gray-500 animate-fade"><i class="fa-solid fa-magnifying-glass text-6xl mb-4 opacity-50"></i><p>No results found for "${query}".</p></div>`;
                } else {
                    renderGrid(`Results: "${query}"`, data);
                }
            } catch (e) {
                console.error(e);
                showToast('Search failed', 'error');
            } finally {
                if (currentRequestId === activeSearchRequestId) {
                    hideLoader();
                }
            }
        }

                        const fallbackId = dataObj.ids?.trakt || dataObj.ids?.tmdb || dataObj.id || itemId;
                        
                        const imgEl = document.getElementById(`list-img-${rawItem.type}-${fallbackId}`);
                        const newImg = getImage(enrichedData, rawItem.type);
                        
                        if (imgEl && newImg && newImg !== PLACEHOLDER_IMG && !imgEl.src.includes(newImg)) {
                            imgEl.style.opacity = 0;

                        }
                        
                        const titleEl = document.getElementById(`list-title-${rawItem.type}-${fallbackId}`);
                        if (titleEl && rawItem.type === 'episode') {
                            const sTitle = enrichedData.show?.title || enrichedData.show?.name || rawItem.show?.title || rawItem.show?.name;
                            const epTitle = enrichedData.title || enrichedData.name;
                            if (sTitle && epTitle) {

                                if (titleEl.innerText !== expectedTitle) {
                                    titleEl.innerText = expectedTitle;
                                    titleEl.title = expectedTitle;
                                }
                            }
                        }
                    });
                };

                renderGridLocal('rank');
                document.getElementById('list-sort-select').onchange = (e) => renderGridLocal(e.target.value);

            } catch (e) { 
                console.error(e);
                showToast('Could not load list items', 'error'); 
            } 
            hideLoader(); 
        }

                <div id="upcoming-movies-container" class="mb-12">
                    <div class="flex items-center gap-3 text-gray-500 p-4"><div class="animate-spin rounded-full h-5 w-5 border-2 border-[var(--primary)] border-t-transparent"></div> <span class="text-sm font-bold uppercase tracking-widest">Loading Movies in Release Order...</span></div>
                </div>
                <div id="popular-shows-upcoming" class="mb-12"></div>
            `;

            // Calculate exact date ranges
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];
            const future = new Date(today);
            future.setDate(future.getDate() + 45); // Check 45 days into the future
            const futureStr = future.toISOString().split('T')[0];

            // 1. PERSONALIZED SHOWS: Checks new episodes for shows you actually watch
            // BUMPED CACHE KEY TO _v3 TO FLUSH THE PREVIOUSLY CRASHED EMPTY STATE
            runSmart('upcoming_tracked_shows_v3',
                async () => {
                    const upcomingEpisodes = [];

                    // 1A. If connected to Trakt, pull personal calendar directly
                    if (traktAccessToken && primaryDataSource === 'trakt') {
                        try {
                            console.log("[Debug] Fetching Trakt user calendar...");
                            const calendar = await fetchDirect(`/calendars/my/shows/${todayStr}/45?extended=images`);
                            if (calendar && calendar.length > 0) {
                                calendar.forEach(item => {
                                    upcomingEpisodes.push({
                                        ...item.episode,
                                        show: item.show,
                                        type: 'episode',
                                        air_date: item.first_aired ? item.first_aired.split('T')[0] : item.episode?.air_date,
                                        ids: item.episode?.ids || item.show?.ids
                                    });
                                });
                            }
                        } catch(e) { console.warn("Trakt calendar fetch failed", e); }
                    }

                    // 1B. TMDB Mode: Collect all unique show IDs from user history & check next_episode_to_air
                    if (upcomingEpisodes.length === 0 && currentUser) {
                        try {
                            console.log("[Debug] Cross-referencing user history for upcoming TMDB episodes...");
                            const trackedShowTmdbIds = new Set();

                            // Extract show IDs from local in-memory history cache
                            if (window.globalHistoryCache && window.globalHistoryCache.length > 0) {
                                window.globalHistoryCache.forEach(h => {
                                    if (h.type === 'episode' && h.media) {
                                        const showId = h.media.show?.ids?.tmdb || h.media.ids?.show_tmdb || h.media.show?.id;
                                        if (showId) trackedShowTmdbIds.add(String(showId));
                                    }
                                });
                            }

                            // Also fetch any shows in user's watchlist
                            const wlSnap = await getDocs(collection(db, `users/${currentUser.uid}/watchlist`));
                            wlSnap.forEach(d => {
                                const wData = d.data();
                                if (wData.type === 'show') {
                                    const showId = wData.show?.ids?.tmdb || wData.show?.id || wData.id;
                                    if (showId) trackedShowTmdbIds.add(String(showId));
                                }
                            });

                            // Limit check to the top 20 active shows to respect API limits
                            const showIdList = Array.from(trackedShowTmdbIds).slice(0, 20);
                            
                            // Query show metadata from TMDB in parallel
                            const showDetails = await Promise.all(showIdList.map(sId => fetchTMDB(`/tv/${sId}`).catch(() => null)));

                            showDetails.forEach(show => {
                                if (show && show.next_episode_to_air) {
                                    const nextEp = show.next_episode_to_air;
                                    // Only include if air date is today or in the future
                                    if (nextEp.air_date && nextEp.air_date >= todayStr) {
                                        upcomingEpisodes.push({
                                            title: nextEp.name || `Episode ${nextEp.episode_number}`,
                                            name: nextEp.name,
                                            season: nextEp.season_number,
                                            number: nextEp.episode_number,
                                            air_date: nextEp.air_date,
                                            release_date: nextEp.air_date,
                                            still_path: nextEp.still_path,
                                            poster_path: show.poster_path,
                                            backdrop_path: show.backdrop_path,
                                            type: 'episode',
                                            show: {
                                                title: show.name,
                                                name: show.name,
                                                ids: { tmdb: show.id }
                                            },
                                            ids: {
                                                tmdb: nextEp.id,
                                                trakt: `${show.id}-${nextEp.season_number}-${nextEp.episode_number}`
                                            }
                                        });
                                    }
                                }
                            });
                        } catch(e) { console.warn("Failed checking tracked show air dates", e); }
                    }

                    // Sort chronologically by air date (earliest first)
                    upcomingEpisodes.sort((a, b) => new Date(a.air_date || a.release_date) - new Date(b.air_date || b.release_date));
                    return upcomingEpisodes;
                },
                (items) => {
                    const container = document.getElementById('tracked-shows-upcoming');
                    if (!container) return;
                    if (items.length > 0) {
                        const gridHtml = `
                            <h2 class="text-2xl font-bold mb-6 mt-8 px-2 border-l-4 border-yellow-500 animate-fade">Your Shows: New Episodes Coming Soon</h2>
                            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6 mb-8 animate-fade">
                                ${items.map(item => createCardHtml(item)).join('')}
                            </div>
                        `;
                        container.innerHTML = gridHtml;
                    } else {
                        container.innerHTML = `
                            <div class="bg-gray-900/50 p-6 rounded-2xl border border-gray-800 text-center text-gray-500">
                                <i class="fa-solid fa-calendar-check text-3xl mb-2 text-yellow-500/50"></i>
                                <p class="text-sm">No new upcoming episodes scheduled for your tracked shows in the next 45 days.</p>
                            </div>
                        `;
                    }
                },
                14400000 // 4-hour TTL for live calendar
            );

            // 2. UPCOMING MOVIES: Strict release date filter & sorted by release date ascending
            runSmart('upcoming_movies_chronological',
                async () => {
                    console.log("[Debug] Fetching upcoming theatrical movies...");
                    const data = await fetchTMDB(`/discover/movie?region=US&with_release_type=2|3&primary_release_date.gte=${todayStr}&primary_release_date.lte=${futureStr}&sort_by=primary_release_date.asc`);
                    let movies = data.results || [];
                    
                    // Filter out legacy re-releases with old release dates
                    movies = movies.filter(m => m.release_date && m.release_date >= todayStr && m.release_date <= futureStr);
                    
                    // Explicitly sort by release date ascending (soonest first)
                    movies.sort((a, b) => new Date(a.release_date) - new Date(b.release_date));
                    
                    return movies.map(item => ({ ...item, type: 'movie' })).slice(0, 15);
                },
                (items) => {
                    const container = document.getElementById('upcoming-movies-container');
                    if (!container) return;
                    if (items.length > 0) {
                        renderGrid('Movies in Theatres Soon (By Release Date)', items, false, 'upcoming-movies-container');
                    } else {
                        container.innerHTML = `<p class="text-gray-500 text-sm italic">No upcoming movies found in this window.</p>`;
                    }
                },
                43200000 // 12-hour TTL
            );

            // 3. NEW SERIES PREMIERING SOON: Sorted strictly by premiere date ascending
            runSmart('upcoming_shows_chronological_v2',
                async () => {
                    console.log("[Debug] Fetching new series premiering soon...");
                    // Use first_air_date to get BRAND NEW series premieres, ensuring the date matches the UI display
                    const data = await fetchTMDB(`/discover/tv?with_original_language=en&first_air_date.gte=${todayStr}&first_air_date.lte=${futureStr}&sort_by=first_air_date.asc`);
                    let shows = data.results || [];
                    
                    // Filter out older shows and sort earliest premiere first
                    shows = shows.filter(s => s.first_air_date && s.first_air_date >= todayStr && s.first_air_date <= futureStr);
                    shows.sort((a, b) => new Date(a.first_air_date) - new Date(b.first_air_date));
                    
                    return shows.map(item => ({ ...item, type: 'show' })).slice(0, 15);
                },
                (items) => {
                    const container = document.getElementById('popular-shows-upcoming');
                    if (!container) return;
                    if (items.length > 0) {
                        renderGrid('New Series Premiering Soon (By Premiere Date)', items, false, 'popular-shows-upcoming');
                    }
                },
                43200000 // 12-hour TTL
            );
        }

        function handleRoute() {
        const hash = location.hash || '#dashboard';
        
        // FIX: Only update Nav Highlight if we are on a main tab
        const rootTab = hash.split('/')[0].replace('#', '');
        const mainTabs = ['dashboard', 'library', 'progress', 'history', 'settings'];
        
        if (mainTabs.includes(rootTab)) {
            nav.switchTab(rootTab);
        }

        // Render Page Content
        if(hash.startsWith('#dashboard')) renderDashboard();
        else if(hash.startsWith('#library')) renderLibrary(); 
        else if(hash.startsWith('#watchlist')) renderLibrary('watchlist'); 
        else if(hash.startsWith('#upcoming')) renderUpcoming();
        else if(hash.startsWith('#history')) renderHistory();
        else if(hash.startsWith('#progress')) renderProgress();
        else if(hash.startsWith('#settings')) renderSettings();
        else if(hash === '#lists') renderLibrary('lists'); 
        else if(hash.startsWith('#lists/')) renderListItems(hash.split('/')[1]);
        // Extract the full query string past the '#search/' prefix, preserving inner slashes
        else if(hash.startsWith('#search/')) loadSearch(hash.substring(8));
        else if(hash.startsWith('#detail')) {
            const parts = hash.split('/');
            // FIX: Prevent loading if IDs are undefined
            if (parts[1] === 'undefined' || parts[2] === 'undefined' || !parts[2]) {
                console.error("Invalid Route Parameters detected. Redirecting to dashboard.");
                location.hash = '#dashboard';
                return;
            }

            if (parts[1] === 'person') renderPerson(parts[2]);
            else if(parts[3] === 'season' && parts[4]) renderDetail(parts[1], parts[2], parts[4]);
            else renderDetail(parts[1], parts[2]);
        }
    }
        window.addEventListener('hashchange', handleRoute);

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                if (location.hash.startsWith('#history')) {
                    renderHistory(1); 
                }
            }
        });

        // --- Progress Slider Logic ---
const slider = document.getElementById('progress-slider');
const numInput = document.getElementById('custom-progress');
const percentDisplay = document.getElementById('progress-percent-display');

// Sync Slider -> Number Input
slider.addEventListener('input', (e) => {
    const pct = parseInt(e.target.value);
    percentDisplay.innerText = `${pct}%`;
    if(currentModalItem && currentModalItem.item.runtime) {
        numInput.value = Math.round((pct / 100) * currentModalItem.item.runtime);
    }
});

// Sync Number Input -> Slider
numInput.addEventListener('input', (e) => {
    if(currentModalItem && currentModalItem.item.runtime) {
        const val = parseInt(e.target.value) || 0;
        const pct = Math.min(100, Math.round((val / currentModalItem.item.runtime) * 100));
        slider.value = pct;
        percentDisplay.innerText = `${pct}%`;
    }
});

// "Mark 100% Watched" Button Handler
document.getElementById('btn-mark-watched').onclick = () => {
    if(currentModalItem && currentModalItem.item.runtime) {
        slider.value = 100;
        numInput.value = currentModalItem.item.runtime;
        handleAction('log-only'); // This will trigger the "Full Watch" logic in handleAction
    }
};

        els.ratingSlider.oninput = (e) => els.ratingValue.innerText = e.target.value;
        // --- Search Listener ---
    const searchHandler = debounce((e) => {
        const val = e.target.value.trim();
        // Add encoding to handle spaces and symbols (like '?') securely
        if (val.length > 1) location.hash = `#search/${encodeURIComponent(val)}`; 
        // Only trigger history back if we are actively viewing a search results page
        else if (val.length === 0 && location.hash.startsWith('#search')) history.back();
    }, 600);

    // Attach to the NEW dynamically injected input
    const desktopSearch = document.getElementById('search-input');
    if (desktopSearch) desktopSearch.addEventListener('input', searchHandler);
    
    // Attach to the existing mobile input
    const mobileSearch = document.getElementById('mobile-search-input');
    if (mobileSearch) mobileSearch.addEventListener('input', searchHandler);

        document.addEventListener('click', e => {
            const btn = e.target.closest('.scrobble-btn');
            if (btn) {
                const data = JSON.parse(btn.dataset.json);
                // FIX: Trust the type in the JSON data first. 
                // Only fall back to dataset logic if data.type is missing.
                const itemType = data.type || (btn.dataset.type === 'show' ? 'episode' : 'movie');
                
                currentModalItem = { item: data, type: itemType };
                document.getElementById('custom-progress').value = ''; // Add this line
document.getElementById('modal-title').innerText = data.title;
                els.modal.classList.remove('hidden');
                if(data.runtime) {
        // Check if we have existing progress in userPlayback map
        const existing = userPlayback.get(parseInt(data.ids.trakt));
        const currentPct = existing ? existing.progress : 0;
        
        slider.value = Math.round(currentPct);
        percentDisplay.innerText = `${Math.round(currentPct)}%`;
        numInput.value = Math.round((currentPct/100) * data.runtime);
    }
                const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                document.getElementById('custom-date').value = now.toISOString().slice(0, 16);
                selectedDate = new Date().toISOString();
            }
            // ... (keep existing listeners for closing modal etc if you have them, otherwise just close the block)
            // Handle Platform selection visually and update state variable
            if(e.target.closest('.platform-option')) {
                const btn = e.target.closest('.platform-option');
                selectedPlatform = btn.dataset.platform;
                document.querySelectorAll('.platform-option').forEach(b => {
                    b.classList.remove('bg-[var(--primary)]', 'text-white', 'border-[var(--primary)]');
                });
                btn.classList.add('bg-[var(--primary)]', 'text-white', 'border-[var(--primary)]');
            }

            if(e.target.closest('.date-option')) {
                const type = e.target.closest('.date-option').dataset.date;
                const d = new Date(); if(type === 'yesterday') d.setDate(d.getDate()-1);
                selectedDate = d.toISOString();
                document.querySelectorAll('.date-option').forEach(b => b.classList.remove('border-[var(--primary)]', 'bg-[var(--primary)]/10'));
                e.target.closest('.date-option').classList.add('border-[var(--primary)]', 'bg-[var(--primary)]/10');
            }
            if(e.target.closest('#confirm-log')) handleAction('log-only');
            if(e.target.closest('#confirm-rate-log')) handleAction('rate-log');
            if(e.target.closest('#confirm-rate-only')) handleAction('rate-only');
            if(e.target.closest('#close-modal')) els.modal.classList.add('hidden');
        });

        // Show/hide Back to Top button based on scroll position to improve navigation on long lists
        window.addEventListener('scroll', () => {
            const btt = document.getElementById('back-to-top');
            if (btt) {
                if (window.scrollY > 500) {
                    btt.classList.remove('opacity-0', 'translate-y-10', 'pointer-events-none');
                    btt.classList.add('opacity-100', 'translate-y-0', 'pointer-events-auto');
                } else {
                    btt.classList.add('opacity-0', 'translate-y-10', 'pointer-events-none');
                    btt.classList.remove('opacity-100', 'translate-y-0', 'pointer-events-auto');
                }
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                // Only refresh if on history tab AND enough time has passed (e.g. 1 min)
                if (location.hash.startsWith('#history')) {
                    if (Date.now() - lastHistoryFetch > 60000) {
                        renderHistory(1); 
                    } else {
                        console.log("Skipping history refresh (Rate Limited)");
                    }
                }
            }
        });

       // --- AUTH LISTENER ---
    onAuthStateChanged(auth, async user => {
        currentUser = user;
        if (user) {
            // FIX: Update the Avatar using the new method
            nav.updateUser(user.email);

            // Re-bind dynamic elements
            els.searchContainer = document.getElementById('search-container');
            if(els.searchContainer) {
                els.searchContainer.classList.remove('hidden');
                // Re-attach listener if element was re-created
                document.getElementById('search-input').addEventListener('input', searchHandler);
            }

            // Sync Trakt Token (Existing Logic)
            try {
                const snap = await getDoc(doc(db, 'users', user.uid, 'services', 'trakt'));
                if (snap.exists() && snap.data().accessToken) { 
                    const dbToken = snap.data().accessToken;
                    if (traktAccessToken !== dbToken) {
                        traktAccessToken = dbToken;
                        localStorage.setItem('trakt_token', traktAccessToken);
                    }
                } else if (traktAccessToken) {
                    await setDoc(doc(db, 'users', user.uid, 'services', 'trakt'), { 
                        accessToken: traktAccessToken, updatedAt: new Date()
                    }, { merge: true });
                }
            } catch(e) { console.warn("Firestore sync error", e); }

            // Non-blocking background data syncs.
            // By NOT awaiting this block, the global loader drops instantly 
            // and the app routes to the Dashboard immediately.
            const backgroundSyncs = async () => {
                if (traktAccessToken) { 
                    await Promise.all([syncUserRatings(), syncPlayback()]);
                }
                await syncHiddenItems();
                
                // Silently refresh the localized UI once syncs are complete
                if (document.getElementById('up-next-container') && !document.getElementById('up-next-container').classList.contains('hidden')) {
                    if (typeof loadUpNext === 'function') loadUpNext();
                }
                if (document.getElementById('last-watched-container') && !document.getElementById('last-watched-container').classList.contains('hidden')) {
                    if (typeof loadLastWatched === 'function') loadLastWatched();
                }
            };
            backgroundSyncs();

            // Set up a single, persistent onSnapshot listener
            // By doing this once globally, we prevent exponential reads caused by destroying and 
            // recreating listeners on every page navigation.
            // Firebase's "Latency Compensation" will instantly fire this snapshot with local data
            // the millisecond a user logs a movie, providing a free Optimistic UI update.
            if (globalHistoryListener) globalHistoryListener(); // Clean up old listener if exists
            
            const qHistory = query(collection(db, `users/${currentUser.uid}/history`), orderBy("watchedAt", "desc"), limit(200));
            globalHistoryListener = onSnapshot(qHistory, (snapshot) => {
                window.globalHistoryCache = [];
                snapshot.forEach(doc => {
                    window.globalHistoryCache.push({ ...doc.data(), _docId: doc.id });
                });
                
                // Trigger Optimistic UI Re-renders automatically when data changes
                if (document.getElementById('last-watched-container') && !document.getElementById('last-watched-container').classList.contains('hidden')) loadLastWatched();
                if (document.getElementById('up-next-container') && !document.getElementById('up-next-container').classList.contains('hidden')) loadUpNext();
            });
            
            checkActiveWatching();
            handleRoute();
        } else {
            if (globalHistoryListener) {
                globalHistoryListener(); // Unsubscribe to prevent memory leaks
                globalHistoryListener = null;
            }
            window.globalHistoryCache = [];
            
            // Render Login Form (No changes needed here)
            els.content.innerHTML = `<div class="max-w-md mx-auto card p-10 rounded-2xl shadow-2xl mt-12 text-center animate-fade"><div class="mb-6 inline-block p-4 rounded-full bg-[var(--primary)]/10"><i class="fa-solid fa-ticket text-5xl text-[var(--primary)]"></i></div><h1 class="text-4xl font-bold mb-2 text-[var(--primary)]">VidTrackr</h1><p class="text-gray-400 mb-8">Sign in to track your movies and shows.</p><button class="w-full bg-white text-gray-900 font-bold py-3 rounded-lg hover:bg-gray-200 transition mb-4 shadow-lg" onclick="document.getElementById('email-login').classList.remove('hidden'); this.classList.add('hidden');">Sign In / Sign Up</button><form id="email-login" class="space-y-4 hidden animate-fade"><input type="email" id="email" placeholder="Email" class="w-full p-4 rounded-lg bg-[var(--bg)] border border-gray-700 focus:border-[var(--primary)] outline-none transition" required><input type="password" id="password" placeholder="Password" class="w-full p-4 rounded-lg bg-[var(--bg)] border border-gray-700 focus:border-[var(--primary)] outline-none transition" required><div class="flex gap-3"><button type="submit" name="login" class="flex-1 btn-primary py-3 rounded-lg font-bold">Login</button><button type="submit" name="signup" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white py-3 rounded-lg font-bold transition">Sign Up</button></div></form></div>`; 
            
            const loginForm = document.getElementById('email-login');
            if(loginForm) {
                loginForm.onsubmit = async (e) => { 
                    e.preventDefault(); 
                    try { 
                        if (e.submitter.name === 'signup') await createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); 
                        else await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); 
                    } catch(err) { showToast(err.message, 'error'); } 
                };
            }
        }
    });
