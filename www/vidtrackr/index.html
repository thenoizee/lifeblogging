    <style>
        :root {
            --primary: #ed2224; --primary-hover: #c01e1f;
            --bg-dark: #111827; 
            /* Adaptive layered transparency for main cards (Glassmorphism) */
            --card-dark: rgba(31, 41, 55, 0.85); 
            --text-dark: #f9fafb;
            --bg-light: #f3f4f6; 
            /* Light mode adaptive transparency */
            --card-light: rgba(255, 255, 255, 0.85); 
            --text-light: #111827;
            /* Softer base shadows and a vibrant expressive shadow for hover states */
            --shadow-color: rgba(0, 0, 0, 0.4);
            --expressive-shadow: 0 10px 25px -5px rgba(237, 34, 36, 0.2), 0 8px 10px -6px rgba(237, 34, 36, 0.1);
        }
        .dark { --bg: var(--bg-dark); --card: var(--card-dark); --text: var(--text-dark); }
        .light { --bg: var(--bg-light); --card: var(--card-light); --text: var(--text-light); }
        
        body { background-color: var(--bg); color: var(--text); transition: background-color 0.3s, color 0.3s; }
@media (max-width: 768px) {
    body { padding-bottom: 80px; }
}
@media (min-width: 769px) {
    body { padding-bottom: 0 !important; margin-bottom: 0 !important; }
}

        /* Glassmorphism effect for main UI cards (layered depth processing) */
        .card { 
            background-color: var(--card); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(0,0,0,0.05); /* Create extra bottom depth */
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            /* Enable hardware acceleration for mobile glass effect rendering */
            transform: translateZ(0); 
            will-change: transform, backdrop-filter;
        }
        .card:hover {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
            transform: translateY(-3px);
            border-color: rgba(237, 34, 36, 0.3);
        }

        /* Adding fluid transitions and tactile transform for primary buttons */
        .btn-primary { 
            background-color: var(--primary); 
            color: white; 
            box-shadow: 0 4px 6px -1px rgba(237, 34, 36, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        /* Tactile feedback on hover and active states for layered depth */
        .btn-primary:hover:not(:disabled) { 
            background-color: var(--primary-hover); 
            box-shadow: var(--expressive-shadow); 
            transform: translateY(-2px); 
        }
        .btn-primary:active:not(:disabled) { 
            transform: translateY(1px); 
            box-shadow: 0 1px 2px rgba(237, 34, 36, 0.2); 
        }

        /* Global Tactile Feedback for all standard UI buttons */
        button { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important; }
        button:hover:not(:disabled) { transform: translateY(-2px); }
        button:active:not(:disabled) { transform: translateY(1px); }

        /* Background var glassmorphism applied to containers automatically */
        .bg-\[var\(--card\)\] {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            /* Enable hardware acceleration for mobile glass effect rendering */
            transform: translateZ(0);
        }

        .nav-link.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        
        /* Premium Modal Pop Animation mirroring HealthManagr */
        @keyframes modalPop { 0% { transform: scale(0.95) translateY(10px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        .animate-fade { animation: modalPop 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

/* Add inside the <style> tag */
.nav-tab { 
    padding: 0.5rem 1rem; 
    border-radius: 0.5rem; 
    transition: all 0.2s; 
    font-weight: 600; 
    color: #9ca3af; /* Gray-400 */
    text-decoration: none;
    display: inline-flex;
    align-items: center;
}
.nav-tab:hover { 
    color: var(--text); 
    background: rgba(0,0,0,0.05); 
}
.dark .nav-tab:hover {
    background: rgba(255,255,255,0.05);
}
.nav-tab.active { 
    color: var(--primary); 
    background: rgba(237, 34, 36, 0.1); /* Primary color with opacity */
}
        
        /* Mobile-friendly Slider Styles */
input[type=range] { 
    -webkit-appearance: none; 
    width: 100%; 
    background: transparent; 
    height: 40px; 
    margin: 0;
    cursor: pointer;
}

/* The Slider Track (with Dots/Ticks) */
input[type=range]::-webkit-slider-runnable-track { 
    width: 100%; 
    height: 6px; 
    cursor: pointer; 
    border-radius: 3px;
    
    /* Base dark gray color */
    background-color: #4b5563; 
    
    /* Creates 10 evenly spaced "dots" (small tick marks) */
    background-image: repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.4) 0, 
        rgba(255,255,255,0.4) 2px, 
        transparent 2px, 
        transparent calc((100% - 2px) / 9)
    );
}

/* The Slider Thumb (Big Red Circle) */
input[type=range]::-webkit-slider-thumb { 
    -webkit-appearance: none; 
    height: 25px; 
    width: 25px; 
    border-radius: 50%; 
    background: var(--primary); /* Solid Red */
    cursor: pointer; 
    margin-top: -10px; /* Centers thumb on track */
    box-shadow: 0 2px 6px rgba(0,0,0,0.4); 
    border: 2px solid white; 
}

/* Firefox Support */
input[type=range]::-moz-range-track {
    width: 100%;
    height: 6px;
    cursor: pointer;
    border-radius: 3px;
    background-color: #4b5563;
    background-image: repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.4) 0, 
        rgba(255,255,255,0.4) 2px, 
        transparent 2px, 
        transparent calc((100% - 2px) / 9)
    );
}
input[type=range]::-moz-range-thumb {
    height: 32px;
    width: 32px;
    border: 2px solid white;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}
        
        /* Custom scrollbar for desktop, hidden on mobile for app-like feel */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
        
        @media (max-width: 768px) {
            ::-webkit-scrollbar { display: none; }
            * { scrollbar-width: none; }
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .nav-btn {
            position: absolute; 
            top: 50%; 
            transform: translateY(-50%);
            background: rgba(0,0,0,0.5); 
            color: white;
            width: 50px; 
            height: 50px; 
            border-radius: 50%;
            display: flex; 
            align-items: center; 
            justify-content: center;
            backdrop-filter: blur(4px); 
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 20; 
            cursor: pointer;
            
            /* FIX: Default to visible (for mobile/iPad) */
            opacity: 1; 
        }

        /* FIX: Only hide and use hover effect on devices that actually support hover */
        @media (hover: hover) {
            .nav-btn { opacity: 0; }
            .group:hover .nav-btn { opacity: 1; }
        }

        .nav-btn:hover { background: var(--primary); transform: translateY(-50%) scale(1.1); }
        .nav-prev { left: 20px; }
        .nav-next { right: 20px; } 
        
        /* Mobile Nav Styles */
        .mobile-nav-link { color: #9ca3af; flex-direction: column; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; gap: 4px; }
        .mobile-nav-link.active { color: var(--primary); }
        .mobile-nav-link i { font-size: 1.25rem; }
    </style>
</head>

        // --- Helpers ---
        // Define fetchTMDB globally and attach to window so inline handlers and nested functions can always access it
        window.fetchTMDB = async (endpoint) => {
            // Speed up loading by caching responses in sessionStorage so UI doesn't block on revisit
            const isSearch = endpoint.includes('/search/');
            const cacheKey = `vt_tmdb_${endpoint}`;
            
            if (!isSearch) {
                const cached = sessionStorage.getItem(cacheKey);
                if (cached) return JSON.parse(cached);
            }

            // CRITICAL FIX: Service Workers (sw.js) with `ignoreSearch: true` will eternally trap searches.
            // We must forcefully evict stale search caches from CacheStorage before fetching.
            if (isSearch && 'caches' in window) {
                try {
                    const cacheNames = await caches.keys();
                    for (const name of cacheNames) {
                        const cache = await caches.open(name);
                        const keys = await cache.keys();
                        for (const req of keys) {
                            if (req.url.includes('/search/')) await cache.delete(req);
                        }
                    }
                } catch(e) {}
            }

            // FIX: Dynamically determine whether to use '?' or '&' to prevent malformed URLs
            const separator = endpoint.includes('?') ? '&' : '?';
            
            // Deeply cached search results require cache-busting to bypass aggressive browser caching
            const cacheBuster = isSearch ? `&_cb=${Date.now()}_${Math.random().toString(36).substring(2, 9)}` : '';
            const url = `https://api.themoviedb.org/3${endpoint}${separator}api_key=${TMDB_API_KEY}${cacheBuster}`;
            
            // Using 'reload' forces both the browser AND the Service Worker to fetch a fresh network payload.
            const fetchOptions = isSearch ? { cache: 'reload' } : {};
            const res = await fetch(url, fetchOptions);
            if (!res.ok) {
                console.error(`[Debug] TMDB fetch failed for endpoint: ${endpoint} | Status: ${res.status}`);
                throw new Error('TMDB API Error');
            }
            
            const data = await res.json();
            
            // Add debugging to inspect received search payloads
            if (isSearch) {
                console.log(`[Debug] Search results received from API for endpoint ${endpoint}:`, data.results?.map(r => r.title || r.name));
            }

            if (!isSearch) {
                try { sessionStorage.setItem(cacheKey, JSON.stringify(data)); } catch(e) {}
            }
            return data;
        };
        const fetchTMDB = window.fetchTMDB;

        // --- LIVE TMDB HYDRATION LAYER (V2: Cached & 1-by-1 Callbacks) ---
        window.enrichTMDBImages = async (itemsArray, onProgress = null) => {
            if (!itemsArray || itemsArray.length === 0) return;
            
            const toFetch = [];

            // Phase 1: Instantly resolve from local cache
            for (const item of itemsArray) {
                if (!item) continue;
                const type = item.type || item.media_type;
                let data = item.media || ((type && item[type]) ? item[type] : item);
                if (!data) continue;

                // Needs hydration if missing images, missing runtime, OR missing parent show title for episodes
                const needsImages = !(data.poster_path || data.backdrop_path || data.still_path);
                const needsRuntime = data.runtime === undefined;
                let needsShowTitle = type === 'episode' && !(data.show?.title || data.show?.name || item.show?.title || item.show?.name);

                if (!needsImages && !needsRuntime && !needsShowTitle) {
                    if (onProgress) onProgress(item.id || data.ids?.trakt, data, item);
                    continue;
                }

                const tmdbId = data.ids?.tmdb || data.tmdb || data.id; 
                const traktId = data.ids?.trakt;
                
                if (!tmdbId && !traktId) continue; 

                // Check localStorage Cache
                const cacheKey = `vt_img_${type}_${tmdbId || traktId}`;
                const cached = localStorage.getItem(cacheKey);
                if (cached) {
                    try {
                        const parsed = JSON.parse(cached);
                        let cacheValid = true;
                        if (needsImages && !(parsed.poster_path || parsed.backdrop_path || parsed.still_path)) cacheValid = false;
                        if (needsRuntime && parsed.runtime === undefined) cacheValid = false;

                        if (needsShowTitle && !parsed.showTitle) cacheValid = false;

                        if (cacheValid) {
                            if (parsed.poster_path) data.poster_path = parsed.poster_path;
                            if (parsed.backdrop_path) data.backdrop_path = parsed.backdrop_path;
                            if (parsed.still_path) data.still_path = parsed.still_path;
                            if (parsed.runtime !== undefined) data.runtime = parsed.runtime;
                            if (parsed.showTitle) {
                                if (!data.show) data.show = {};
                                data.show.title = parsed.showTitle;
                                needsShowTitle = false;
                            }
                            if (onProgress) onProgress(item.id || data.ids?.trakt, data, item);
                            continue; // No network request needed!
                        }
                    } catch(e) {}
                }

                // If not cached or incomplete, queue it for fetching
                toFetch.push({ item, type, data, tmdbId, traktId, cacheKey, needsShowTitle });
            }

            if (toFetch.length === 0) return;

            // Phase 2: Fetch missing data in chunks and update 1-by-1
            const chunks = [];
            for (let i = 0; i < toFetch.length; i += 10) chunks.push(toFetch.slice(i, i + 10));

            for (const chunk of chunks) {
                await Promise.all(chunk.map(async ({ item, type, data, tmdbId, traktId, cacheKey, needsShowTitle }) => {
                    try {
                        let cacheData = {};
                        if (type === 'episode') {
                            let showTmdbId = item.show?.ids?.tmdb || data.show?.ids?.tmdb || item.show?.tmdb;
                            
                            // If orphaned episode, dynamically extract show ID from the composite ID (e.g. "123-1-1")
                            if (!showTmdbId && typeof traktId === 'string' && traktId.includes('-')) {
                                showTmdbId = traktId.split('-')[0];
                            } else if (!showTmdbId && typeof tmdbId === 'string' && tmdbId.includes('-')) {
                                showTmdbId = tmdbId.split('-')[0];
                            }

                            // If we still have absolutely no Show TMDB ID, we must fetch it from Trakt proxy via the episode ID
                            if (!showTmdbId && needsShowTitle && (traktId || data.id)) {
                                try {
                                    const searchId = traktId || data.id;
                                    const endpoint = traktId ? `/search/trakt/${searchId}?type=episode` : `/search/tmdb/${searchId}?type=episode`;
                                    const searchData = await fetchDirect(endpoint);
                                    if (searchData && searchData[0]) {
                                        showTmdbId = searchData[0].show.ids.tmdb;
                                        if (!data.show) data.show = {};
                                        data.show.title = searchData[0].show.title;
                                        data.show.ids = searchData[0].show.ids;
                                        cacheData.showTitle = searchData[0].show.title;
                                        needsShowTitle = false;
                                    }
                                } catch(e) { console.warn("Show Rescue Failed", e); }
                            }

                            const sNum = data.season || data.season_number;
                            const epNum = data.number || data.episode_number;
                            if (showTmdbId && sNum !== undefined && epNum !== undefined) {
                                const res = await fetchTMDB(`/tv/${showTmdbId}/season/${sNum}/episode/${epNum}`);
                                data.still_path = res.still_path;
                                data.runtime = res.runtime || 0;
                                cacheData.still_path = res.still_path; // FIX: Dot notation prevents overwriting showTitle!
                                cacheData.runtime = data.runtime;
                                
                                if (needsShowTitle) {
                                    try {
                                        const showRes = await fetchTMDB(`/tv/${showTmdbId}`);
                                        if (!data.show) data.show = {};
                                        data.show.title = showRes.name;
                                        cacheData.showTitle = showRes.name;
                                    } catch(e) {}
                                }
                            }
                        } else {
                            // Needs generic Trakt -> TMDB resolution?
                            let resolvedTmdbId = tmdbId;
                            if (!resolvedTmdbId && traktId) {
                                try {
                                    const searchData = await fetchDirect(`/search/trakt/${traktId}?type=${type}`);
                                    if (searchData && searchData[0]) resolvedTmdbId = searchData[0][type].ids.tmdb;
                                } catch(e) {}
                            }
                            
                            if (resolvedTmdbId) {
                                const tmdbType = type === 'show' ? 'tv' : 'movie';
                                const res = await fetchTMDB(`/${tmdbType}/${resolvedTmdbId}`);
                                data.poster_path = res.poster_path;
                                data.backdrop_path = res.backdrop_path;
                                data.runtime = res.runtime !== undefined ? res.runtime : (res.episode_run_time?.[0] || 0);
                                cacheData.poster_path = res.poster_path;
                                cacheData.backdrop_path = res.backdrop_path;
                                cacheData.runtime = data.runtime;
                            }
                        }

                        // Save to local cache
                        localStorage.setItem(cacheKey, JSON.stringify(cacheData));

                        // Fire real-time callback the moment THIS single item is done
                        if (onProgress) onProgress(item.id || data.ids?.trakt, data, item);

                    } catch(e) { /* Silent fail */ }
                }));
                if (chunks.length > 1) await new Promise(r => setTimeout(r, 250)); // Respect TMDB rate limits
            }

        // --- NEW: Custom List Logic ---
        window.openAddToList = async (passedId, type, dataJsonStr) => {

            try {
                let allLists = [];

                if (traktAccessToken && primaryDataSource === 'trakt') {

                        }
                    } catch(e) {}
                }
                
                // 2. Fetch Local Lists (With Self-Healing Document Counter)
                if (currentUser) {
                    const snap = await getDocs(collection(db, `users/${currentUser.uid}/lists`));
                    const listPromises = snap.docs.map(async (d) => {
                        const listData = d.data();
                        let count = listData.item_count || 0;
                        
                        // If count is suspected bad/legacy, fetch it natively
                        if (count === 0 || count === undefined || count === 'Local') {
                            try {
                                const countSnap = await getCountFromServer(collection(db, `users/${currentUser.uid}/lists/${d.id}/items`));
                                count = countSnap.data().count;
                                if (count > 0) {
                                    await updateDoc(doc(db, `users/${currentUser.uid}/lists`, d.id), { item_count: count });
                                }
                            } catch(e) {}
                        }
                        return { ...listData, item_count: count, ids: { trakt: d.id }, isTrakt: false };
                    });
                    const resolvedLists = await Promise.all(listPromises);
                    allLists = allLists.concat(resolvedLists);
                }
                
                if (allLists.length === 0) {
                    content.innerHTML = '<p class="text-gray-500 text-center mb-4">No custom lists found.</p><button onclick="window.createNewList()" class="w-full bg-[var(--primary)] text-white py-2 rounded font-bold">Create New List</button>';
                    return;
                }
                
                // Render List UI
                content.innerHTML = allLists.map(l => `
                    <div class="flex items-center justify-between bg-gray-800 hover:bg-gray-700 p-3 rounded-lg mb-2 border border-gray-700 transition">
                        <div class="flex flex-col">
                            <span class="font-bold text-sm text-white">${l.name} <span class="text-[10px] text-gray-500 ml-1 uppercase border border-gray-600 px-1 rounded">${l.isTrakt ? 'Trakt' : 'Local'}</span></span>
                            <span class="text-xs text-gray-500">${l.item_count || 0} items</span>
                        </div>
                        <button id="btn-list-${l.isTrakt ? 't' : 'l'}-${l.ids.trakt}" class="text-xs px-3 py-1.5 rounded font-bold bg-gray-900 text-gray-400 min-w-[70px]">
                            <i class="fa-solid fa-spinner fa-spin"></i>
                        </button>
                    </div>
                `).join('');

                // Check memberships
                allLists.forEach(async (list) => {
                    const btn = document.getElementById(`btn-list-${list.isTrakt ? 't' : 'l'}-${list.ids.trakt}`);
                    if (!btn) return;
                    try {
                        let isMember = false;
                        if (list.isTrakt) {
                            const items = await fetchDirect(`/users/me/lists/${list.ids.trakt}/items/${type}`);
                            isMember = items.some(i => String(i[type]?.ids?.trakt) === String(realTraktId) || String(i[type]?.ids?.tmdb) === String(realTmdbId));
                        } else {
                            // Direct check using robust multiple ID matching for legacy and cross-platform compatibility
                            const idsToCheck = new Set([String(passedId)]);
                            if (realTraktId) idsToCheck.add(String(realTraktId));
                            if (realTmdbId) idsToCheck.add(String(realTmdbId));
                            
                            if (type === 'episode') {
                                const sTmdb = itemData?.show?.ids?.tmdb || itemData?.show_tmdb;
                                const s = itemData?.season || itemData?.season_number;
                                const e = itemData?.number || itemData?.episode_number;
                                if (sTmdb && s !== undefined && e !== undefined) idsToCheck.add(`${sTmdb}-${s}-${e}`);
                            }

                            for (const testId of idsToCheck) {
                                if (!testId || testId === 'undefined') continue;
                                const docRef = doc(db, `users/${currentUser.uid}/lists/${list.ids.trakt}/items`, `${type}_${testId}`);
                                const dSnap = await getDoc(docRef);
                                if (dSnap.exists()) {
                                    isMember = true;
                                    break;
                                }
                            }
                        }

        window.deleteHistoryItem = async (historyId, traktId, type, btn) => {
            if(!confirm('Are you sure you want to remove this log from your history?')) return;
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            btn.disabled = true;
            try {
                let deletedItemData = null;

                // 1. Delete from Firebase (Primary DB)
                // Firebase IDs are alphanumeric strings, Trakt IDs are numbers. We check if it's a string/Firebase ID.
                if (currentUser && historyId && isNaN(Number(historyId))) {
                    // Fetch the document first so we know which show to rollback in the progress table
                    const docRef = doc(db, `users/${currentUser.uid}/history`, historyId);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) deletedItemData = docSnap.data();
                    
                    await deleteDoc(docRef);
                }

                // 2. Delete from Trakt (If connected)
                if (traktAccessToken && primaryDataSource === 'trakt') {
                    let payload;
                    if (historyId && !isNaN(Number(historyId))) {
                        // It's a numeric Trakt history ID
                        payload = { ids: [parseInt(historyId)] };
                    } else {
                        // Fallback to bulk removing the item by its Trakt ID
                        const rootKey = type === 'episode' ? 'episodes' : 'movies';
                        payload = { [rootKey]: [{ ids: { trakt: traktId } }] };
                    }
                    
                    await fetch(`${TRAKT_API_URL}/sync/history/remove`, {
                        method: 'POST', headers: traktHeader(), body: JSON.stringify(payload)
                    });
                }
                
                // Targeted NoSQL Rollback: Recalculate this specific show's progress so "Last Watched" dates update
                if (currentUser && type === 'episode' && deletedItemData && deletedItemData.media) {
                    const media = deletedItemData.media;
                    const showTmdbId = media.show?.ids?.tmdb || media.ids?.show_tmdb || media.show?.ids?.trakt;
                    
                    if (showTmdbId) {
                        // Fetch remaining history to find the new max episode and latest date
                        const q = query(collection(db, `users/${currentUser.uid}/history`), orderBy("watchedAt", "desc"), limit(2500));
                        const snap = await getDocs(q);
                        
                        let maxS = 0, maxE = 0;
                        let latestDate = null;
                        let watchCount = 0;
                        
                        snap.forEach(d => {
                            const data = d.data();
                            if (data.type === 'episode' && data.media) {
                                const hTmdbId = data.media.show?.ids?.tmdb || data.media.ids?.show_tmdb || data.media.show?.ids?.trakt;
                                if (String(hTmdbId) === String(showTmdbId)) {
                                    watchCount++;
                                    const s = parseInt(data.media.season !== undefined ? data.media.season : (data.media.season_number !== undefined ? data.media.season_number : 1));
                                    const e = parseInt(data.media.number !== undefined ? data.media.number : (data.media.episode_number !== undefined ? data.media.episode_number : 1));
                                    const wDate = data.watchedAt || data.loggedAt;
                                    
                                    if (s > maxS || (s === maxS && e > maxE)) {
                                        maxS = s;
                                        maxE = e;
                                    }
                                    if (!latestDate || new Date(wDate) > new Date(latestDate)) {
                                        latestDate = wDate;
                                    }
                                }
                            }
                        });
                        
                        const progressRef = doc(db, `users/${currentUser.uid}/series_progress`, String(showTmdbId));
                        if (watchCount === 0) {
                            // If no episodes left, delete the progress document so it disappears from Up Next
                            await deleteDoc(progressRef);
                        } else {
                            // Otherwise, roll back to the new max limits and latest date
                            await setDoc(progressRef, {
                                maxSeason: maxS,
                                maxEpisode: maxE,
                                lastWatchedAt: latestDate
                            }, { merge: true });
                        }
                    }
                }

                // Invalidate full history and series progress caches on deletion
                window.invalidateProgressCaches();
                
                // Smartly remove from local history cache instead of blindly wiping the whole cache
                try {
                    const histCacheKey = `vidtrackr_full_history_${currentUser.uid}`;
                    const cachedHist = localStorage.getItem(histCacheKey);
                    if (cachedHist) {
                        let histArr = JSON.parse(cachedHist);
                        histArr = histArr.filter(h => h._docId !== historyId && h.itemId !== String(traktId));
                        localStorage.setItem(histCacheKey, JSON.stringify(histArr));
                    }
                } catch(e) { console.warn("Failed to update history cache locally", e); }
                
                showToast('Log removed successfully');
                
                // Refresh the page if on Detail view to update the "Watch Count" and "Last Watched" text
                if (location.hash.startsWith('#detail')) {
                    const parts = location.hash.split('/');
                    if(parts[3] === 'season' && parts[4]) window.renderDetail(parts[1], parts[2], parts[4]);
                    else window.renderDetail(parts[1], parts[2]);
                    return; // Prevent standard row removal logic since page reloads
                }

                const row = btn.closest('.card') || btn.closest('.history-row');
                if(row) { 
                    row.style.transition = "opacity 0.5s"; 
                    row.style.opacity = '0'; 
                    setTimeout(() => row.remove(), 500); 
                }
            } catch(e) {
                console.error("Deletion error:", e);
                showToast('Failed to remove log', 'error');
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }
        };

        function getImage(item, typeOverride = null, preferLandscape = false) {
            const type = typeOverride || item.type || item.media_type;
            let data = item.media || ((type && item[type]) ? item[type] : item);
            
            if (!data.poster_path && !data.backdrop_path && !data.still_path && item.movie) data = item.movie;
            if (!data.poster_path && !data.backdrop_path && !data.still_path && item.episode) data = item.episode;
            
            // If viewing in TMDB standalone mode and the imported item lacks ALL image markers, return placeholder
            if (primaryDataSource === 'tmdb' && !data.poster_path && !data.backdrop_path && !data.still_path && !data.profile_path && !data.images) {
                return PLACEHOLDER_IMG;
            }

            // Helper to dig out nested image paths if they are trapped in arrays or objects
            const extract = (val) => { 
                if (!val) return null; 
                if (Array.isArray(val)) return extract(val[0]); 
                if (typeof val === 'string') return val; 
                if (val.file_path) return val.file_path; // TMDB nested arrays use file_path
                return null; 
            };

            let url = null;
            
            // --- 1. TMDB IMAGE LOGIC ---
            if (primaryDataSource === 'tmdb' || data.poster_path || data.backdrop_path || data.still_path || data.profile_path || (data.images && data.images.backdrops)) {
                const tmdbBaseUrl = 'https://image.tmdb.org/t/p/';
                
                if (preferLandscape) {
                    // Hunt for all TMDB landscape variations first
                    if (data.backdrop_path) url = `${tmdbBaseUrl}w780${data.backdrop_path}`;
                    else if (data.still_path) url = `${tmdbBaseUrl}w780${data.still_path}`;
                    else if (data.images?.backdrops?.length > 0) url = `${tmdbBaseUrl}w780${data.images.backdrops[0].file_path}`;
                    else if (data.images?.stills?.length > 0) url = `${tmdbBaseUrl}w780${data.images.stills[0].file_path}`;
                }
                
                // If landscape failed OR we wanted portrait, hunt for TMDB portrait variations
                if (!url) {
                    if (type === 'person' && data.profile_path) url = `${tmdbBaseUrl}w500${data.profile_path}`;
                    else if (data.poster_path) url = `${tmdbBaseUrl}w500${data.poster_path}`;
                    else if (data.images?.posters?.length > 0) url = `${tmdbBaseUrl}w500${data.images.posters[0].file_path}`;
                    else if (data.images?.profiles?.length > 0) url = `${tmdbBaseUrl}w500${data.images.profiles[0].file_path}`;
                    
                    // Final TMDB safety net: If portrait failed but landscape exists, use it anyway to avoid a broken UI
                    else if (data.backdrop_path) url = `${tmdbBaseUrl}w780${data.backdrop_path}`;
                    else if (data.still_path) url = `${tmdbBaseUrl}w780${data.still_path}`;
                }
            } 
            
            // --- 2. TRAKT IMAGE LOGIC ---
            if (!url && data && data.images) {
                if (preferLandscape) {
                    // Hunt for all Trakt landscape variations
                    if (type === 'episode') url = extract(data.images.screenshot?.medium) || extract(data.images.screenshot?.full) || extract(data.images.screenshot);
                    else url = extract(data.images.fanart?.medium) || extract(data.images.fanart?.full) || extract(data.images.fanart);
                    if (!url) url = extract(data.images.thumb?.full) || extract(data.images.thumb);
                }
                
                // If landscape failed OR we wanted portrait, hunt for Trakt portrait variations
                if (!url) {
                    if (type === 'episode') url = extract(data.images.screenshot?.medium) || extract(data.images.screenshot?.full) || extract(data.images.screenshot);
                    else if (type === 'person') url = extract(data.images.headshot?.medium) || extract(data.images.headshot?.full) || extract(data.images.headshot);
                    else url = extract(data.images.poster?.medium) || extract(data.images.poster?.full) || extract(data.images.poster);
                }
                
                // Final Trakt safety net
                if (!url) url = extract(data.images.thumb);
                if (!url) url = extract(data.images.fanart);
            }
            
            // --- 3. EPISODE FALLBACK TO SHOW ---
            // If it is an episode and absolutely no image exists, steal the poster/backdrop from the parent show
            if (!url && type === 'episode' && item.show) {
                if (preferLandscape) {
                    if (item.show.backdrop_path) url = `https://image.tmdb.org/t/p/w780${item.show.backdrop_path}`;
                    else if (item.show.images) url = extract(item.show.images.fanart?.medium) || extract(item.show.images.fanart?.full);
                }
                if (!url) {
                    if (item.show.poster_path) url = `https://image.tmdb.org/t/p/w500${item.show.poster_path}`;
                    else if (item.show.images) url = extract(item.show.images.poster?.medium) || extract(item.show.images.poster?.full);
                }
            }

            if (!url) return PLACEHOLDER_IMG;
            if (!url.startsWith('http') && !url.startsWith('//')) return `https://${url}`;
            return url;
        }

        // --- API & AUTH RECOVERY ---
        const traktHeader = () => ({ 'Content-Type': 'application/json', 'trakt-api-version': '2', 'trakt-api-key': TRAKT_CLIENT_ID, 'Authorization': `Bearer ${traktAccessToken}` });

        const handleAuthError = () => {
            if (isAuthErrorHandling) return;
            
            // Silently fail if the user has explicitly switched away from Trakt to avoid annoying popups
            if (primaryDataSource !== 'trakt') {
                console.warn("Trakt Auth failed, but user is using TMDB. Suppressing popup.");
                return;
            }

            isAuthErrorHandling = true;
            showToast('Trakt Session Expired! Redirecting...', 'error');
            setTimeout(() => {
                if(confirm("Your Trakt connection has expired. Click OK to re-connect.")) {
                    const state = encodeURIComponent(window.location.pathname);
                    // FIX: Reordering query parameters to prevent Trakt's Next.js router from dropping the query string during validation
                    const authUrl = `https://trakt.tv/oauth/authorize?client_id=${TRAKT_CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(TRAKT_REDIRECT_URI)}&state=${state}`;
                    window.location.href = authUrl;
                } else {
                    isAuthErrorHandling = false; 
                }
            }, 1000);
        };
        
        async function fetchDirect(endpoint) {
            const isUserSync = endpoint.includes('/sync') || endpoint.includes('/users') || endpoint.includes('/calendars') || endpoint.includes('/watching');
            const isSearch = endpoint.includes('/search/'); // Added to track search requests
            
            // CRITICAL FIX: Nuke stale Service Worker caches for Trakt search queries. 
            if (isSearch && 'caches' in window) {
                try {
                    const cacheNames = await caches.keys();
                    for (const name of cacheNames) {
                        const cache = await caches.open(name);
                        const keys = await cache.keys();
                        for (const req of keys) {
                            if (req.url.includes('/search/')) await cache.delete(req);
                        }
                    }
                } catch(e) {}
            }

            // Bypasses Trakt requests smoothly when running in TMDB Standalone Mode
            const handleStandaloneBypass = () => {
                if (endpoint.includes('/stats')) return { movies: { watched: 0, minutes: 0 }, episodes: { watched: 0, minutes: 0 }, network: { friends: 0 } };
                if (endpoint.includes('limit=') || endpoint.includes('history') || endpoint.includes('watched') || endpoint.includes('playback') || endpoint.includes('ratings') || endpoint.includes('lists') || endpoint.includes('friends') || endpoint.includes('calendars')) return [];
                return {};
            };

            if (!traktAccessToken) { 
                if (primaryDataSource !== 'trakt') return handleStandaloneBypass();
                handleAuthError(); 
                if (isUserSync) throw new Error("No Token"); 
            }
            
            const headers = traktHeader();
            if (!traktAccessToken || !isUserSync) delete headers['Authorization'];
            
            // DEBUG: Log when a search cache bypass is triggered
            if (isSearch && window.VIDTRACKR_DEBUG) console.log(`[Debug] Bypassing HTTP cache for Trakt search: ${endpoint}`);
            
            // FIX: Deeply cached search results require cache-busting to bypass aggressive browser/edge caching
            const separator = endpoint.includes('?') ? '&' : '?';
            const cacheBuster = isSearch ? `${separator}_cb=${Date.now()}` : '';
            
            const fetchOptions = { headers };
            if (isSearch) fetchOptions.cache = 'no-store'; // Ensure fetch explicitly ignores local browser HTTP cache
            
            const res = await fetch(`${TRAKT_API_URL}${endpoint}${cacheBuster}`, fetchOptions);
            
            if (res.status === 401 || res.status === 403) {
                if (primaryDataSource !== 'trakt') return handleStandaloneBypass();
                handleAuthError();
                throw new Error(`API Error ${res.status}: Unauthorized/Forbidden`);
            }
            if (!res.ok) {
                if (primaryDataSource !== 'trakt' && isUserSync) return handleStandaloneBypass();
                throw new Error('API Error ' + res.status);
            }
            return await res.json();
        }

        async function fetchSmart(endpoint, renderFn, cacheKey = null) {
            const key = cacheKey || `trakt_cache_${endpoint}`;
            const cached = localStorage.getItem(key);
            if (cached) { try { renderFn(JSON.parse(cached), true); } catch(e){} } else showLoader();
            try {
                const freshData = await fetchDirect(endpoint); 
                if (JSON.stringify(freshData) !== cached) {
                    localStorage.setItem(key, JSON.stringify(freshData));
                    renderFn(freshData, false);
                }
            } catch (e) { 
                if(!cached && e.message !== 'API Error 401: Unauthorized') showToast("Connection error", 'error'); 
            } 
            finally { if(!cached) hideLoader(); }
        }

        // Smart caching wrapper: 
// 1. Loads from cache immediately (if available)
// 2. Fetches fresh data in background ONLY if Time-to-Live (TTL) has expired
// 3. Re-renders only if data changed
async function runSmart(cacheKey, fetcherFn, rendererFn, ttlMs = 120000) { // 2 minute default TTL saves huge read spikes
    const key = `vidtrackr_smart_${cacheKey}`;
    const timeKey = `${key}_timestamp`;
    const statusEl = document.getElementById('sync-status');
    const now = Date.now();
    
    // Helper to update the badge
    const setStatus = (state) => {
        if (!statusEl) return;
        statusEl.classList.remove('hidden', 'text-gray-400', 'text-yellow-500', 'text-green-500', 'border-yellow-500', 'border-green-500');
        
        if (state === 'cache') {
            statusEl.innerHTML = '<i class="fa-solid fa-bolt"></i> Cached';
            statusEl.classList.add('text-gray-400', 'border-gray-700');
        } else if (state === 'loading') {
            statusEl.innerHTML = '<i class="fa-solid fa-arrows-rotate fa-spin"></i> Syncing';
            statusEl.classList.add('text-yellow-500', 'border-yellow-500/50');
        } else if (state === 'success') {
            statusEl.innerHTML = '<i class="fa-solid fa-check"></i> Updated';
            statusEl.classList.add('text-green-500', 'border-green-500/50');
            // Hide after 3 seconds
            setTimeout(() => {
                statusEl.classList.add('opacity-0');
                setTimeout(() => {
                    statusEl.classList.add('hidden');
                    statusEl.classList.remove('opacity-0');
                }, 500);
            }, 3000);
        }
    };

    // 1. Instant Load from Cache
    const cached = localStorage.getItem(key);
    const lastFetch = localStorage.getItem(timeKey);
    
    if (cached) {
        try {
            setStatus('cache'); // Show "Cached" immediately
            const cachedData = JSON.parse(cached);
            rendererFn(cachedData, true);
        } catch(e) { console.warn("Cache parse error", e); }
    }
    // Global showLoader() removed here. 
    // Containers now rely on their own localized HTML spinners to prevent screen blocking.

    // 2. Skip silent fetch if TTL hasn't expired yet to save Firebase reads
    if (cached && lastFetch && (now - parseInt(lastFetch) < ttlMs)) {
        return; 
    }

    // 3. Silent Background Fetch
    try {
        if(cached) setStatus('loading'); // Switch to "Syncing..."
        
        const freshData = await fetcherFn();
        localStorage.setItem(timeKey, now.toString()); // Update timestamp
        
        // 4. Compare & Update
        if (!cached || JSON.stringify(freshData) !== cached) {
            localStorage.setItem(key, JSON.stringify(freshData));
            rendererFn(freshData, false);
            setStatus('success'); // Show "Updated" (Green)
        } else {
            // Data was identical
            setStatus('success');
        }
    } catch (e) {
        console.error(`Background update failed for ${cacheKey}`, e);
        if(statusEl) {
            statusEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Offline';
            statusEl.classList.add('text-red-500', 'border-red-500/50');
        }
    } finally {
        // Global hideLoader() removed as it is no longer blocking the screen
    }
}

                // 1. Log to Trakt (if connected)
                
                // 1. Log to Trakt (if connected)

                    if (!skipLog) {

                showToast(skipLog ? `Rated ${rating}/10!` : `Rated ${rating}/10 & Logged!`);
            } catch(e) { 
                showToast('Action failed', 'error'); 
                // Revert optimistic state on failure
                userRatings.delete(parseInt(id)); 
                userRatingDetails.delete(parseInt(id));

        }
        
async function loadUpNext() {
            await runSmart(
                'up_next_local_v5', // Cache Key bumped to flush old data
                
                // --- FETCHER: Builds Up Next from local Firebase history ---
                async () => {
                    if (!currentUser) return [];

                    try {
                        // Fetch the pre-aggregated Series Progress from Firebase NoSQL Denormalization
                        const q = query(collection(db, `users/${currentUser.uid}/series_progress`), orderBy("lastWatchedAt", "desc"), limit(40));
                        const snapshot = await getDocs(q);
                        
                        // Fallback to history array if the denormalized collection is empty (e.g. they haven't logged anything since the update)
                        let activeShows = [];
                        if (!snapshot.empty) {
                            snapshot.forEach(docSnap => {
                                const p = docSnap.data();
                                activeShows.push({
                                    showTmdbId: p.showTmdbId,
                                    showTitle: p.showObj?.title,
                                    showObj: p.showObj,
                                    s: p.maxSeason,
                                    e: p.maxEpisode,
                                    watchedAt: p.lastWatchedAt
                                });
                            });
                        } else {
                            // Run the legacy fallback grouping just in case so the app doesn't break
                            const hq = query(collection(db, `users/${currentUser.uid}/history`), orderBy("watchedAt", "desc"), limit(500));
                            const hSnap = await getDocs(hq);
                            const showMap = new Map();
                            hSnap.forEach(docSnap => {
                                const item = docSnap.data();
                                if (item.type !== 'episode' || !item.media) return;
                                const media = item.media;
                                const showObj = media.show;
                                if (!showObj) return;
                                const tmdbId = showObj.ids?.tmdb || media.ids?.tmdb;
                                const identifier = String(tmdbId || showObj.title).trim();
                                if (!identifier || identifier === 'undefined') return;
                                const currentS = parseInt(media.season !== undefined ? media.season : (media.season_number !== undefined ? media.season_number : 1));
                                const currentE = parseInt(media.number !== undefined ? media.number : (media.episode_number !== undefined ? media.episode_number : 1));
                                if (!showMap.has(identifier)) {
                                    showMap.set(identifier, { showTmdbId: tmdbId, showTitle: showObj.title, showObj: showObj, s: currentS, e: currentE, watchedAt: item.watchedAt || item.loggedAt });
                                } else {
                                    const entry = showMap.get(identifier);
                                    if (currentS > entry.s || (currentS === entry.s && currentE > entry.e)) { entry.s = currentS; entry.e = currentE; }
                                }
                            });
                            activeShows = Array.from(showMap.values()).slice(0, 40);
                        }
                        
                        // Chunk requests to avoid TMDB 429 Rate Limits
                        const chunk = (arr, size) => Array.from({ length: Math.ceil(arr.length / size) }, (v, i) => arr.slice(i * size, i * size + size));
                        const batches = chunk(activeShows, 8); // 8 shows per batch = max 16 TMDB requests per batch
                        
                        const nextEpisodes = [];
                        for (const batch of batches) {
                            const batchResults = await Promise.all(batch.map(async (entry) => {
                                try {
                                    let tmdbId = entry.showTmdbId;
                                    
                                    // If no TMDB ID, fallback to searching TMDB by title
                                    if (!tmdbId && entry.showTitle) {
                                        const searchRes = await fetchTMDB(`/search/tv?query=${encodeURIComponent(entry.showTitle)}`);
                                        if (searchRes.results && searchRes.results.length > 0) {
                                            tmdbId = searchRes.results[0].id;
                                            entry.showObj.ids = entry.showObj.ids || {};
                                            entry.showObj.ids.tmdb = tmdbId;
                                        }
                                    }
                                    if (!tmdbId) return null;

                                    // Fetch show details to get season counts and episode limits
                                    const showDetails = await fetchTMDB(`/tv/${tmdbId}`);
                                    if (!showDetails || !showDetails.seasons) return null;

                                    let nextS = entry.s;
                                    let nextE = entry.e + 1;

                                    // Check current season
                                    const currentSeason = showDetails.seasons.find(x => x.season_number === nextS);
                                    
                                    if (currentSeason) {
                                        // If the next episode exceeds the current season's episode count, bump to next season
                                        if (nextE > currentSeason.episode_count) {
                                            nextS += 1;
                                            nextE = 1;
                                        }
                                    }

                                    // Verify the target season exists and has episodes
                                    const targetSeason = showDetails.seasons.find(x => x.season_number === nextS);
                                    if (!targetSeason || targetSeason.episode_count === 0) {
                                        // Show is completed / caught up!
                                        return null; 
                                    }

                                    // Fetch the exact next episode data
                                    const nextEpData = await fetchTMDB(`/tv/${tmdbId}/season/${nextS}/episode/${nextE}`);
                                    if (!nextEpData || nextEpData.status_code === 34) return null; // 34 = Not Found

                                    return {
                                        type: 'episode',
                                        isResume: false,
                                        show: entry.showObj,
                                        episode: {
                                            ...nextEpData,
                                            title: nextEpData.name,
                                            season: nextS,
                                            number: nextE,
                                            // Map to a combined string ID so the router can load it correctly
                                            ids: { trakt: `${tmdbId}-${nextS}-${nextE}`, tmdb: nextEpData.id }
                                        },
                                        ids: { trakt: `${tmdbId}-${nextS}-${nextE}`, tmdb: nextEpData.id },
                                        title: nextEpData.name,
                                        watched_at: entry.watchedAt
                                    };
                                } catch(err) {
                                    return null;
                                }
                            }));
                            
                            nextEpisodes.push(...batchResults.filter(i => i !== null));
                            
                            // Respect TMDB rate limits between batches
                            if (batches.indexOf(batch) < batches.length - 1) {
                                await new Promise(r => setTimeout(r, 250));
                            }
                        }
                        
                        // Incorporate partial watch (resume) items if available
                        const resumeItems = Array.from(userPlayback.values()).map(p => ({
                            ...p,
                            isResume: true,
                            playbackId: p.id,
                            type: p.type || (p.movie ? 'movie' : 'episode')
                        })).sort((a, b) => new Date(b.paused_at) - new Date(a.paused_at));

                        // Create a set of IDs currently in resume to prevent duplicates
                        const resumeCompositeIds = new Set();
                        resumeItems.forEach(p => {
                            if (p.type === 'episode') {
                                const sTmdb = p.show?.ids?.tmdb || p.episode?.show?.ids?.tmdb;
                                const s = p.season || p.episode?.season;
                                const e = p.number || p.episode?.number;
                                if (sTmdb && s !== undefined && e !== undefined) resumeCompositeIds.add(`${sTmdb}-${s}-${e}`);
                            }
                            if (p.id) resumeCompositeIds.add(String(p.id));
                            if (p.playbackId) resumeCompositeIds.add(String(p.playbackId));
                        });

                        // Create a set of ALL watched episodes to prevent old shows from suggesting already watched episodes
                        // We use the globalHistoryCache instead of a dedicated database read to save costs and memory
                        const watchedCompositeIds = new Set();
                        if (window.globalHistoryCache) {
                            window.globalHistoryCache.forEach(item => {
                                if (item.type === 'episode') {
                                    const media = item.media || item.episode;
                                    const showObj = media?.show || item.show;
                                    const sTmdb = showObj?.ids?.tmdb || media?.ids?.tmdb;
                                    const s = media?.season !== undefined ? media?.season : media?.season_number;
                                    const e = media?.number !== undefined ? media?.number : media?.episode_number;
                                    if (sTmdb && s !== undefined && e !== undefined) watchedCompositeIds.add(`${sTmdb}-${s}-${e}`);
                                }
                            });
                        }

                        // Filter out nextEpisodes that are already partially watched OR fully watched
                        const uniqueNextEpisodes = nextEpisodes.filter(nx => {
                            const sTmdb = nx.show?.ids?.tmdb;
                            const s = nx.episode?.season;
                            const e = nx.episode?.number;
                            if (sTmdb && s !== undefined && e !== undefined) {
                                const composite = `${sTmdb}-${s}-${e}`;
                                return !resumeCompositeIds.has(composite) && !watchedCompositeIds.has(composite);
                            }
                            return true;
                        });

                        // Sort uniqueNextEpisodes by when they were last watched so the most recently engaged shows are first
                        uniqueNextEpisodes.sort((a, b) => new Date(b.watched_at) - new Date(a.watched_at));

                        const finalItems = [...resumeItems, ...uniqueNextEpisodes].slice(0, 18);
                        
                        await window.enrichTMDBImages(finalItems);
                        return finalItems;
            } catch(e) {
                console.error("Local Up Next calculation error:", e);
                return [];
            }
        },

        // --- RENDERER: Updates the DOM ---
        (items) => {
            const container = document.getElementById('up-next-container');
            if (!container) return;

            const hiddenItems = JSON.parse(localStorage.getItem('vidtrackr_hidden_upnext') || '[]');
            items = items.filter(item => {
                const isMovie = item.type === 'movie';
                const data = isMovie ? (item.movie || item) : (item.episode || item.episode);
                if (!data) return true;

                // Extract all possible IDs safely
                const itemIdTrakt = data.ids?.trakt;
                const itemIdTmdb = data.ids?.tmdb || data.id;
                const showIdTrakt = !isMovie && item.show?.ids ? item.show.ids.trakt : null;
                const showIdTmdb = !isMovie && item.show?.ids ? item.show.ids.tmdb : (!isMovie ? item.show?.id : null);

                // Sweep against the hidden list to determine if it should be displayed
            return !hiddenItems.some(h => {
                const hiddenIdStr = String(h.id);
                
                // 1. Match specific Movie or Episode
                if (h.type === item.type) {
                    if (hiddenIdStr === String(itemIdTrakt) || hiddenIdStr === String(itemIdTmdb)) return true;
                    // Properly match composite TMDB episode IDs (e.g. showId-season-episode)
                    if (item.type === 'episode') {
                        const sNum = data.season || data.season_number;
                        const eNum = data.number || data.episode_number;
                        if (hiddenIdStr === `${showIdTmdb}-${sNum}-${eNum}`) return true;
                    }
                }
                // 2. Match Parent Show (If the show is hidden, hide its Up Next episodes)
                if (h.type === 'show' && !isMovie) {
                    if (hiddenIdStr === String(showIdTrakt) || hiddenIdStr === String(showIdTmdb)) return true;
                }
                
                return false;
            });
            });

            if (items.length === 0) {
                container.classList.add('hidden');
                return;
            }

            const createCard = (item) => {
                if (!item || (!item.movie && !item.episode && !item.show)) return ''; 

                const isMovie = item.type === 'movie';
                const data = isMovie ? (item.movie || item) : (item.episode || item.episode);
                
                if (!data || !data.ids || !data.ids.trakt) return '';

                const showTitle = !isMovie ? item.show.title : null;
                const title = isMovie ? (item.movie?.title || item.title) : data.title;

                let cId = null;
                if (!isMovie) {
                    const sTmdb = item.show?.ids?.tmdb;
                    const s = data.season || data.season_number;
                    const e = data.number || data.episode_number;
                    if (sTmdb && s !== undefined && e !== undefined) cId = `${sTmdb}-${s}-${e}`;
                }
                const tId = String(data.ids?.trakt || '');
                const tmdbId = String(data.ids?.tmdb || data.id || '');
                const myRating = (cId ? userRatings.get(cId) : null) || userRatings.get(tId) || (!isNaN(Number(tId)) ? userRatings.get(parseInt(tId)) : null) || (isMovie ? userRatings.get(tmdbId) || (!isNaN(Number(tmdbId)) ? userRatings.get(parseInt(tmdbId)) : null) : null);
                const ratingBadgeHtml = myRating ? `<span class="text-green-400 font-bold ml-2 text-[10px] border border-green-500/30 px-1 rounded bg-green-900/20 shadow-sm inline-flex items-center"><i class="fa-solid fa-user-check mr-1"></i> ${myRating}</span>` : '';
                const sub = isMovie ? (item.movie?.year || item.year) : `S${data.season} E${data.number}`;
                const img = getImage(item, null, true);
                const progress = item.progress || 0;
                let typeBadge = '';
                if (!isMovie && data.episode_type && data.episode_type !== 'standard') {
                    const formatType = data.episode_type.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                    let typeColor = 'bg-purple-900/50 text-purple-300 border-purple-800';
                    if (data.episode_type.includes('finale')) typeColor = 'bg-red-900/50 text-red-300 border-red-800';
                    if (data.episode_type.includes('premiere')) typeColor = 'bg-blue-900/50 text-blue-300 border-blue-800';
                    typeBadge = `<span class="text-[9px] ${typeColor} border px-1 py-0.5 rounded uppercase font-bold tracking-wide shadow-sm ml-2 align-middle inline-block">${formatType}</span>`;
                }
                
                const jsonStr = JSON.stringify({
                    ids: data.ids, 
                    title: isMovie ? title : `${showTitle}: ${title}`, 
                    name: data.title || data.name,
                    type: item.type, 
                    runtime: data.runtime,
                    season: data.season || data.season_number,
                    number: data.number || data.episode_number,
                    still_path: data.still_path,
                    backdrop_path: data.backdrop_path,

                let actionBtns = '';
                
                if (item.isResume) {

                    </div>`;

                         <button onclick="event.stopPropagation(); window.hideUpNext('${hideId}', '${hideType}', '${hideTitle.replace(/'/g, "\\'").replace(/"/g, '&quot;')}')" class="h-10 w-12 bg-gray-800 hover:bg-gray-600 text-gray-400 hover:text-white rounded-lg font-bold transition shadow-md flex items-center justify-center border border-gray-700" title="Hide ${!isMovie ? 'Show' : 'Movie'} from Up Next"><i class="fa-solid fa-eye-slash"></i></button>
                    </div>`;
                }

                return `
                <div class="card p-0 rounded-xl flex flex-row overflow-hidden border ${item.isResume ? 'border-blue-500/50 shadow-[0_0_10px_rgba(59,130,246,0.15)]' : 'border-gray-800'} hover:border-[var(--primary)] transition cursor-pointer shadow-lg group relative animate-fade" onclick="location.hash='#detail/${item.type}/${data.ids.trakt}'">

}

async function loadFriendsFeed() {
    const container = document.getElementById('friends-feed-container');
    if (!container) return;

    try {
        // Step 1: Get your list of friends (Limit to 6 to prevent hitting API limits)
        if (primaryDataSource !== 'trakt') return; // Silence 403 errors when using TMDB mode
        const friends = await fetchDirect('/users/me/friends?limit=6');
        
        if (!friends || friends.length === 0) {
            // Optional: Hide container if no friends
            return; 
        }

        // Step 2: Fetch the last 1 history item for each friend in parallel
        const feedPromises = friends.map(async (friendObj) => {
            try {
                const slug = friendObj.user.ids.slug || friendObj.user.username;
                const history = await fetchDirect(`/users/${slug}/history?limit=1&extended=images`);
                if (history && history.length > 0) {
                    // Attach the user info to the history item so we can display their avatar
                    return { ...history[0], user: friendObj.user };
                }
                return null;
            } catch (e) { 
                return null; // Ignore errors for single friends (e.g. private profiles)
            }
        });

        const results = await Promise.all(feedPromises);
        
        const containerAfter = document.getElementById('friends-feed-container');
        if (!containerAfter) return; // Abort if user navigated away
        
        // Step 3: Filter out nulls and sort by "watched_at" date (newest first)
        const feed = results.filter(item => item !== null)
                            .sort((a, b) => new Date(b.watched_at) - new Date(a.watched_at));

        // Hydrate friend data with live images
        await window.enrichTMDBImages(feed);

        // Step 4: Render the feed
        if (feed.length > 0) {
            const html = `
                <h2 class="text-2xl font-bold mb-6 px-2 border-l-4 border-purple-500">Friends Recently Watched</h2>
                <div class="flex gap-4 overflow-x-auto pb-4 hide-scroll">
                    ${feed.map(item => {
                        const user = item.user;
                        const mediaType = item.type; // 'movie' or 'episode'
                        const media = item[mediaType];
                        const show = item.show; // exists if episode
                        
                        const title = mediaType === 'movie' ? media.title : show.title;
                        const sub = mediaType === 'movie' ? media.year : `S${media.season}E${media.number}`;
                        const img = getImage(media, mediaType);
                        const userImg = user.images?.avatar?.full || 'https://placehold.co/100x100/333/FFF?text=User';
                        
                        return `
                        <div class="flex-shrink-0 w-64 card p-3 rounded-xl border border-gray-800 hover:border-purple-500 transition cursor-pointer relative group" onclick="location.hash='#detail/${mediaType}/${media.ids.trakt}'">
                            <div class="flex items-center gap-3 mb-3 border-b border-gray-800 pb-2">
                                <img src="${userImg}" class="w-8 h-8 rounded-full border border-gray-600">

                // Initialize variables

let listsIn = [];

                    const rawIds = [matchTraktId, matchTmdbId, compositeId, String(id)].filter(Boolean);

                    const items = [];

                    try {

                            const q = query(
                                collection(db, `users/${currentUser.uid}/history`),

                            snap.forEach(d => {

                                    id: d.id,

                    } catch(e) {

                    }

                    // Safety Fallback for legacy records that might be missing standard 'itemId'
                    // Limits read depth severely compared to the old unbound code
                    if (items.length === 0 || usedFallback) {
                        const fallbackQ = query(collection(db, `users/${currentUser.uid}/history`), orderBy("watchedAt", "desc"), limit(200));
                        const snap = await getDocs(fallbackQ);
                        
                        snap.forEach(d => {
                            const data = d.data();
                            if (data.type !== type) return;

                            const media = data.media || {};

                            const histItemId = String(data.itemId || '');
                            
                            const isIdMatch = (histTrakt && (histTrakt === matchTraktId || histTrakt === matchTmdbId)) ||
                                              (histTmdb && (histTmdb === matchTmdbId || histTmdb === matchTraktId)) ||
