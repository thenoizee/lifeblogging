        // --- Check Active Watching Status ---
        async function checkActiveWatching() {
            try {
                const banner = document.getElementById('active-checkin-banner');
                const headerStatus = document.getElementById('header-watch-status');
                
                let activeData = null;

                // 1. Try Trakt first if available
                if (traktAccessToken && primaryDataSource === 'trakt') {
                    const res = await fetch(`${TRAKT_API_URL}/users/me/watching`, { headers: traktHeader() });
                    if(res.status !== 204) activeData = await res.json();
                } 
                
                // 2. Fallback to Firebase
                if (!activeData && currentUser) {
                    const snap = await getDoc(doc(db, `users/${currentUser.uid}/watching`, 'now'));
                    if (snap.exists()) {
                        const fbData = snap.data();
                        if (new Date(fbData.expiresAt) > new Date()) {
                            activeData = fbData;
                        } else {
                            // Automatically log to history since time has expired
                            if (fbData.media && Object.keys(fbData.media).length > 0) {
                                await window.logWatchToFirebase(fbData.media, fbData.type, 100, fbData.expiresAt);
                                showToast(`Check-in complete: Logged to history.`, 'success');
                                if (document.getElementById('history-list-container')) window.renderHistory(1);
                                if (document.getElementById('up-next-container') && !document.getElementById('up-next-container').classList.contains('hidden')) window.loadUpNext();
                            }
                            await deleteDoc(doc(db, `users/${currentUser.uid}/watching`, 'now')); // Clean expired
                        }
                    }
                }

                if (!activeData || (!activeData.movie && !activeData.show && !activeData.media && !activeData.id)) {
                    if(banner) banner.classList.add('hidden');
                    if(headerStatus) headerStatus.classList.add('hidden');
                    return;
                }

                const type = activeData.type;
                const id = activeData.id || (type === 'episode' ? activeData.episode?.ids?.trakt : activeData.movie?.ids?.trakt);
                const navType = type === 'episode' ? 'episode' : 'movie';
                
                let title = 'Watching...';
                let sub = '';
                if (activeData.movie) { 
                    title = activeData.movie.title; 
                    sub = activeData.movie.year; 
                } else if (activeData.episode) { 
                    title = `${activeData.show?.title || 'TV Show'}: ${activeData.episode?.title || 'Episode'}`; 
                    sub = `S${activeData.episode?.season || '?'}E${activeData.episode?.number || '?'}`; 
                } else if (activeData.title) { 
                    title = activeData.title; 
                    sub = activeData.sub || ''; 
                } else if (activeData.media) { 
                    title = activeData.media.title || activeData.media.name || 'Local Session'; 
                    sub = "Local Session"; 
                }

                // Self-healing fallback: If title is still missing in Firebase, fetch it dynamically so it never says "Watching..."
                if (title === 'Watching...' && activeData.id) {
                    try {
                        if (activeData.type === 'episode') {
                            // Handle TMDB composite ID (showId-season-episode)
                            if (String(activeData.id).includes('-')) {
                                const parts = String(activeData.id).split('-');
                                const showRes = await fetchTMDB(`/tv/${parts[0]}`).catch(() => null);
                                const epRes = await fetchTMDB(`/tv/${parts[0]}/season/${parts[1]}/episode/${parts[2]}`).catch(() => null);
                                if (showRes && epRes) {
                                    title = `${showRes.name}: ${epRes.name}`;
                                    sub = `S${parts[1]}E${parts[2]}`;
                                }
                            } else {
                                const epRes = await fetchDirect(`/episodes/${activeData.id}?extended=full`).catch(() => null);
                                if (epRes) {
                                    title = epRes.title;
                                    sub = `S${epRes.season}E${epRes.number}`;
                                }
                            }
                        } else {
                            const tmdbType = activeData.type === 'show' ? 'tv' : 'movie';
                            const res = await fetchTMDB(`/${tmdbType}/${activeData.id}`).catch(() => null);
                            if (res) {
                                title = res.title || res.name;
                                sub = (res.release_date || res.first_air_date || '').substring(0, 4);
                            }
                        }
                        
                        // Save the healed title back to Firebase so future checks are instant
                        if (title !== 'Watching...' && currentUser) {
                            await setDoc(doc(db, `users/${currentUser.uid}/watching`, 'now'), {
                                title: title,
                                sub: sub
                            }, { merge: true });
                        }
                    } catch (err) {
                        console.warn("Could not self-heal check-in title:", err);
                    }
                }
                
                // Update Header Icon
                headerStatus.innerHTML = `<button onclick="location.hash='#detail/${navType}/${id}'" class="text-red-500 hover:text-red-400 transition" title="Now Watching: ${title}"><i class="fa-solid fa-circle-play text-xl drop-shadow-[0_0_8px_rgba(239,68,68,0.6)]"></i></button>`;
                headerStatus.classList.remove('hidden');

                // Normalize timestamps from either Trakt or Firebase
                const startedAt = activeData.startedAt || activeData.started_at;
                const expiresAt = activeData.expiresAt || activeData.expires_at;

                // Update Bottom Banner HTML with Progress Bar & Timer
                banner.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden cursor-pointer flex-grow w-full" onclick="location.hash='#detail/${navType}/${id}'">
                        <div class="animate-pulse w-2 h-2 rounded-full bg-red-500 shadow-[0_0_10px_red] flex-shrink-0"></div>
                        <div class="min-w-0 flex-grow">
                            <div class="flex justify-between items-end mb-0.5 pr-2">
                                <p class="text-[10px] text-purple-300 font-bold uppercase tracking-wider leading-none">Now Watching</p>
                                <p id="checkin-time-left" class="text-[10px] text-gray-300 font-mono tracking-wide">--:--</p>
                            </div>
                            <p class="font-bold text-sm truncate leading-tight mb-1.5">${title} <span class="opacity-50 font-normal text-xs ml-1">${sub}</span></p>
                            <div class="w-full bg-black/40 rounded-full h-1 mr-2">
                                <div id="checkin-progress-bar" class="bg-gradient-to-r from-purple-500 to-red-500 h-1 rounded-full shadow-[0_0_8px_rgba(239,68,68,0.4)] transition-all duration-1000 ease-linear" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                    <button onclick="window.cancelCheckIn()" class="ml-3 text-xs bg-black/30 hover:bg-black/50 px-3 py-2.5 rounded-lg text-red-300 border border-red-900/50 transition flex items-center justify-center flex-shrink-0 shadow-lg" title="Stop & Cancel Check-In"><i class="fa-solid fa-stop"></i></button>
                `;
                banner.classList.remove('hidden');

                // Clear any existing live timer loop
                if (window.liveCheckinInterval) clearInterval(window.liveCheckinInterval);

                if (expiresAt) {
                    const endTime = new Date(expiresAt).getTime();
                    // Fallback to exactly 120 minutes ago if the start time is completely missing from API
                    const startTime = startedAt ? new Date(startedAt).getTime() : (endTime - (120 * 60000)); 
                    const totalDur = endTime - startTime;

                    // Execute a 1-second live loop 
                    const updateLiveTimer = () => {
                        const now = Date.now();
                        const remaining = endTime - now;
                        const elapsed = now - startTime;

                        if (remaining <= 0) {
                            clearInterval(window.liveCheckinInterval);
                            return;
                        }

                        // Calculate width percentage safely between 0-100%
                        const pct = Math.min(100, Math.max(0, (elapsed / totalDur) * 100));
                        
                        // Calculate formatted countdown string (e.g., "-43:05")
                        const mins = Math.floor(remaining / 60000);
                        const secs = Math.floor((remaining % 60000) / 1000);
                        const timeStr = `-${mins}:${secs.toString().padStart(2, '0')}`;

                        // Apply to DOM
                        const barEl = document.getElementById('checkin-progress-bar');
                        const textEl = document.getElementById('checkin-time-left');

                        if (barEl) barEl.style.width = `${pct}%`;
                        if (textEl) textEl.innerText = timeStr;
                    };

                    updateLiveTimer(); // Initial tick
                    window.liveCheckinInterval = setInterval(updateLiveTimer, 1000); // 1-second loop

                    // Queue the hard-refresh and auto-logger for the exact moment the episode ends
                    const timeRemaining = endTime - Date.now();
                    if (timeRemaining > 0) {
                        if (window.checkInTimeout) clearTimeout(window.checkInTimeout);
                        window.checkInTimeout = setTimeout(checkActiveWatching, timeRemaining + 2000);
                    }
                }
            } catch(e) {
                console.warn("Could not fetch active watching status", e);
            }
        }

            setTimeout(() => {

                const setupImporter = (elementId, importCategory = null) => {

                    inputEl.onchange = async (e) => {

                if (!files.length) return;

                showLoader();
                let validItems = [];
                let category = importCategory;

                        try {

                                const fileName = file.name;

                                const json = JSON.parse(text);
                                
                                if (!Array.isArray(json)) throw new Error("Invalid format. Expected JSON array.");

                                // Auto-detect import category from filename or contents if not specified
                                if (!category) {
                                    if (fileName.includes('rating')) category = 'ratings';
                                    else if (fileName.includes('collection')) category = 'collections';
                                    else if (fileName.includes('list')) category = 'lists';
                                    else if (fileName.includes('hidden')) category = 'hidden';
                                    else if (fileName.includes('note')) category = 'notes';
                                    else if (fileName.includes('favorite')) category = 'favorites';
                                    else category = 'history';
                                }

                                // Clean and derive list name from custom list exports (e.g. lists-list-25570272-partially-watched.json -> Partially Watched)
                                if (category === 'lists' && !listName) {
                                    const cleanName = fileName.replace(/\.json$/i, '').replace(/^lists-list-\d+-/i, '').replace(/^lists-/i, '').replace(/[-_]/g, ' ');
                                    listName = cleanName.charAt(0).toUpperCase() + cleanName.slice(1);
                                }

                                for (const item of json) {
                                    // Properly extract type and media data, accounting for varying Trakt export structures
                                    let type = item.type || item.attached_to?.type;

                                    if (!type) {
                                        if (item.episode || item.attached_to?.episode) type = 'episode';
                                        else if (item.season || item.attached_to?.season) type = 'season';
                                        else if (item.show || item.attached_to?.show) type = 'show';
                                        else if (item.movie || item.attached_to?.movie) type = 'movie';
                                        else continue;
                                    }

                                    let mediaData = null;
                                    let displayTitle = '';

                                    // Extract data, prioritizing root properties but falling back to attached_to if nested
                                    if (type === 'episode') {
                                        mediaData = item.episode || item.attached_to?.episode || {};
                                        const showData = item.show || item.attached_to?.show;
                                        if (showData) mediaData.show = showData;
                                        displayTitle = `${showData?.title || 'Show'}: S${mediaData.season || mediaData.season_number || '?'}E${mediaData.number || mediaData.episode_number || '?'} ${mediaData.title || mediaData.name || ''}`;
                                    } else if (type === 'season') {
                                        mediaData = item.season || item.attached_to?.season || {};
                                        const showData = item.show || item.attached_to?.show;
                                        if (showData) mediaData.show = showData;
                                        displayTitle = `${showData?.title || 'Show'}: Season ${mediaData.number || mediaData.season_number || '?'}`;
                                    } else if (type === 'show') {
                                        mediaData = item.show || item.attached_to?.show || {};
                                        displayTitle = mediaData.title || mediaData.name || 'Unknown Show';
                                    } else if (type === 'movie') {
                                        mediaData = item.movie || item.attached_to?.movie || item; // fallback if flat
                                        displayTitle = mediaData.title || mediaData.name || 'Unknown Movie';
                                    }

                                    if (!mediaData || (!mediaData.ids && !mediaData.id)) continue;

                                    // Extract the correct date
                                    // Added item.last_watched_at to correctly parse timestamps from Trakt "watched" JSON exports (vs history exports)
                                    const dateVal = item.watched_at || item.last_watched_at || item.collected_at || item.listed_at || item.hidden_at || item.rated_at || item.updated_at || item.created_at || item.note?.created_at || item.comment?.created_at || new Date().toISOString();
                                    
                                    // Extract the note text natively
                                    let noteText = '';
                                    if (typeof item.notes === 'string') noteText = item.notes;
                                    else if (item.note && typeof item.note === 'string') noteText = item.note;
                                    else if (item.note?.notes) noteText = item.note.notes;
                                    else if (item.text) noteText = item.text;
                                    else if (item.comment?.comment) noteText = item.comment.comment;
                                    else if (typeof item.comment === 'string') noteText = item.comment;

                                    validItems.push({
                                        mediaData,
                                        type,
                                        displayTitle: displayTitle.trim(),
                                        dateVal,
                                        rating: item.rating,
                                        rank: item.rank || 0,
                                        noteText
                                    });
                                }
                            } // End of multiple files loop

                            hideLoader();
                            if (validItems.length === 0) {
                                showToast('No valid items found in file(s).', 'error');

                            // Inject or reuse preview modal

                                                    <button id="import-confirm-btn" class="bg-[var(--primary)] hover:bg-red-700 text-white py-3 rounded-lg font-bold shadow-[0_0_15px_rgba(237,34,36,0.3)] transition flex items-center justify-center gap-2">Confirm Import</button>
                                                </div>
                                            </div>
                                        </div>
                                    `);
                                    previewModal = document.getElementById('import-preview-modal');
                                }

                                // Custom List Name Input UI
                                const headerArea = document.getElementById('import-header-area');
                                if (category === 'lists') {
                                    headerArea.innerHTML = `
                                        <div class="mb-3">
                                            <label class="text-xs uppercase font-bold text-[var(--primary)] tracking-wider block mb-1">List Name</label>
                                            <input type="text" id="import-list-name-input" value="${listName}" class="w-full p-3 rounded-lg bg-gray-800 border border-gray-700 text-white font-bold text-lg outline-none focus:border-[var(--primary)] transition">
                                        </div>
                                    `;
                                } else {
                                    headerArea.innerHTML = `<h3 class="text-2xl font-bold mb-1 text-white">Import Preview: ${category.toUpperCase()}</h3>`;
                                }

                                // Update Table Headers dynamically according to import category
                                const theadTr = document.getElementById('import-thead-row');
                                if (category === 'ratings') {
                                    theadTr.innerHTML = `<th class="p-3 font-bold">Title</th><th class="p-3 font-bold">Type</th><th class="p-3 font-bold text-center">Rating</th><th class="p-3 font-bold hidden md:table-cell">Rated At</th>`;
                                } else if (category === 'lists') {

                                } else if (category === 'notes' || category === 'comments') {

                                const tbody = document.getElementById('import-preview-tbody');

                                let html = '';
                                for (let i = 0; i < previewLimit; i++) {
                                    const v = validItems[i];

                                    } else if (category === 'notes' || category === 'comments') {
                                        extraCols = `<td class="p-3 text-gray-300 italic truncate max-w-xs">${v.noteText}</td>`;

                                tbody.innerHTML = html;

                                // Cancel Action
                                const cancelBtn = document.getElementById('import-cancel-btn');
                                cancelBtn.onclick = () => {
                                    isCancelled = true; // Tell loops to stop
                                    previewModal.classList.add('hidden');

                                    // Reset the buttons visually if they cancel
                                    const confirmBtn = document.getElementById('import-confirm-btn');

                                        confirmBtn.innerHTML = 'Confirm Import';

                                    cancelBtn.innerHTML = 'Cancel';
                                    cancelBtn.className = 'bg-gray-700 hover:bg-gray-600 text-white py-3 rounded-lg font-bold transition';

                                // Confirm Import Action
                                document.getElementById('import-confirm-btn').onclick = async (btnEvent) => {
                                    const btn = btnEvent.target;

                                    const cancelBtn = document.getElementById('import-cancel-btn');

                                    const statsEl = document.getElementById('import-preview-stats');

                                    try {
                                        let importedCount = 0;
                                        
                                        // HELPER: Generates the exact ID format expected by your TMDB Router
                                        const getTargetId = (v) => {
                                            let tId = v.mediaData.ids?.tmdb || v.mediaData.ids?.trakt || v.mediaData.id;
                                            if (v.type === 'episode') {
                                                const showTmdb = v.mediaData.show?.ids?.tmdb || v.mediaData.show?.ids?.trakt;
                                                const s = v.mediaData.season || v.mediaData.season_number;
                                                const ep = v.mediaData.number || v.mediaData.episode_number;
                                                if (showTmdb && s !== undefined && ep !== undefined) {
                                                    tId = `${showTmdb}-${s}-${ep}`; // Composite ID (e.g. 123-1-2)

                                                    tId = `${showTmdb}-${s}`;

                                            return tId;

                                        if (category === 'history') {

                                            let skippedCount = 0; // Track skipped duplicates to alert the user
                                            for (let i = 0; i < validItems.length; i++) {

                                                // Prevent the history import from passing the rating parameter to avoid injecting 'now' as the rating timestamp

                                                const result = await window.logWatchToFirebase(v.mediaData, v.type, 100, v.dateVal, null, null, true);
                                                if (result === 'duplicate') {

                                                }

                                                setTimeout(() => showToast(`Skipped ${skippedCount} duplicate history entries.`, 'success'), 3500);

                                        } else if (category === 'ratings') {

                                                const targetId = getTargetId(v);

                                                    // Map keys must be strings if using composite IDs

                                                    await setDoc(doc(db, `users/${currentUser.uid}/collections`, `${v.type}_${targetId}`), {
                                                        type: v.type,
                                                        media_type: v.type,
                                                        [v.type]: v.mediaData,
                                                        collectedAt: v.dateVal
                                                    }, { merge: true });
                                                    importedCount++;
                                                }
                                            }
                                        } else if (category === 'lists') {
                                            // Custom List Import
                                            const finalListName = document.getElementById('import-list-name-input')?.value.trim() || listName || 'Custom List';
                                            const listSlug = finalListName.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'custom-list';

                                            await setDoc(doc(db, `users/${currentUser.uid}/lists`, listSlug), {
                                                name: finalListName,
                                                privacy: 'private',
                                                createdAt: new Date().toISOString()
                                            }, { merge: true });

                                            for (let i = 0; i < validItems.length; i++) {
                                                if (isCancelled) break; // <--- ABORT CHECK
                                                const v = validItems[i];
                                                statsEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-purple-500"></i> Adding to list ${i + 1} of ${validItems.length}...`;
                                                const targetId = getTargetId(v);
                                                if (targetId) {
                                                    await setDoc(doc(db, `users/${currentUser.uid}/lists/${listSlug}/items`, `${v.type}_${targetId}`), {
                                                        type: v.type,
                                                        [v.type]: v.mediaData,
                                                        rank: v.rank,
                                                        listedAt: v.dateVal
                                                    }, { merge: true });
                                                    importedCount++;
                                                }
                                            }
                                        } else if (category === 'hidden') {
                                            // Hidden Shows Import
                                            let hiddenArr = JSON.parse(localStorage.getItem('vidtrackr_hidden_upnext') || '[]');
                                            for (let i = 0; i < validItems.length; i++) {
                                                if (isCancelled) break; // <--- ABORT CHECK
                                                const v = validItems[i];
                                                const targetId = getTargetId(v);
                                                if (targetId && !hiddenArr.some(h => String(h.id) === String(targetId))) {
                                                    hiddenArr.push({ id: targetId, type: v.type, title: v.displayTitle });
                                                    importedCount++;
                                                }
                                            }
                                            if (!isCancelled) {
                                                localStorage.setItem('vidtrackr_hidden_upnext', JSON.stringify(hiddenArr));
                                                await setDoc(doc(db, `users/${currentUser.uid}/settings`, 'hidden'), { items: hiddenArr }, { merge: true });
                                            }
                                        } else if (category === 'favorites') {
                                            // Favorites Import
                                            for (let i = 0; i < validItems.length; i++) {
                                                if (isCancelled) break; // <--- ABORT CHECK
                                                const v = validItems[i];
                                                statsEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-pink-500"></i> Favoriting ${i + 1} of ${validItems.length}...`;
                                                const targetId = getTargetId(v);
                                                if (targetId) {
                                                    await setDoc(doc(db, `users/${currentUser.uid}/favorites`, `${v.type}_${targetId}`), {
                                                        type: v.type,
                                                        media_type: v.type,
                                                        [v.type]: v.mediaData,
                                                        favoritedAt: v.dateVal
                                                    }, { merge: true });
                                                    importedCount++;
                                                }
                                            }
                                        } else if (category === 'comments') {
                                            // Comments Import
                                            for (let i = 0; i < validItems.length; i++) {
                                                if (isCancelled) break; // <--- ABORT CHECK
                                                const v = validItems[i];
                                                statsEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-blue-500"></i> Saving comment ${i + 1} of ${validItems.length}...`;
                                                const targetId = getTargetId(v);
                                                if (targetId && v.noteText) {
                                                    await setDoc(doc(db, `users/${currentUser.uid}/comments`, `${v.type}_${targetId}`), {
                                                        type: v.type,
                                                        media_type: v.type,
                                                        [v.type]: v.mediaData,
                                                        comment: v.noteText,
                                                        created_at: v.dateVal,
                                                        spoiler: v.raw?.comment?.spoiler || false
                                                    }, { merge: true });
                                                    importedCount++;
                                                }
                                            }
                                        } else if (category === 'notes') {
                                            // Private Notes Import
                                            for (let i = 0; i < validItems.length; i++) {
                                                if (isCancelled) break; // <--- ABORT CHECK
                                                const v = validItems[i];
                                                statsEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-amber-500"></i> Saving note ${i + 1} of ${validItems.length}...`;
                                                const targetId = getTargetId(v);
                                                if (targetId && v.noteText) {
                                                    await setDoc(doc(db, `users/${currentUser.uid}/notes`, `${v.type}_${targetId}`), {
                                                        title: v.displayTitle,
                                                        text: v.noteText,
                                                        updatedAt: v.dateVal,
                                                        ids: v.mediaData.ids || {} // Inject IDs as an extra fallback
                                                    }, { merge: true });
                                                    importedCount++;
                                                }
                                            }
                                        }

                                        if (!isCancelled) {
                                            // Record this specific category as successfully imported in local storage
                                            const importedState = JSON.parse(localStorage.getItem('vidtrackr_trakt_imports') || '{}');
                                            importedState[category] = true;
                                            localStorage.setItem('vidtrackr_trakt_imports', JSON.stringify(importedState));

                                            previewModal.classList.add('hidden');
                                            showToast(`Successfully imported ${importedCount} ${category}!`, 'success');

                                            // Instantly re-render the settings page so the progress bar updates from 1/7 to 2/7
                                            if (location.hash.startsWith('#settings')) renderSettings();
                                        } else {
                                            showToast(`Import stopped early. ${importedCount} items were saved.`, 'success');
                                        }
                                    } catch(e) {
                                        console.error("Import error:", e);
                                        showToast('An error occurred during import.', 'error');
                                    } finally {
                                        btn.innerHTML = 'Confirm Import';
                                        btn.disabled = false;
                                        
                                        const cancelBtn = document.getElementById('import-cancel-btn');
                                        if (cancelBtn) {
                                            cancelBtn.innerHTML = 'Cancel';
                                            cancelBtn.className = 'bg-gray-700 hover:bg-gray-600 text-white py-3 rounded-lg font-bold transition';
                                        }

                                        e.target.value = '';
                                    }
                                };

                        } catch(err) {
                            console.error(err);
                            showToast('Import failed. Check file format.', 'error');
                            hideLoader();
                            e.target.value = '';
                        }
                    };
                };

                // Bind all Settings Importers
                setupImporter('import-history-file', 'history');
                setupImporter('import-ratings-file', 'ratings');
                setupImporter('import-collection-file', 'collections');
                setupImporter('import-list-file', 'lists');
                setupImporter('import-hidden-file', 'hidden');
                setupImporter('import-notes-file', 'notes');
                setupImporter('import-favorites-file', 'favorites');
                setupImporter('import-comments-file', 'comments');
                
                if(clearBtn) clearBtn.onclick = () => {
                    localStorage.clear(); 
                    showToast('Cache Cleared! Refreshing...'); 
                    setTimeout(() => location.reload(), 1500); 
                }; 
                
                // Render Hidden Items UI
                window.renderHiddenItems = () => {
                    const hiddenArr = JSON.parse(localStorage.getItem('vidtrackr_hidden_upnext') || '[]');
                    const container = document.getElementById('hidden-items-list');
                    if (!container) return;
                    if(hiddenArr.length === 0) {
                        container.innerHTML = '<p class="text-sm text-gray-500 italic p-4 text-center">No hidden items.</p>';
                        return;
                    }
                    container.innerHTML = hiddenArr.map(h => `
                        <div class="flex justify-between items-center bg-gray-800 p-3 rounded-lg border border-gray-700">
                            <span class="text-sm text-gray-300 font-bold truncate">${h.title || ('ID: ' + h.id)} <span class="text-gray-500 font-mono font-normal text-xs ml-2">(${h.type})</span></span>
                            <button class="text-xs bg-red-900/50 hover:bg-red-600 text-red-400 hover:text-white px-3 py-1.5 rounded transition flex-shrink-0 ml-3" onclick="window.unhideItem('${h.id}', '${h.type}')">Unhide</button>
                        </div>
                    `).join('');
                };
                renderHiddenItems();

                    localStorage.removeItem('vidtrackr_hidden_upnext'); 
                    showToast('All hidden items reset!'); 
                    renderHiddenItems();
                    loadUpNext(); 
                }; 
            }, 100); 
        }

                        <button id="tab-notes" class="px-4 py-2 rounded-md text-xs md:text-sm font-bold transition whitespace-nowrap ${activeTab === 'notes' ? 'bg-amber-600 text-white shadow' : 'text-gray-400 hover:text-white'}" onclick="window.switchLib('notes')">Private Notes</button>

        async function renderFavorites(containerId) {
            const currentHash = location.hash;
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = `<div class="text-center py-10"><div class="animate-spin rounded-full h-10 w-10 border-4 border-pink-500 border-t-transparent inline-block"></div></div>`;
            
            if (!currentUser) {
                container.innerHTML = `<p class="text-center text-red-400">Please sign in to view your Hall of Favourites.</p>`;
                return;
            }

            try {
                const querySnapshot = await getDocs(collection(db, `users/${currentUser.uid}/favorites`));
                if (location.hash !== currentHash) return; // Abort if navigated away
                if (querySnapshot.empty) {
                    container.innerHTML = `<div class="text-center p-20 text-gray-500 animate-fade"><i class="fa-solid fa-heart-crack text-6xl mb-4 opacity-50 text-pink-900/50"></i><p>Your Hall of Favourites is empty.</p></div>`;
                    return;
                }

                const items = [];
                querySnapshot.forEach((doc) => {
                    const d = doc.data();
                    d._docId = doc.id;
                    items.push(d);
                });

                // Sort by Added Date (Newest first)
                items.sort((a, b) => new Date(b.favoritedAt || 0) - new Date(a.favoritedAt || 0));

                const gridHtml = `
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6 mb-8 animate-fade">
                        ${items.map(item => {
                            const type = item.type;
                            const data = item[type] || item;
                            
                            let targetId = (primaryDataSource === 'tmdb') ? data.ids?.tmdb : data.ids?.trakt;
                            if (type === 'episode' && primaryDataSource === 'tmdb' && typeof data.ids?.trakt === 'string' && data.ids.trakt.includes('-')) {
                                targetId = data.ids.trakt; // Use composite ID for TMDB episodes
                            }
                            
                            const fallbackId = data.ids?.trakt || data.ids?.tmdb || data.id;
                            const idsStr = encodeURIComponent(JSON.stringify(data.ids || {}));
                            let clickHandler = targetId ? `location.hash='#detail/${type}/${targetId}'` : `window.routeToLocalItem('${type}', '${fallbackId}', '${idsStr}')`;
                            
                            if (targetId && type === 'episode' && primaryDataSource === 'tmdb') {
                                const showTmdb = data.show?.ids?.tmdb || item.show?.ids?.tmdb;
                                const sNum = data.season || data.season_number;
                                const eNum = data.number || data.episode_number;
                                if (showTmdb && sNum !== undefined && eNum !== undefined && !String(targetId).includes('-')) {
                                    clickHandler = `location.hash='#detail/episode/${showTmdb}-${sNum}-${eNum}'`;
                                }
                            }

                            const imgId = `card-img-${type}-${fallbackId}`;
                            const img = getImage(data, type);
                            
                            const showTitle = data.show?.title || data.show?.name || item.show?.title || item.show?.name || item.episode?.show?.title;
                            let displayTitle = data.title || data.name || 'Unknown Title';
                            if (type === 'episode' && showTitle) displayTitle = `${showTitle}: ${displayTitle}`;
                            
                            const dateString = data.release_date || data.first_air_date || data.air_date || data.released;
                            let displayDate = dateString ? new Date(dateString).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : (data.year || 'N/A');
                            
                            let displaySub = displayDate;
                            if (type === 'show') {
                                const epCount = data.number_of_episodes || data.aired_episodes || data.episode_count;
                                if (epCount) displaySub += ` • ${epCount} Eps`;
                            } else if (type === 'episode') {
                                const sNum = data.season !== undefined ? data.season : (data.season_number !== undefined ? data.season_number : '?');
                                const eNum = data.number !== undefined ? data.number : (data.episode_number !== undefined ? data.episode_number : '?');
                                displaySub = `S${sNum}E${eNum} • ${displayDate}`;
                            }
                            const ratingVal = data.rating || data.vote_average || 0;
                            const myRating = userRatings.get(parseInt(fallbackId)) || userRatings.get(parseInt(targetId));
                            const tmdbRatingHtml = ratingVal > 0 ? `<span class="text-white/80 flex items-center gap-1"><i class="fa-solid fa-star text-yellow-500"></i> ${ratingVal.toFixed(1)}</span>` : '';
                            const myRatingHtml = myRating ? `<span class="text-green-400 font-bold flex items-center gap-1 ${ratingVal > 0 ? 'ml-2 border-l border-white/20 pl-2' : ''}"><i class="fa-solid fa-user-check"></i> ${myRating}</span>` : '';
                            const ratingHtml = `<div class="flex items-center">${tmdbRatingHtml}${myRatingHtml}</div>`;

                            return `
                            <div class="relative card rounded-xl overflow-hidden shadow-lg border border-pink-900/30 group hover:border-pink-500 transition">
                                <div class="aspect-[2/3] relative bg-gray-900 cursor-pointer" onclick="${clickHandler}">
                                    <img id="${imgId}" src="${img}" class="w-full h-full object-cover transition duration-500 group-hover:opacity-80" onerror="this.src='${PLACEHOLDER_IMG}'">
                                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent"></div>
                                    <div class="absolute bottom-0 left-0 p-3 w-full">
                                        <p id="card-title-${type}-${fallbackId}" class="font-bold text-sm text-white truncate shadow-black drop-shadow-md" title="${displayTitle.replace(/"/g, '&quot;')}">${displayTitle}</p>
                                        <p class="text-xs text-pink-200 font-mono">${displaySub}</p>
                                    </div>
                                    <div class="absolute top-2 left-2 bg-black/70 px-2 py-1 rounded-md text-xs font-bold backdrop-blur-md border border-white/10 shadow-sm">
                                        ${ratingHtml}
                                    </div>
                                </div>
                                <button onclick="event.stopPropagation(); window.removeFromFavorites('${item._docId}')" class="absolute top-2 right-2 z-10 w-8 h-8 rounded-full bg-pink-900/80 hover:bg-pink-600 text-white flex items-center justify-center opacity-100 md:opacity-0 md:group-hover:opacity-100 transition backdrop-blur shadow-lg border border-white/10" title="Remove from Favourites">
                                    <i class="fa-solid fa-heart-crack text-xs"></i>
                                </button>
                            </div>`;
                        }).join('')}
                    </div>`;
                
                container.innerHTML = gridHtml;

                // Lazy Hydrate TMDB Images
                window.enrichTMDBImages(items, (itemId, enrichedData, rawItem) => {
                    const dataObj = rawItem[rawItem.type] || rawItem;
                    const fallbackId = dataObj.ids?.trakt || dataObj.ids?.tmdb || dataObj.id || itemId;
                    
                    const imgEl = document.getElementById(`card-img-${rawItem.type}-${fallbackId}`);
                    const newImg = getImage(enrichedData, rawItem.type);
                    
                    if (imgEl && newImg && newImg !== PLACEHOLDER_IMG && !imgEl.src.includes(newImg)) {
                        imgEl.style.opacity = 0;
                        setTimeout(() => { imgEl.src = newImg; imgEl.style.opacity = ''; }, 150);
                    }
                    
                    const titleEl = document.getElementById(`card-title-${rawItem.type}-${fallbackId}`);
                    if (titleEl && rawItem.type === 'episode') {
                        const sTitle = enrichedData.show?.title || enrichedData.show?.name || rawItem.show?.title || rawItem.show?.name;
                        const epTitle = enrichedData.title || enrichedData.name;
                        if (sTitle && epTitle) {
                            const expectedTitle = `${sTitle}: ${epTitle}`;
                            if (titleEl.innerText !== expectedTitle) {
                                titleEl.innerText = expectedTitle;
                                titleEl.title = expectedTitle;
                            }
                        }
                    }
                });

            } catch (e) {
                console.error(e);
                container.innerHTML = `<p class="text-center text-red-500">Failed to load Hall of Favourites.</p>`;
            }
        }

        // --- OPT-IN LOCAL SERIES PROGRESS ENGINE ---
        window.calculateLocalSeriesProgress = async (btn) => {
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Calculating...';
            btn.disabled = true;
            
            try {
                // 1. Fetch user history from Firebase
                // Increased to 2500 so it captures all actively watched shows deep in history
                const q = query(collection(db, `users/${currentUser.uid}/history`), orderBy("watchedAt", "desc"), limit(2500));
                const snapshot = await getDocs(q);
                const historyItems = [];
                snapshot.forEach(docSnap => historyItems.push(docSnap.data()));

                // 2. Group by Show & count unique episodes
                const showMap = new Map();
                
                historyItems.forEach(item => {
                    if (item.type !== 'episode') return;
                    const media = item.media || item.episode;
                    if (!media) return;
                    
                    const showObj = media.show || item.show;
                    if (!showObj) return;

                    const tmdbId = showObj.ids?.tmdb || media.ids?.tmdb;
                    // Force identifier to a string to prevent Javascript from treating 123 and "123" as two different shows
                    const identifier = String(tmdbId || showObj.title).trim();
                    if (!identifier || identifier === 'undefined') return;

                    const s = parseInt(media.season !== undefined ? media.season : (media.season_number !== undefined ? media.season_number : 1));
                    const e = parseInt(media.number !== undefined ? media.number : (media.episode_number !== undefined ? media.episode_number : 1));
                    const epString = `S${s}E${e}`;
                    
                    // Capture the timestamp of the actual watch event
                    const watchTime = item.watchedAt || item.loggedAt || new Date().toISOString();

                    if (!showMap.has(identifier)) {
                        showMap.set(identifier, {
                            showTmdbId: tmdbId,
                            showTitle: showObj.title,
                            showObj: showObj,
                            watchedEps: new Set(),
                            maxSeason: s,
                            maxEpisode: e,
                            watchedAt: watchTime
                        });
                    }
                    
                    const entry = showMap.get(identifier);
                    entry.watchedEps.add(epString); // Add to Set to prevent duplicate counts for rewatches
                    
                    // Track max season/ep to find what's next
                    if (s > entry.maxSeason || (s === entry.maxSeason && e > entry.maxEpisode)) {
                        entry.maxSeason = s;
                        entry.maxEpisode = e;
                    }
                    
                    // Keep the most recent watch timestamp for accurate sorting in Up Next
                    if (new Date(watchTime) > new Date(entry.watchedAt)) {
                        entry.watchedAt = watchTime;
                    }
                });

                // WRITE DENORMALIZED STATE TO DB
                // This permanently caches the calculations so loadUpNext() can fetch them instantly
                if (currentUser) {
                    const batchWrites = Array.from(showMap.values()).map(entry => {
                        const progressRef = doc(db, `users/${currentUser.uid}/series_progress`, String(entry.showTmdbId));
                        return setDoc(progressRef, {
                            showTmdbId: entry.showTmdbId,
                            showObj: entry.showObj,
                            maxSeason: entry.maxSeason,
                            maxEpisode: entry.maxEpisode,
                            lastWatchedAt: entry.watchedAt
                        }, { merge: true });
                    });
                    // Execute in background
                    Promise.all(batchWrites).catch(e => console.log('Denormalization push failed', e));
                }

                // Grab the top 10 most recently watched shows
                const activeShows = Array.from(showMap.values()).slice(0, 10);

                // 3. Query TMDB for total aired counts and next episode limits
                const progressResults = await Promise.all(activeShows.map(async (entry) => {
                    try {
                        let tmdbId = entry.showTmdbId;
                        if (!tmdbId && entry.showTitle) {
                            const searchRes = await fetchTMDB(`/search/tv?query=${encodeURIComponent(entry.showTitle)}`);
                            if (searchRes.results && searchRes.results.length > 0) {
                                tmdbId = searchRes.results[0].id;
                                entry.showObj.ids = entry.showObj.ids || {};
                                entry.showObj.ids.tmdb = tmdbId;
                            }
                        }
                        if (!tmdbId) return null;

                        const showDetails = await fetchTMDB(`/tv/${tmdbId}`);
                        if (!showDetails || !showDetails.seasons) return null;

                        // Total Aired (TMDB provides this natively at the root)
                        const totalAired = showDetails.number_of_episodes || 0;
                        
                        let nextS = entry.maxSeason;
                        let nextE = entry.maxEpisode + 1;
                        
                        const currentSeason = showDetails.seasons.find(x => x.season_number === nextS);
                        if (currentSeason && nextE > currentSeason.episode_count) {
                            nextS += 1;
                            nextE = 1;
                        }

                        const targetSeason = showDetails.seasons.find(x => x.season_number === nextS);
                        let nextEpData = null;
                        if (targetSeason && targetSeason.episode_count > 0) {
                            // Only fetch next episode details if the season actually has episodes
                            nextEpData = await fetchTMDB(`/tv/${tmdbId}/season/${nextS}/episode/${nextE}`).catch(() => null);
                        }

                        return {
                            show: entry.showObj,
                            stats: {
                                aired: totalAired,
                                completed: entry.watchedEps.size,
                                next_episode: nextEpData && nextEpData.status_code !== 34 ? { season: nextS, number: nextE } : null
                            }
                        };
                    } catch(e) { return null; }
                }));

                const validShows = progressResults.filter(s => s !== null);

                // Cache the results locally for the session
                sessionStorage.setItem('vidtrackr_local_progress', JSON.stringify(validShows));

                // Sync the calculated progress to Firebase so it loads instantly on other devices!
                if (currentUser) {
                    setDoc(doc(db, `users/${currentUser.uid}/settings`, 'progress_cache'), { data: validShows, timestamp: Date.now() }, { merge: true }).catch(console.error);
                }

                // 4. Render HTML
                const container = document.getElementById('local-series-progress-container');
                if (validShows.length > 0 && container) {
                    container.outerHTML = `
                    <div id="local-series-progress-container">
                        <div class="space-y-4">
                            ${validShows.map(item => {
                                const aired = item.stats.aired || 0;
                                const completed = item.stats.completed || 0;
                                const percent = aired > 0 ? Math.min(100, Math.round((completed / aired) * 100)) : 0;
                                const nextEp = item.stats.next_episode ? `Next: S${item.stats.next_episode.season}E${item.stats.next_episode.number}` : '<span class="text-green-500"><i class="fa-solid fa-check"></i> Up to date</span>';
                                
                                const targetId = (primaryDataSource === 'tmdb') ? item.show.ids?.tmdb : item.show.ids?.trakt;
                                const fallbackId = item.show.ids?.trakt || item.show.ids?.tmdb || item.show.id;

                                return `
                                <div class="card p-4 rounded-xl border border-gray-800 hover:border-yellow-500 transition cursor-pointer group" onclick="location.hash='#detail/show/${targetId || fallbackId}'">
                                    <div class="flex justify-between items-end mb-2">
                                        <h4 class="font-bold truncate text-gray-200 group-hover:text-yellow-500 transition">${item.show.title}</h4>
                                        <span class="text-xs text-gray-500">${completed} / ${aired} eps</span>
                                    </div>
                                    <div class="w-full bg-gray-900 rounded-full h-2.5 mb-2 overflow-hidden">
                                        <div class="bg-gradient-to-r from-yellow-600 to-yellow-400 h-2.5 rounded-full" style="width: ${percent}%;"></div>
                                    </div>
                                    <div class="flex justify-between items-center text-xs">
                                        <span class="text-gray-400 font-mono">${percent}% Complete</span>
                                        <span class="text-gray-500">${nextEp}</span>
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>
                        <div class="mt-4 text-center">
                            <button onclick="sessionStorage.removeItem('vidtrackr_local_progress'); window.calculateLocalSeriesProgress(this)" class="text-xs text-gray-500 hover:text-white bg-gray-800/50 hover:bg-gray-700 px-3 py-1.5 rounded transition border border-gray-700 shadow-md"><i class="fa-solid fa-rotate-right mr-1"></i> Refresh Progress</button>
                        </div>
                    </div>`;
                } else {
                    if (container) container.innerHTML = '<p class="text-red-400">Failed to calculate or no active shows found.</p>';
                }

            } catch(err) {
                console.error(err);
                btn.innerHTML = 'Error calculating. Try again.';
                btn.disabled = false;
            }
        };

        async function renderProgress() {
            const currentHash = location.hash;
            showLoader();
            els.content.innerHTML = '';
            
            try {
                if (location.hash !== currentHash) { hideLoader(); return; } // Abort if navigated away
                // Safety Guard
                if (!currentUser) {
                    els.content.innerHTML = `<div class="text-center p-10 text-gray-500">Please sign in to view your progress and stats.</div>`;
                    hideLoader();
                    return;
                }

                let stats = { movies: { watched: 0, minutes: 0 }, episodes: { watched: 0, minutes: 0 }, network: { friends: 0 } };
                let watchedShows = [];
                let watchedMovies = [];
                let showProgressData = [];

                // 1. Fetch History from Firebase to calculate accurate local stats (with safe caching)
                let localHistory = [];
                const histCacheKey = `vidtrackr_full_history_${currentUser.uid}`;
                const histTimeKey = `${histCacheKey}_time`;
                const now = Date.now();
                
                const cachedHistoryStr = localStorage.getItem(histCacheKey);
                const lastHistoryFetchTime = parseInt(localStorage.getItem(histTimeKey) || '0');
                
                // Use cached history if valid and less than 2 minutes old
                if (cachedHistoryStr && (now - lastHistoryFetchTime < 120000)) {
                    try {
                        localHistory = JSON.parse(cachedHistoryStr);
                    } catch(e) {
                        localHistory = [];
                    }
                }
                
                // If cache is missing or expired, fetch fresh history from Firebase
                if (!localHistory.length) {
                    const q = query(collection(db, `users/${currentUser.uid}/history`), orderBy("watchedAt", "desc"), limit(2500));
                    const snapshot = await getDocs(q);
                    snapshot.forEach(doc => localHistory.push(doc.data()));
                    
                    try {
                        localStorage.setItem(histCacheKey, JSON.stringify(localHistory));
                        localStorage.setItem(histTimeKey, now.toString());
                    } catch(e) { 
                        // Safely handle quota limits on devices with large libraries
                        console.warn("Storage quota reached; continuing without local cache.", e); 
                    }
                }

                // Removed blocking window.enrichTMDBImages(localHistory) to massively speed up progress page loading.
                // It was trying to fetch TMDB data for every single history item before loading the page.

                const uniqueShowIds = new Set();
                
                // --- Deep Analytics Data Structures ---
                const daysOfWeek = [0, 0, 0, 0, 0, 0, 0];
                const decadeCounts = {};

                localHistory.forEach(item => {
                    const type = item.type;
                    const media = item.media;
                    let runtime = parseInt(media.runtime) || 0;
                    
                    // Fallback for imported history logs that are natively missing runtime data
                    if (runtime === 0) {
                        runtime = type === 'episode' ? (parseInt(media.show?.runtime) || 45) : (parseInt(media.movie?.runtime) || 100);
                    }

                    // Deep Analytics: Day of Week
                    const dDate = new Date(item.watchedAt || item.loggedAt);
                    if (!isNaN(dDate)) daysOfWeek[dDate.getDay()]++;

                    // Deep Analytics: Release Eras
                    const yearStr = media.year || media.release_date || media.first_air_date;
                    const parsedYear = parseInt(yearStr ? String(yearStr).substring(0,4) : 0);
                    if (parsedYear && parsedYear >= 1900 && parsedYear <= new Date().getFullYear() + 5) {
                        const decade = Math.floor(parsedYear / 10) * 10;
                        decadeCounts[`${decade}s`] = (decadeCounts[`${decade}s`] || 0) + 1;
                    }

                    if (type === 'movie') {
                        stats.movies.watched++;
                        stats.movies.minutes += runtime;
                        if (watchedMovies.length < 10) {
                            watchedMovies.push({ movie: media, watched_at: item.watchedAt || item.loggedAt });
                        }
                    } else if (type === 'episode') {
                        stats.episodes.watched++;
                        stats.episodes.minutes += runtime;
                        
                        const showId = media.show?.ids?.trakt || media.show?.ids?.tmdb || media.show?.id;
                        if (showId && !uniqueShowIds.has(showId)) {
                            uniqueShowIds.add(showId);
                            watchedShows.push({ show: media.show });
                        }
                    }
                });

                // Trakt Fallback (if Firebase is completely empty but they connected Trakt)
                if (localHistory.length === 0 && traktAccessToken) {
                    try {
                        const [tStats, tWatchedShows, tWatchedMovies] = await Promise.all([
                            fetchDirect('/users/me/stats'),
                            fetchDirect('/sync/watched/shows?limit=12&extended=noseasons'), 
                            fetchDirect('/sync/history/movies?limit=10&extended=images')     
                        ]);
                        if (tStats) stats = tStats;
                        if (tWatchedShows) watchedShows = tWatchedShows;
                        if (tWatchedMovies) watchedMovies = tWatchedMovies;
                    } catch(e) { console.warn("Trakt stats fallback failed", e); }
                }

                watchedShows = watchedShows.slice(0, 12);

                let showsToRender = [];
                const cachedProg = sessionStorage.getItem('vidtrackr_local_progress');
                
                if (cachedProg) {
                    showsToRender = JSON.parse(cachedProg);
                } else {
                    // 2. Fetch detailed progress for Series (Requires Trakt for Aired/Next Ep calculations)
                    if (traktAccessToken && primaryDataSource === 'trakt' && watchedShows.length > 0) {
