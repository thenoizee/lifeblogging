        function renderLibrary(activeTab = 'local') {
            els.content.innerHTML = `
                <div class="flex items-center justify-between mb-8 mt-4 animate-fade">
                    <h2 class="text-2xl font-bold border-l-4 border-[var(--primary)] px-3">Your Library</h2>
                    <div class="flex bg-gray-900/50 p-1 rounded-lg border border-gray-700 overflow-x-auto hide-scroll">
                        <button id="tab-local" class="px-4 py-2 rounded-md text-xs md:text-sm font-bold transition whitespace-nowrap ${activeTab === 'local' ? 'bg-[var(--primary)] text-white shadow' : 'text-gray-400 hover:text-white'}" onclick="window.switchLib('local')">VidTrackr Watchlist</button>
                        ${primaryDataSource === 'trakt' ? `<button id="tab-wl" class="px-4 py-2 rounded-md text-xs md:text-sm font-bold transition whitespace-nowrap ${activeTab === 'watchlist' ? 'bg-[var(--primary)] text-white shadow' : 'text-gray-400 hover:text-white'}" onclick="window.switchLib('watchlist')">Trakt Watchlist</button>` : ''}
                        <button id="tab-collections" class="px-4 py-2 rounded-md text-xs md:text-sm font-bold transition whitespace-nowrap ${activeTab === 'collections' ? 'bg-teal-600 text-white shadow' : 'text-gray-400 hover:text-white'}" onclick="window.switchLib('collections')">Collections</button>
                        <button id="tab-lists" class="px-4 py-2 rounded-md text-xs md:text-sm font-bold transition whitespace-nowrap ${activeTab === 'lists' ? 'bg-[var(--primary)] text-white shadow' : 'text-gray-400 hover:text-white'}" onclick="window.switchLib('lists')">Custom Lists</button>
                        <button id="tab-notes" class="px-4 py-2 rounded-md text-xs md:text-sm font-bold transition whitespace-nowrap ${activeTab === 'notes' ? 'bg-amber-600 text-white shadow' : 'text-gray-400 hover:text-white'}" onclick="window.switchLib('notes')">Private Notes</button>
                        <button id="tab-favorites" class="px-4 py-2 rounded-md text-xs md:text-sm font-bold transition whitespace-nowrap ${activeTab === 'favorites' ? 'bg-pink-600 text-white shadow' : 'text-gray-400 hover:text-white'}" onclick="window.switchLib('favorites')"><i class="fa-solid fa-heart text-pink-300 mr-1"></i> Hall of Favourites</button>
                    </div>
                </div>
                <div id="lib-target"></div>
            `;
            
            window.switchLib = (tab) => {
                // Reset classes
                ['tab-wl', 'tab-local', 'tab-collections', 'tab-lists', 'tab-notes', 'tab-favorites'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.className = "px-4 py-2 rounded-md text-xs md:text-sm font-bold transition whitespace-nowrap text-gray-400 hover:text-white";
                });
                // Set active class safely
                const activeColor = tab === 'notes' ? 'bg-amber-600' : (tab === 'collections' ? 'bg-teal-600' : (tab === 'favorites' ? 'bg-pink-600' : 'bg-[var(--primary)]'));
                const targetTab = document.getElementById(`tab-${tab}`);
                if (targetTab) targetTab.className = `px-4 py-2 rounded-md text-xs md:text-sm font-bold transition whitespace-nowrap ${activeColor} text-white shadow`;

                if(tab === 'local') renderLocalWatchlist('lib-target');
                else if(tab === 'watchlist') renderWatchlist('added', 'lib-target');
                else if(tab === 'collections') renderLocalCollections('lib-target');
                else if(tab === 'notes') renderLocalNotes('lib-target');
                else if(tab === 'favorites') renderFavorites('lib-target');
                else renderLists('lib-target');
            };

            if(activeTab === 'local') renderLocalWatchlist('lib-target');
            else if(activeTab === 'watchlist') renderWatchlist('added', 'lib-target');
            else if(activeTab === 'collections') renderLocalCollections('lib-target');
            else if(activeTab === 'notes') renderLocalNotes('lib-target');
            else if(activeTab === 'favorites') renderFavorites('lib-target');
            else renderLists('lib-target');
        }

        async function renderFavorites(containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = `<div class="text-center py-10"><div class="animate-spin rounded-full h-10 w-10 border-4 border-pink-500 border-t-transparent inline-block"></div></div>`;
            
            if (!currentUser) {
                container.innerHTML = `<p class="text-center text-red-400">Please sign in to view your Hall of Favourites.</p>`;
                return;
            }

            try {
                const querySnapshot = await getDocs(collection(db, `users/${currentUser.uid}/favorites`));
                if (querySnapshot.empty) {
                    container.innerHTML = `<div class="text-center p-20 text-gray-500 animate-fade"><i class="fa-solid fa-heart-crack text-6xl mb-4 opacity-50 text-pink-900/50"></i><p>Your Hall of Favourites is empty.</p></div>`;
                    return;
                }

                const items = [];
                querySnapshot.forEach((doc) => {
                    const d = doc.data();
                    d._docId = doc.id;
                    items.push(d);
                });

                // Sort by Added Date (Newest first)
                items.sort((a, b) => new Date(b.favoritedAt || 0) - new Date(a.favoritedAt || 0));

                const gridHtml = `
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6 mb-8 animate-fade">
                        ${items.map(item => {
                            const type = item.type;
                            const data = item[type] || item;
                            
                            let targetId = (primaryDataSource === 'tmdb') ? data.ids?.tmdb : data.ids?.trakt;
                            const fallbackId = data.id || data.ids?.trakt || data.ids?.tmdb;
                            const idsStr = encodeURIComponent(JSON.stringify(data.ids || {}));
                            let clickHandler = targetId ? `location.hash='#detail/${type}/${targetId}'` : `window.routeToLocalItem('${type}', '${fallbackId}', '${idsStr}')`;
                            
                            if (targetId && type === 'episode' && primaryDataSource === 'tmdb') {
                                const showTmdb = data.show?.ids?.tmdb || item.show?.ids?.tmdb;
                                const sNum = data.season || data.season_number;
                                const eNum = data.number || data.episode_number;
                                if (showTmdb && sNum !== undefined) clickHandler = `location.hash='#detail/episode/${showTmdb}-${sNum}-${eNum}'`;
                            }

                            const imgId = `card-img-${type}-${fallbackId}`;
                            const img = getImage(data, type);
                            const displayTitle = data.title || data.name || 'Unknown Title';
                            let displayYear = data.year;
                            if (!displayYear) {
                                const dateString = data.release_date || data.first_air_date;
                                displayYear = dateString ? dateString.substring(0, 4) : 'N/A';
                            }
                            const ratingVal = data.rating || data.vote_average || 0;
                            const myRating = userRatings.get(parseInt(fallbackId)) || userRatings.get(parseInt(targetId));
                            const ratingHtml = myRating 
                                ? `<span class="text-green-400 font-bold flex items-center gap-1"><i class="fa-solid fa-user-check"></i> ${myRating}</span>`
                                : `<span class="text-white/80 flex items-center gap-1"><i class="fa-solid fa-star text-yellow-500"></i> ${ratingVal.toFixed(1)}</span>`;

                            return `
                            <div class="relative card rounded-xl overflow-hidden shadow-lg border border-pink-900/30 group hover:border-pink-500 transition">
                                <div class="aspect-[2/3] relative bg-gray-900 cursor-pointer" onclick="${clickHandler}">
                                    <img id="${imgId}" src="${img}" class="w-full h-full object-cover transition duration-500 group-hover:opacity-80" onerror="this.src='${PLACEHOLDER_IMG}'">
                                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent"></div>
                                    <div class="absolute bottom-0 left-0 p-3 w-full">
                                        <p class="font-bold text-sm text-white truncate shadow-black drop-shadow-md">${displayTitle}</p>
                                        <p class="text-xs text-pink-200 font-mono">${displayYear}</p>
                                    </div>
                                    <div class="absolute top-2 left-2 bg-black/70 px-2 py-1 rounded-md text-xs font-bold backdrop-blur-md border border-white/10 shadow-sm">
                                        ${ratingHtml}
                                    </div>
                                </div>
                                <button onclick="window.removeFromFavorites('${item._docId}')" class="absolute top-2 right-2 z-10 w-8 h-8 rounded-full bg-pink-900/80 hover:bg-pink-600 text-white flex items-center justify-center opacity-0 group-hover:opacity-100 transition backdrop-blur shadow-lg border border-white/10" title="Remove from Favourites">
                                    <i class="fa-solid fa-heart-crack text-xs"></i>
                                </button>
                            </div>`;
                        }).join('')}
                    </div>`;
                
                container.innerHTML = gridHtml;

                // Lazy Hydrate TMDB Images
                window.enrichTMDBImages(items, (itemId, enrichedData, rawItem) => {
                    const dataObj = rawItem[rawItem.type] || rawItem;
                    const fallbackId = dataObj.ids?.trakt || dataObj.id || dataObj.ids?.tmdb || itemId;
                    const imgEl = document.getElementById(`card-img-${rawItem.type}-${fallbackId}`);
                    const newImg = getImage(enrichedData, rawItem.type);
                    
                    if (imgEl && newImg && newImg !== PLACEHOLDER_IMG && !imgEl.src.includes(newImg)) {
                        imgEl.style.opacity = 0;
                        setTimeout(() => { imgEl.src = newImg; imgEl.style.opacity = ''; }, 150);
                    }
                });

            } catch (e) {
                console.error(e);
                container.innerHTML = `<p class="text-center text-red-500">Failed to load Hall of Favourites.</p>`;
            }
        }

        // --- OPT-IN LOCAL SERIES PROGRESS ENGINE ---
        window.calculateLocalSeriesProgress = async (btn) => {
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Calculating...';
            btn.disabled = true;
            
            try {
                // 1. Fetch user history from Firebase
                const q = query(collection(db, `users/${currentUser.uid}/history`), orderBy("watchedAt", "desc"), limit(600));
                const snapshot = await getDocs(q);
                const historyItems = [];
                snapshot.forEach(docSnap => historyItems.push(docSnap.data()));

                // 2. Group by Show & count unique episodes
                const showMap = new Map();
                
                historyItems.forEach(item => {
                    if (item.type !== 'episode') return;
                    const media = item.media || item.episode;
                    if (!media) return;
                    
                    const showObj = media.show || item.show;
                    if (!showObj) return;

                    const tmdbId = showObj.ids?.tmdb || media.ids?.tmdb;
                    const identifier = tmdbId || showObj.title;
                    if (!identifier) return;

                    const s = parseInt(media.season || media.season_number || 1);
                    const e = parseInt(media.number || media.episode_number || 1);
                    const epString = `S${s}E${e}`;

                    if (!showMap.has(identifier)) {
                        showMap.set(identifier, {
                            showTmdbId: tmdbId,
                            showTitle: showObj.title,
                            showObj: showObj,
                            watchedEps: new Set(),
                            maxSeason: s,
                            maxEpisode: e
                        });
                    }
                    
                    const entry = showMap.get(identifier);
                    entry.watchedEps.add(epString); // Add to Set to prevent duplicate counts for rewatches
                    
                    // Track max season/ep to find what's next
                    if (s > entry.maxSeason || (s === entry.maxSeason && e > entry.maxEpisode)) {
                        entry.maxSeason = s;
                        entry.maxEpisode = e;
                    }
                });

                // Grab the top 10 most recently watched shows
                const activeShows = Array.from(showMap.values()).slice(0, 10);

                // 3. Query TMDB for total aired counts and next episode limits
                const progressResults = await Promise.all(activeShows.map(async (entry) => {
                    try {
                        let tmdbId = entry.showTmdbId;
                        if (!tmdbId && entry.showTitle) {
                            const searchRes = await fetchTMDB(`/search/tv?query=${encodeURIComponent(entry.showTitle)}`);
                            if (searchRes.results && searchRes.results.length > 0) {
                                tmdbId = searchRes.results[0].id;
                                entry.showObj.ids = entry.showObj.ids || {};
                                entry.showObj.ids.tmdb = tmdbId;
                            }
                        }
                        if (!tmdbId) return null;

                        const showDetails = await fetchTMDB(`/tv/${tmdbId}`);
                        if (!showDetails || !showDetails.seasons) return null;

                        // Total Aired (TMDB provides this natively at the root)
                        const totalAired = showDetails.number_of_episodes || 0;
                        
                        let nextS = entry.maxSeason;
                        let nextE = entry.maxEpisode + 1;
                        
                        const currentSeason = showDetails.seasons.find(x => x.season_number === nextS);
                        if (currentSeason && nextE > currentSeason.episode_count) {
                            nextS += 1;
                            nextE = 1;
                        }

                        const targetSeason = showDetails.seasons.find(x => x.season_number === nextS);
                        let nextEpData = null;
                        if (targetSeason && targetSeason.episode_count > 0) {
                            // Only fetch next episode details if the season actually has episodes
                            nextEpData = await fetchTMDB(`/tv/${tmdbId}/season/${nextS}/episode/${nextE}`).catch(() => null);
                        }

                        return {
                            show: entry.showObj,
                            stats: {
                                aired: totalAired,
                                completed: entry.watchedEps.size,
                                next_episode: nextEpData && nextEpData.status_code !== 34 ? { season: nextS, number: nextE } : null
                            }
                        };
                    } catch(e) { return null; }
                }));

                const validShows = progressResults.filter(s => s !== null);

                // 4. Render HTML
                const container = document.getElementById('local-series-progress-container');
                if (validShows.length > 0 && container) {
                    container.outerHTML = `<div class="space-y-4">${validShows.map(item => {
                        const aired = item.stats.aired;
                        const completed = item.stats.completed;
                        const percent = aired > 0 ? Math.min(100, Math.round((completed / aired) * 100)) : 0;
                        const nextEp = item.stats.next_episode ? `Next: S${item.stats.next_episode.season}E${item.stats.next_episode.number}` : '<span class="text-green-500"><i class="fa-solid fa-check"></i> Up to date</span>';
                        
                        return `
                        <div class="card p-4 rounded-xl border border-gray-800 hover:border-yellow-500 transition cursor-pointer group" onclick="location.hash='#detail/show/${item.show.ids?.trakt || item.show.ids?.tmdb}'">
                            <div class="flex justify-between items-end mb-2">
                                <h4 class="font-bold truncate text-gray-200 group-hover:text-yellow-500 transition">${item.show.title}</h4>
                                <span class="text-xs text-gray-500">${completed} / ${aired} eps</span>
                            </div>
                            <div class="w-full bg-gray-900 rounded-full h-2.5 mb-2 overflow-hidden">
                                <div class="bg-gradient-to-r from-yellow-600 to-yellow-400 h-2.5 rounded-full" style="width: ${percent}%;"></div>
                            </div>
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-gray-400 font-mono">${percent}% Complete</span>
                                <span class="text-gray-500">${nextEp}</span>
                            </div>
                        </div>`;
                    }).join('')}</div>`;
                } else {
                    if (container) container.innerHTML = '<p class="text-red-400">Failed to calculate or no active shows found.</p>';
                }

            } catch(err) {
                console.error(err);
                btn.innerHTML = 'Error calculating. Try again.';
                btn.disabled = false;
            }
        };

                            watchedMovies.push({ movie: media, watched_at: item.watchedAt || item.loggedAt });

                                    <div>

                                    </div>

                                    <div class="w-12 h-12 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-500"><i class="fa-solid fa-film text-xl"></i></div>
                                    <div>
                                        <p class="text-xs text-gray-500 font-bold uppercase">Movies</p>
                                        <p class="text-2xl font-bold text-white">${stats.movies.watched.toLocaleString()}</p>
                                    </div>
                                </div>
                                <div class="card p-6 rounded-xl border border-gray-800 flex items-center gap-4">
                                    <div class="w-12 h-12 rounded-full bg-yellow-500/20 flex items-center justify-center text-yellow-500"><i class="fa-solid fa-tv text-xl"></i></div>
                                    <div>
                                        <p class="text-xs text-gray-500 font-bold uppercase">Episodes</p>
                                        <p class="text-2xl font-bold text-white">${stats.episodes.watched.toLocaleString()}</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div class="lg:col-span-2">
                                <h3 class="text-xl font-bold mb-4 flex items-center"><i class="fa-solid fa-bars-progress mr-2 text-yellow-500"></i> Series Progress</h3>
                                <div class="space-y-4">
                                    ${validShows.length > 0 ? validShows.map(item => {
                                        const aired = item.stats.aired;

                                        return `

        // New Database Helper: Logs completed or partial watches securely to Firebase
        window.logWatchToFirebase = async (item, type, progress, date, rating = null) => {
            if (!currentUser) return false;
            try {
                // Robust ID extraction for movies, shows, and episodes
                let targetId = item.ids?.trakt || item.ids?.tmdb || item.id;
                if (!targetId && type === 'episode') {
                    // Fallback for custom formatted episode hashes
                    targetId = item.show?.ids?.tmdb || item.show?.ids?.trakt;
                }

                const payload = {
                    type: type,
                    media: item,
                    progress: progress,
                    watchedAt: date,
                    loggedAt: new Date().toISOString(),
                    itemId: targetId ? String(targetId) : null
                };
                
                if (rating) {
                    payload.rating = parseInt(rating);
                    payload.ratedAt = new Date().toISOString();
                }

                await setDoc(doc(collection(db, `users/${currentUser.uid}/history`)), payload);
                return true;
            } catch (e) {
                console.error("Firebase Log Error:", e);
                return false;
            }
        };

        async function handleAction(actionType) {
            if (!currentModalItem || !currentModalItem.item || !currentModalItem.item.ids) {
                showToast("Error: Invalid item data", "error");
                els.modal.classList.add('hidden');
                return;
            }

            els.modal.classList.add('hidden'); 
            showLoader(); 
            
            // Support both TMDB IDs and Trakt IDs seamlessly
            const traktId = currentModalItem.item.ids.trakt || currentModalItem.item.id;
            const type = currentModalItem.type;
            const rootKey = type === 'episode' ? 'episodes' : (type === 'show' ? 'shows' : 'movies'); 
            const ids = { ids: { trakt: traktId } }; 
            
            // Get inputs
            const dateStr = document.getElementById('custom-date').value; 
            const date = dateStr ? new Date(dateStr).toISOString() : selectedDate; 
            const rating = parseInt(els.ratingSlider.value); 
            const minutes = parseInt(document.getElementById('custom-progress').value);
            const runtime = currentModalItem.item.runtime || 0;

            try { 
                // 1. Handle Rating
                if (actionType === 'rate-only' || actionType === 'rate-log') {
                    // Only push rating to Trakt if explicitly enabled
                    if (traktAccessToken && primaryDataSource === 'trakt') {
                        const payloadRate = { [rootKey]: [{ ...ids, rating: rating, rated_at: new Date().toISOString() }] }; 
                        await fetch(`${TRAKT_API_URL}/sync/ratings`, { method: 'POST', headers: traktHeader(), body: JSON.stringify(payloadRate) }); 
                    }
                    // Push rating to Firebase Local DB
                    if (currentUser) {
                        await setDoc(doc(db, `users/${currentUser.uid}/ratings`, String(traktId)), { rating: rating, ratedAt: new Date().toISOString() }, { merge: true });
                    }
                    userRatings.set(parseInt(traktId), rating); 
                    if(actionType === 'rate-only') showToast(`Rated ${rating}/10`);
                }

                // 2. Handle Logging vs Scrobbling (Partial Watch)
                if (actionType !== 'rate-only') {
                    let progress = 100;
                    if (minutes > 0 && runtime > 0 && minutes < runtime) {
                        progress = Math.min(100, (minutes / runtime) * 100);
                    }
                    
                    const passedRating = (actionType === 'rate-log') ? rating : null;
                    
                    // A. Log to your independent Firebase database
                    if (progress < 100 && currentUser) {
                        // Save partial progress locally
                        const pbPayload = { id: traktId, progress: progress, type: type, paused_at: new Date().toISOString(), [type === 'episode' ? 'episode' : 'movie']: currentModalItem.item, show: currentModalItem.item.show || null };
                        await setDoc(doc(db, `users/${currentUser.uid}/playback`, String(traktId)), pbPayload);
                        userPlayback.set(parseInt(traktId), pbPayload);
                    } else if (progress >= 100) {
                        // Log full watch and clear partial progress
                        await window.logWatchToFirebase(currentModalItem.item, type, progress, date, passedRating);
                        if (currentUser) await deleteDoc(doc(db, `users/${currentUser.uid}/playback`, String(traktId)));
                        userPlayback.delete(parseInt(traktId));
                    }
                    
                    // B. Log to Trakt (Only if enabled and authenticated)
                    if (traktAccessToken && primaryDataSource === 'trakt') {
                        if (progress < 100) {
                            const payloadScrobble = { [type === 'episode' ? 'episode' : 'movie']: { ...ids }, progress: progress, app_version: "1.0" };
                            await fetch(`${TRAKT_API_URL}/scrobble/stop`, { method: 'POST', headers: traktHeader(), body: JSON.stringify(payloadScrobble) });
                        } else {
                            const payloadLog = { [rootKey]: [{ ...ids, watched_at: date }] }; 
                            await fetch(`${TRAKT_API_URL}/sync/history`, { method: 'POST', headers: traktHeader(), body: JSON.stringify(payloadLog) }); 
                        }
                    }
                    
                    showToast(progress < 100 ? `Progress updated to ${Math.round(progress)}%` : `Logged as Watched`);
                }
                
                // Refresh Views
                if (location.hash.startsWith('#detail')) {
                     const parts = location.hash.split('/');
                     if(parts[3] === 'season' && parts[4]) renderDetail(parts[1], parts[2], parts[4]);
                     else renderDetail(parts[1], parts[2]);
                }
                if (document.getElementById('up-next-container')) loadUpNext(); 
                if (document.getElementById('last-watched-container')) loadLastWatched();

            } catch(e) { console.error(e); showToast('Action failed', 'error'); } 
            hideLoader(); 
        }

        async function loadSearch(rawQuery) {
            if (!rawQuery) return;
            showLoader();
            els.content.innerHTML = '';
            
            // Decode the query first to avoid double-encoding spaces
            const query = decodeURIComponent(rawQuery);

            try {
                // Use TMDB multi search endpoint to get movies, tv, and people
                const searchParams = new URLSearchParams({ 
                    api_key: TMDB_API_KEY, 
                    query: query,
                    include_adult: false // Optional filter
                });
                
                // Call TMDB directly instead of the Trakt proxy
                const res = await fetch(`https://api.themoviedb.org/3/search/multi?${searchParams.toString()}`);
                const rawData = await res.json();
                
                // Extract results from TMDB response and normalize types
                const data = (rawData.results || []).map(item => ({
                    ...item,
                    type: item.media_type === 'tv' ? 'show' : item.media_type
                }));

                if (data.length === 0) {
                    els.content.innerHTML = `<div class="text-center p-20 text-gray-500 animate-fade"><i class="fa-solid fa-magnifying-glass text-6xl mb-4 opacity-50"></i><p>No results found.</p></div>`;
                } else {
                    renderGrid(`Results: "${query}"`, data);
                }
            } catch (e) {
                console.error(e);
                showToast('Search failed', 'error');
            }
            hideLoader();
        }

                            <select id="list-sort-select" class="bg-gray-800 border border-gray-700 text-xs md:text-sm rounded-lg px-3 py-2 outline-none focus:border-[var(--primary)] text-gray-300">
                                <option value="rank">Rank (Default)</option>
                                <option value="added">Recently Added</option>
                                <option value="title">Title (A-Z)</option>
                                <option value="year">Year (Newest)</option>
                            </select>
                        </div>

                        <div id="list-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
                    </div>`;

                renderGridLocal('rank');
                document.getElementById('list-sort-select').onchange = (e) => renderGridLocal(e.target.value);

            } catch (e) { 
                console.error(e);
                showToast('Could not load list items', 'error'); 
            } 
            hideLoader(); 
        }

        function handleRoute() {
        const hash = location.hash || '#dashboard';
        
        // FIX: Only update Nav Highlight if we are on a main tab
        const rootTab = hash.split('/')[0].replace('#', '');
        const mainTabs = ['dashboard', 'library', 'progress', 'history', 'settings'];
        
        if (mainTabs.includes(rootTab)) {
            nav.switchTab(rootTab);
        }

        // Render Page Content
        if(hash.startsWith('#dashboard')) renderDashboard();
        else if(hash.startsWith('#library')) renderLibrary(); 
        else if(hash.startsWith('#watchlist')) renderLibrary('watchlist'); 
        else if(hash.startsWith('#history')) renderHistory();
        else if(hash.startsWith('#progress')) renderProgress();
        else if(hash.startsWith('#settings')) renderSettings();
        else if(hash === '#lists') renderLibrary('lists'); 
        else if(hash.startsWith('#lists/')) renderListItems(hash.split('/')[1]);
        else if(hash.startsWith('#search')) loadSearch(hash.split('/')[1]);
        else if(hash.startsWith('#detail')) {
            const parts = hash.split('/');
            // FIX: Prevent loading if IDs are undefined
            if (parts[1] === 'undefined' || parts[2] === 'undefined' || !parts[2]) {
                console.error("Invalid Route Parameters detected. Redirecting to dashboard.");
                location.hash = '#dashboard';
                return;
            }

            if (parts[1] === 'person') renderPerson(parts[2]);
            else if(parts[3] === 'season' && parts[4]) renderDetail(parts[1], parts[2], parts[4]);
            else renderDetail(parts[1], parts[2]);
        }
    }
        window.addEventListener('hashchange', handleRoute);

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                if (location.hash.startsWith('#history')) {
                    renderHistory(1); 
                }
            }
        });

        // --- Progress Slider Logic ---
const slider = document.getElementById('progress-slider');
const numInput = document.getElementById('custom-progress');
const percentDisplay = document.getElementById('progress-percent-display');

// Sync Slider -> Number Input
slider.addEventListener('input', (e) => {
    const pct = parseInt(e.target.value);
    percentDisplay.innerText = `${pct}%`;
    if(currentModalItem && currentModalItem.item.runtime) {
        numInput.value = Math.round((pct / 100) * currentModalItem.item.runtime);
    }
});

// Sync Number Input -> Slider
numInput.addEventListener('input', (e) => {
    if(currentModalItem && currentModalItem.item.runtime) {
        const val = parseInt(e.target.value) || 0;
        const pct = Math.min(100, Math.round((val / currentModalItem.item.runtime) * 100));
        slider.value = pct;
        percentDisplay.innerText = `${pct}%`;
    }
});

// "Mark 100% Watched" Button Handler
document.getElementById('btn-mark-watched').onclick = () => {
    if(currentModalItem && currentModalItem.item.runtime) {
        slider.value = 100;
        numInput.value = currentModalItem.item.runtime;
        handleAction('log-only'); // This will trigger the "Full Watch" logic in handleAction
    }
};

        els.ratingSlider.oninput = (e) => els.ratingValue.innerText = e.target.value;
        // --- Search Listener ---
    const searchHandler = debounce((e) => {
        const val = e.target.value.trim();
        if (val.length > 1) location.hash = `#search/${val}`; 
        else if (val.length === 0) history.back();
    }, 600);

    // Attach to the NEW dynamically injected input
    const desktopSearch = document.getElementById('search-input');
    if (desktopSearch) desktopSearch.addEventListener('input', searchHandler);
    
    // Attach to the existing mobile input
    const mobileSearch = document.getElementById('mobile-search-input');
    if (mobileSearch) mobileSearch.addEventListener('input', searchHandler);

        document.addEventListener('click', e => {
            const btn = e.target.closest('.scrobble-btn');
            if (btn) {
                const data = JSON.parse(btn.dataset.json);
                // FIX: Trust the type in the JSON data first. 
                // Only fall back to dataset logic if data.type is missing.
                const itemType = data.type || (btn.dataset.type === 'show' ? 'episode' : 'movie');
                
                currentModalItem = { item: data, type: itemType };
                document.getElementById('custom-progress').value = ''; // Add this line
document.getElementById('modal-title').innerText = data.title;
                els.modal.classList.remove('hidden');
                if(data.runtime) {
        // Check if we have existing progress in userPlayback map
        const existing = userPlayback.get(parseInt(data.ids.trakt));
        const currentPct = existing ? existing.progress : 0;
        
        slider.value = Math.round(currentPct);
        percentDisplay.innerText = `${Math.round(currentPct)}%`;
        numInput.value = Math.round((currentPct/100) * data.runtime);
    }
                const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                document.getElementById('custom-date').value = now.toISOString().slice(0, 16);
                selectedDate = new Date().toISOString();
            }
            // ... (keep existing listeners for closing modal etc if you have them, otherwise just close the block)
            if(e.target.closest('.date-option')) {
                const type = e.target.closest('.date-option').dataset.date;
                const d = new Date(); if(type === 'yesterday') d.setDate(d.getDate()-1);
                selectedDate = d.toISOString();
                document.querySelectorAll('.date-option').forEach(b => b.classList.remove('border-[var(--primary)]', 'bg-[var(--primary)]/10'));
                e.target.closest('.date-option').classList.add('border-[var(--primary)]', 'bg-[var(--primary)]/10');
            }
            if(e.target.closest('#confirm-log')) handleAction('log-only');
            if(e.target.closest('#confirm-rate-log')) handleAction('rate-log');
            if(e.target.closest('#confirm-rate-only')) handleAction('rate-only');
            if(e.target.closest('#close-modal')) els.modal.classList.add('hidden');
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                // Only refresh if on history tab AND enough time has passed (e.g. 1 min)
                if (location.hash.startsWith('#history')) {
                    if (Date.now() - lastHistoryFetch > 60000) {
                        renderHistory(1); 
                    } else {
                        console.log("Skipping history refresh (Rate Limited)");
                    }
                }
            }
        });

       // --- AUTH LISTENER ---
    onAuthStateChanged(auth, async user => {
        currentUser = user;
        if (user) {
            // FIX: Update the Avatar using the new method
            nav.updateUser(user.email);

            // Re-bind dynamic elements
            els.searchContainer = document.getElementById('search-container');
            if(els.searchContainer) {
                els.searchContainer.classList.remove('hidden');
                // Re-attach listener if element was re-created
                document.getElementById('search-input').addEventListener('input', searchHandler);
            }

            // Sync Trakt Token (Existing Logic)
            try {
                const snap = await getDoc(doc(db, 'users', user.uid, 'services', 'trakt'));
                if (snap.exists() && snap.data().accessToken) { 
                    const dbToken = snap.data().accessToken;
                    if (traktAccessToken !== dbToken) {
                        traktAccessToken = dbToken;
                        localStorage.setItem('trakt_token', traktAccessToken);
                    }
                } else if (traktAccessToken) {
                    await setDoc(doc(db, 'users', user.uid, 'services', 'trakt'), { 
                        accessToken: traktAccessToken, updatedAt: new Date()
                    }, { merge: true });
                }
            } catch(e) { console.warn("Firestore sync error", e); }

            if (traktAccessToken) { 
                await Promise.all([syncUserRatings(), syncPlayback()]);
            }
            checkActiveWatching();
            handleRoute();
        } else { 
            // Render Login Form (No changes needed here)
            els.content.innerHTML = `<div class="max-w-md mx-auto card p-10 rounded-2xl shadow-2xl mt-12 text-center animate-fade"><div class="mb-6 inline-block p-4 rounded-full bg-[var(--primary)]/10"><i class="fa-solid fa-ticket text-5xl text-[var(--primary)]"></i></div><h1 class="text-4xl font-bold mb-2 text-[var(--primary)]">VidTrackr</h1><p class="text-gray-400 mb-8">Sign in to track your movies and shows.</p><button class="w-full bg-white text-gray-900 font-bold py-3 rounded-lg hover:bg-gray-200 transition mb-4 shadow-lg" onclick="document.getElementById('email-login').classList.remove('hidden'); this.classList.add('hidden');">Sign In / Sign Up</button><form id="email-login" class="space-y-4 hidden animate-fade"><input type="email" id="email" placeholder="Email" class="w-full p-4 rounded-lg bg-[var(--bg)] border border-gray-700 focus:border-[var(--primary)] outline-none transition" required><input type="password" id="password" placeholder="Password" class="w-full p-4 rounded-lg bg-[var(--bg)] border border-gray-700 focus:border-[var(--primary)] outline-none transition" required><div class="flex gap-3"><button type="submit" name="login" class="flex-1 btn-primary py-3 rounded-lg font-bold">Login</button><button type="submit" name="signup" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white py-3 rounded-lg font-bold transition">Sign Up</button></div></form></div>`; 
            
            const loginForm = document.getElementById('email-login');
            if(loginForm) {
                loginForm.onsubmit = async (e) => { 
                    e.preventDefault(); 
                    try { 
                        if (e.submitter.name === 'signup') await createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); 
                        else await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); 
                    } catch(err) { showToast(err.message, 'error'); } 
                };
            }
        }
    });
    </script>
