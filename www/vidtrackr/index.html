    <style>
        :root {
            --primary: #ed2224; --primary-hover: #c01e1f;
            --bg-dark: #111827; 
            /* Adaptive layered transparency for main cards (Glassmorphism) */
            --card-dark: rgba(31, 41, 55, 0.85); 
            --text-dark: #f9fafb;
            --bg-light: #f3f4f6; 
            /* Light mode adaptive transparency */
            --card-light: rgba(255, 255, 255, 0.85); 
            --text-light: #111827;
            /* Softer base shadows and a vibrant expressive shadow for hover states */
            --shadow-color: rgba(0, 0, 0, 0.4);
            --expressive-shadow: 0 10px 25px -5px rgba(237, 34, 36, 0.2), 0 8px 10px -6px rgba(237, 34, 36, 0.1);
        }
        .dark { --bg: var(--bg-dark); --card: var(--card-dark); --text: var(--text-dark); }
        .light { --bg: var(--bg-light); --card: var(--card-light); --text: var(--text-light); }
        
        body { background-color: var(--bg); color: var(--text); transition: background-color 0.3s, color 0.3s; }
@media (max-width: 768px) {
    body { padding-bottom: 80px; }
}

        /* Glassmorphism effect for main UI cards (layered depth processing) */
        .card { 
            background-color: var(--card); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(0,0,0,0.05); /* Create extra bottom depth */
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            /* Enable hardware acceleration for mobile glass effect rendering */
            transform: translateZ(0); 
            will-change: transform, backdrop-filter;
        }
        .card:hover {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
            transform: translateY(-3px);
            border-color: rgba(237, 34, 36, 0.3);
        }

        /* Adding fluid transitions and tactile transform for primary buttons */
        .btn-primary { 
            background-color: var(--primary); 
            color: white; 
            box-shadow: 0 4px 6px -1px rgba(237, 34, 36, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        /* Tactile feedback on hover and active states for layered depth */
        .btn-primary:hover:not(:disabled) { 
            background-color: var(--primary-hover); 
            box-shadow: var(--expressive-shadow); 
            transform: translateY(-2px); 
        }
        .btn-primary:active:not(:disabled) { 
            transform: translateY(1px); 
            box-shadow: 0 1px 2px rgba(237, 34, 36, 0.2); 
        }

        /* Global Tactile Feedback for all standard UI buttons */
        button { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important; }
        button:hover:not(:disabled) { transform: translateY(-2px); }
        button:active:not(:disabled) { transform: translateY(1px); }

        /* Background var glassmorphism applied to containers automatically */
        .bg-\[var\(--card\)\] {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            /* Enable hardware acceleration for mobile glass effect rendering */
            transform: translateZ(0);
        }

        .nav-link.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        
        /* Premium Modal Pop Animation mirroring HealthManagr */
        @keyframes modalPop { 0% { transform: scale(0.95) translateY(10px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        .animate-fade { animation: modalPop 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

/* Add inside the <style> tag */
.nav-tab { 
    padding: 0.5rem 1rem; 
    border-radius: 0.5rem; 
    transition: all 0.2s; 
    font-weight: 600; 
    color: #9ca3af; /* Gray-400 */
    text-decoration: none;
    display: inline-flex;
    align-items: center;
}
.nav-tab:hover { 
    color: var(--text); 
    background: rgba(0,0,0,0.05); 
}
.dark .nav-tab:hover {
    background: rgba(255,255,255,0.05);
}
.nav-tab.active { 
    color: var(--primary); 
    background: rgba(237, 34, 36, 0.1); /* Primary color with opacity */
}
        
        /* Mobile-friendly Slider Styles */
input[type=range] { 
    -webkit-appearance: none; 
    width: 100%; 
    background: transparent; 
    height: 40px; 
    margin: 0;
    cursor: pointer;
}

/* The Slider Track (with Dots/Ticks) */
input[type=range]::-webkit-slider-runnable-track { 
    width: 100%; 
    height: 6px; 
    cursor: pointer; 
    border-radius: 3px;
    
    /* Base dark gray color */
    background-color: #4b5563; 
    
    /* Creates 10 evenly spaced "dots" (small tick marks) */
    background-image: repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.4) 0, 
        rgba(255,255,255,0.4) 2px, 
        transparent 2px, 
        transparent calc((100% - 2px) / 9)
    );
}

/* The Slider Thumb (Big Red Circle) */
input[type=range]::-webkit-slider-thumb { 
    -webkit-appearance: none; 
    height: 25px; 
    width: 25px; 
    border-radius: 50%; 
    background: var(--primary); /* Solid Red */
    cursor: pointer; 
    margin-top: -10px; /* Centers thumb on track */
    box-shadow: 0 2px 6px rgba(0,0,0,0.4); 
    border: 2px solid white; 
}

/* Firefox Support */
input[type=range]::-moz-range-track {
    width: 100%;
    height: 6px;
    cursor: pointer;
    border-radius: 3px;
    background-color: #4b5563;
    background-image: repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.4) 0, 
        rgba(255,255,255,0.4) 2px, 
        transparent 2px, 
        transparent calc((100% - 2px) / 9)
    );
}
input[type=range]::-moz-range-thumb {
    height: 32px;
    width: 32px;
    border: 2px solid white;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}
        
        /* Custom scrollbar for desktop, hidden on mobile for app-like feel */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
        
        @media (max-width: 768px) {
            ::-webkit-scrollbar { display: none; }
            * { scrollbar-width: none; }
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .nav-btn {
            position: absolute; 
            top: 50%; 
            transform: translateY(-50%);
            background: rgba(0,0,0,0.5); 
            color: white;
            width: 50px; 
            height: 50px; 
            border-radius: 50%;
            display: flex; 
            align-items: center; 
            justify-content: center;
            backdrop-filter: blur(4px); 
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 20; 
            cursor: pointer;
            
            /* FIX: Default to visible (for mobile/iPad) */
            opacity: 1; 
        }

        /* FIX: Only hide and use hover effect on devices that actually support hover */
        @media (hover: hover) {
            .nav-btn { opacity: 0; }
            .group:hover .nav-btn { opacity: 1; }
        }

        .nav-btn:hover { background: var(--primary); transform: translateY(-50%) scale(1.1); }
        .nav-prev { left: 20px; }
        .nav-next { right: 20px; } 
        
        /* Mobile Nav Styles */
        .mobile-nav-link { color: #9ca3af; flex-direction: column; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; gap: 4px; }
        .mobile-nav-link.active { color: var(--primary); }
        .mobile-nav-link i { font-size: 1.25rem; }
    </style>
</head>

        // --- LIVE TMDB HYDRATION LAYER ---
        // --- LIVE TMDB HYDRATION LAYER (V2: Cached & 1-by-1 Callbacks) ---
        window.enrichTMDBImages = async (itemsArray, onProgress = null) => {
            if (!itemsArray || itemsArray.length === 0) return;
            
            const toFetch = [];

            // Phase 1: Instantly resolve from local cache
            for (const item of itemsArray) {
                if (!item) continue;
                const type = item.type || item.media_type;
                let data = item.media || ((type && item[type]) ? item[type] : item);
                if (!data) continue;

                // Needs hydration if missing images OR missing runtime
                const needsImages = !(data.poster_path || data.backdrop_path || data.still_path);
                const needsRuntime = data.runtime === undefined;

                if (!needsImages && !needsRuntime) {
                    if (onProgress) onProgress(item.id || data.ids?.trakt, data, item);
                    continue;
                }

                const tmdbId = data.ids?.tmdb || data.tmdb || data.id; // Also fallback to data.id for TMDB items
                if (!tmdbId) continue;

                // Check localStorage Cache
                const cacheKey = `vt_img_${type}_${tmdbId}`;
                const cached = localStorage.getItem(cacheKey);
                if (cached) {
                    try {
                        const parsed = JSON.parse(cached);
                        let cacheValid = true;
                        if (needsImages && !(parsed.poster_path || parsed.backdrop_path || parsed.still_path)) cacheValid = false;
                        if (needsRuntime && parsed.runtime === undefined) cacheValid = false;

                        if (cacheValid) {
                            if (parsed.poster_path) data.poster_path = parsed.poster_path;
                            if (parsed.backdrop_path) data.backdrop_path = parsed.backdrop_path;
                            if (parsed.still_path) data.still_path = parsed.still_path;
                            if (parsed.runtime !== undefined) data.runtime = parsed.runtime;
                            if (onProgress) onProgress(item.id || data.ids?.trakt, data, item);
                            continue; // No network request needed!
                        }
                    } catch(e) {}
                }

                // If not cached or incomplete, queue it for fetching
                toFetch.push({ item, type, data, tmdbId, cacheKey });
            }

            if (toFetch.length === 0) return;

            // Phase 2: Fetch missing data in chunks and update 1-by-1
            const chunks = [];
            for (let i = 0; i < toFetch.length; i += 10) chunks.push(toFetch.slice(i, i + 10));

            for (const chunk of chunks) {
                await Promise.all(chunk.map(async ({ item, type, data, tmdbId, cacheKey }) => {
                    try {
                        let cacheData = {};
                        if (type === 'episode') {
                            const showTmdbId = item.show?.ids?.tmdb || data.show?.ids?.tmdb || item.show?.tmdb || tmdbId;
                            const sNum = data.season || data.season_number;
                            const epNum = data.number || data.episode_number;
                            if (showTmdbId && sNum !== undefined && epNum !== undefined) {
                                const res = await fetchTMDB(`/tv/${showTmdbId}/season/${sNum}/episode/${epNum}`);
                                data.still_path = res.still_path;
                                data.runtime = res.runtime || 0;
                                cacheData = { still_path: res.still_path, runtime: data.runtime };
                            }
                        } else {
                            const tmdbType = type === 'show' ? 'tv' : 'movie';
                            const res = await fetchTMDB(`/${tmdbType}/${tmdbId}`);
                            data.poster_path = res.poster_path;
                            data.backdrop_path = res.backdrop_path;
                            data.runtime = res.runtime !== undefined ? res.runtime : (res.episode_run_time?.[0] || 0);
                            cacheData = { poster_path: res.poster_path, backdrop_path: res.backdrop_path, runtime: data.runtime };
                        }

                        // Save to local cache
                        localStorage.setItem(cacheKey, JSON.stringify(cacheData));

                        // Fire real-time callback the moment THIS single item is done
                        if (onProgress) onProgress(item.id || data.ids?.trakt, data, item);

                    } catch(e) { /* Silent fail */ }
                }));
                if (chunks.length > 1) await new Promise(r => setTimeout(r, 250)); // Respect TMDB rate limits
            }
        };

        window.navigateEpisode = async (showId, currentSeason, targetNumber) => {
            showLoader();
            try {
                let targetS = currentSeason;
                let targetE = targetNumber;
                let isTMDB = primaryDataSource === 'tmdb';
                let epObj = null;

                // Helper to check if an episode exists
                const checkEp = async (s, e) => {
                    if (isTMDB) return await fetchTMDB(`/tv/${showId}/season/${s}/episode/${e}`);
                    return await fetchDirect(`/shows/${showId}/seasons/${s}/episodes/${e}`);
                };

                if (targetNumber > 0) {
                    try {
                        epObj = await checkEp(currentSeason, targetNumber);
                    } catch (err) {
                        console.log("Next episode in season not found, checking next season...");
                        targetS = currentSeason + 1;
                        targetE = 1;
                        epObj = await checkEp(targetS, targetE);
                    }
                } else if (targetNumber <= 0 && currentSeason > 1) {
                    targetS = currentSeason - 1;
                    if (isTMDB) {
                        const prevSeasonData = await fetchTMDB(`/tv/${showId}/season/${targetS}`);
                        targetE = prevSeasonData.episodes.length;
                    } else {
                        const prevSeasonData = await fetchDirect(`/shows/${showId}/seasons/${targetS}?extended=full`);
                        targetE = prevSeasonData.episode_count;
                    }
                    epObj = await checkEp(targetS, targetE);
                } else {
                    hideLoader();
                    return showToast('No more episodes found', 'error');
                }
                
                // Route to the confirmed episode
                if (isTMDB) {
                    location.hash = `#detail/episode/${showId}-${targetS}-${targetE}`;
                } else if (epObj && epObj.ids) {
                    location.hash = `#detail/episode/${epObj.ids.trakt}`;
                }
            } catch (e) { 
                console.error("Navigation error:", e);
                showToast('Episode not found', 'error'); 
            }
            hideLoader();
        };

        function getImage(item, typeOverride = null, preferLandscape = false) {
            const type = typeOverride || item.type || item.media_type;
            let data = item.media || ((type && item[type]) ? item[type] : item);
            
            if (!data.poster_path && !data.backdrop_path && !data.still_path && item.movie) data = item.movie;
            if (!data.poster_path && !data.backdrop_path && !data.still_path && item.episode) data = item.episode;
            
            // If viewing in TMDB standalone mode and the imported item lacks ALL image markers, return placeholder
            if (primaryDataSource === 'tmdb' && !data.poster_path && !data.backdrop_path && !data.still_path && !data.profile_path && !data.images) {
                return PLACEHOLDER_IMG;
            }

            // Helper to dig out nested image paths if they are trapped in arrays or objects
            const extract = (val) => { 
                if (!val) return null; 
                if (Array.isArray(val)) return extract(val[0]); 
                if (typeof val === 'string') return val; 
                if (val.file_path) return val.file_path; // TMDB nested arrays use file_path
                return null; 
            };

            let url = null;
            
            // --- 1. TMDB IMAGE LOGIC ---
            if (primaryDataSource === 'tmdb' || data.poster_path || data.backdrop_path || data.still_path || data.profile_path || (data.images && data.images.backdrops)) {
                const tmdbBaseUrl = 'https://image.tmdb.org/t/p/';
                
                if (preferLandscape) {
                    // Hunt for all TMDB landscape variations first
                    if (data.backdrop_path) url = `${tmdbBaseUrl}w780${data.backdrop_path}`;
                    else if (data.still_path) url = `${tmdbBaseUrl}w780${data.still_path}`;
                    else if (data.images?.backdrops?.length > 0) url = `${tmdbBaseUrl}w780${data.images.backdrops[0].file_path}`;
                    else if (data.images?.stills?.length > 0) url = `${tmdbBaseUrl}w780${data.images.stills[0].file_path}`;
                }
                
                // If landscape failed OR we wanted portrait, hunt for TMDB portrait variations
                if (!url) {
                    if (type === 'person' && data.profile_path) url = `${tmdbBaseUrl}w500${data.profile_path}`;
                    else if (data.poster_path) url = `${tmdbBaseUrl}w500${data.poster_path}`;
                    else if (data.images?.posters?.length > 0) url = `${tmdbBaseUrl}w500${data.images.posters[0].file_path}`;
                    else if (data.images?.profiles?.length > 0) url = `${tmdbBaseUrl}w500${data.images.profiles[0].file_path}`;
                    
                    // Final TMDB safety net: If portrait failed but landscape exists, use it anyway to avoid a broken UI
                    else if (data.backdrop_path) url = `${tmdbBaseUrl}w780${data.backdrop_path}`;
                    else if (data.still_path) url = `${tmdbBaseUrl}w780${data.still_path}`;
                }
            } 
            
            // --- 2. TRAKT IMAGE LOGIC ---
            if (!url && data && data.images) {
                if (preferLandscape) {
                    // Hunt for all Trakt landscape variations
                    if (type === 'episode') url = extract(data.images.screenshot?.medium) || extract(data.images.screenshot?.full) || extract(data.images.screenshot);
                    else url = extract(data.images.fanart?.medium) || extract(data.images.fanart?.full) || extract(data.images.fanart);
                    if (!url) url = extract(data.images.thumb?.full) || extract(data.images.thumb);
                }
                
                // If landscape failed OR we wanted portrait, hunt for Trakt portrait variations
                if (!url) {
                    if (type === 'episode') url = extract(data.images.screenshot?.medium) || extract(data.images.screenshot?.full) || extract(data.images.screenshot);
                    else if (type === 'person') url = extract(data.images.headshot?.medium) || extract(data.images.headshot?.full) || extract(data.images.headshot);
                    else url = extract(data.images.poster?.medium) || extract(data.images.poster?.full) || extract(data.images.poster);
                }
                
                // Final Trakt safety net
                if (!url) url = extract(data.images.thumb);
                if (!url) url = extract(data.images.fanart);
            }
            
            // --- 3. EPISODE FALLBACK TO SHOW ---
            // If it is an episode and absolutely no image exists, steal the poster/backdrop from the parent show
            if (!url && type === 'episode' && item.show && item.show.images) {
                if (preferLandscape) url = extract(item.show.images.fanart?.medium) || extract(item.show.images.fanart?.full);
                if (!url) url = extract(item.show.images.poster?.medium) || extract(item.show.images.poster?.full);
            }

            if (!url) return PLACEHOLDER_IMG;
            if (!url.startsWith('http') && !url.startsWith('//')) return `https://${url}`;
            return url;
        }

        const createCardHtml = (item, typeOverride = null) => {
            // Determine type and normalize data structure
            let type = typeOverride || item.media_type || item.type; // TMDB uses media_type

            let targetId = (primaryDataSource === 'tmdb') ? data.ids?.tmdb : data.ids?.trakt;

            let clickHandler = targetId ? `location.hash='#detail/${type}/${targetId}'` : `window.routeToLocalItem('${type}', '${fallbackId}', '${idsStr}')`;
            
            if (targetId && type === 'episode' && primaryDataSource === 'tmdb') {
                const showTmdb = data.show?.ids?.tmdb || item.show?.ids?.tmdb;
                const sNum = data.season || data.season_number;
                const eNum = data.number || data.episode_number;
                if (showTmdb && sNum !== undefined) clickHandler = `location.hash='#detail/episode/${showTmdb}-${sNum}-${eNum}'`;
            }

            const img = getImage(data, type);
            const typeColor = getTypeColor(type);
            const imgId = `card-img-${type}-${fallbackId}`; // Generate a targeting ID
            
            // Normalize display title and year
            const displayTitle = data.title || data.name || 'Unknown Title';
            let displayYear = data.year;
            if (!displayYear) {
                const dateString = data.release_date || data.first_air_date;
                displayYear = dateString ? dateString.substring(0, 4) : 'N/A';
            }

            // Fallback rating logic for TMDB's vote_average
            const ratingVal = data.rating || data.vote_average || 0;
            const myRating = userRatings.get(parseInt(fallbackId)) || userRatings.get(parseInt(targetId));

                ? `<span class="text-green-400 font-bold flex items-center gap-1"><i class="fa-solid fa-user-check"></i> ${myRating}</span>`

                    </div>
                </div>
            </div>`;
        };

        // --- API & AUTH RECOVERY ---
        const traktHeader = () => ({ 'Content-Type': 'application/json', 'trakt-api-version': '2', 'trakt-api-key': TRAKT_CLIENT_ID, 'Authorization': `Bearer ${traktAccessToken}` });

        const handleAuthError = () => {
            if (isAuthErrorHandling) return;
            
            // Silently fail if the user has explicitly switched away from Trakt to avoid annoying popups
            if (primaryDataSource !== 'trakt') {
                console.warn("Trakt Auth failed, but user is using TMDB. Suppressing popup.");
                return;
            }

            isAuthErrorHandling = true;
            showToast('Trakt Session Expired! Redirecting...', 'error');
            setTimeout(() => {
                if(confirm("Your Trakt connection has expired. Click OK to re-connect.")) {
                    const state = encodeURIComponent(window.location.pathname);
                    // FIX: Reordering query parameters to prevent Trakt's Next.js router from dropping the query string during validation
                    const authUrl = `https://trakt.tv/oauth/authorize?client_id=${TRAKT_CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(TRAKT_REDIRECT_URI)}&state=${state}`;
                    window.location.href = authUrl;
                } else {
                    isAuthErrorHandling = false; 
                }
            }, 1000);
        };
        
        async function fetchDirect(endpoint) {
            const isUserSync = endpoint.includes('/sync') || endpoint.includes('/users') || endpoint.includes('/calendars') || endpoint.includes('/watching');
            
            // Bypasses Trakt requests smoothly when running in TMDB Standalone Mode
            const handleStandaloneBypass = () => {
                if (endpoint.includes('/stats')) return { movies: { watched: 0, minutes: 0 }, episodes: { watched: 0, minutes: 0 }, network: { friends: 0 } };
                if (endpoint.includes('limit=') || endpoint.includes('history') || endpoint.includes('watched') || endpoint.includes('playback') || endpoint.includes('ratings') || endpoint.includes('lists') || endpoint.includes('friends') || endpoint.includes('calendars')) return [];
                return {};
            };

            if (!traktAccessToken) { 
                if (primaryDataSource !== 'trakt') return handleStandaloneBypass();
                handleAuthError(); 
                if (isUserSync) throw new Error("No Token"); 
            }
            
            const headers = traktHeader();
            if (!traktAccessToken || !isUserSync) delete headers['Authorization'];
            
            const res = await fetch(`${TRAKT_API_URL}${endpoint}`, { headers });
            
            if (res.status === 401 || res.status === 403) {
                if (primaryDataSource !== 'trakt') return handleStandaloneBypass();
                handleAuthError();
                throw new Error(`API Error ${res.status}: Unauthorized/Forbidden`);
            }
            if (!res.ok) {
                if (primaryDataSource !== 'trakt' && isUserSync) return handleStandaloneBypass();
                throw new Error('API Error ' + res.status);
            }
            return await res.json();
        }

        async function fetchSmart(endpoint, renderFn, cacheKey = null) {
            const key = cacheKey || `trakt_cache_${endpoint}`;
            const cached = localStorage.getItem(key);
            if (cached) { try { renderFn(JSON.parse(cached), true); } catch(e){} } else showLoader();
            try {
                const freshData = await fetchDirect(endpoint); 
                if (JSON.stringify(freshData) !== cached) {
                    localStorage.setItem(key, JSON.stringify(freshData));
                    renderFn(freshData, false);
                }
            } catch (e) { 
                if(!cached && e.message !== 'API Error 401: Unauthorized') showToast("Connection error", 'error'); 
            } 
            finally { if(!cached) hideLoader(); }
        }

        // Smart caching wrapper: 
// 1. Loads from cache immediately (if available)
// 2. Fetches fresh data in background
// 3. Re-renders only if data changed
async function runSmart(cacheKey, fetcherFn, rendererFn) {
    const key = `vidtrackr_smart_${cacheKey}`;
    const statusEl = document.getElementById('sync-status');
    
    // Helper to update the badge
    const setStatus = (state) => {
        if (!statusEl) return;
        statusEl.classList.remove('hidden', 'text-gray-400', 'text-yellow-500', 'text-green-500', 'border-yellow-500', 'border-green-500');
        
        if (state === 'cache') {
            statusEl.innerHTML = '<i class="fa-solid fa-bolt"></i> Cached';
            statusEl.classList.add('text-gray-400', 'border-gray-700');
        } else if (state === 'loading') {
            statusEl.innerHTML = '<i class="fa-solid fa-arrows-rotate fa-spin"></i> Syncing';
            statusEl.classList.add('text-yellow-500', 'border-yellow-500/50');
        } else if (state === 'success') {
            statusEl.innerHTML = '<i class="fa-solid fa-check"></i> Updated';
            statusEl.classList.add('text-green-500', 'border-green-500/50');
            // Hide after 3 seconds
            setTimeout(() => {
                statusEl.classList.add('opacity-0');
                setTimeout(() => {
                    statusEl.classList.add('hidden');
                    statusEl.classList.remove('opacity-0');
                }, 500);
            }, 3000);
        }
    };

    // 1. Instant Load from Cache
    const cached = localStorage.getItem(key);
    if (cached) {
        try {
            setStatus('cache'); // Show "Cached" immediately
            const cachedData = JSON.parse(cached);
            rendererFn(cachedData, true);
        } catch(e) { console.warn("Cache parse error", e); }
    } else {
        showLoader();
    }

    // 2. Silent Background Fetch
    try {
        if(cached) setStatus('loading'); // Switch to "Syncing..."
        
        const freshData = await fetcherFn();
        
        // 3. Compare & Update
        if (!cached || JSON.stringify(freshData) !== cached) {
            localStorage.setItem(key, JSON.stringify(freshData));
            rendererFn(freshData, false);
            setStatus('success'); // Show "Updated" (Green)
        } else {
            // Data was identical, just show green "Updated" briefly to reassure user
            setStatus('success');
        }
    } catch (e) {
        console.error(`Background update failed for ${cacheKey}`, e);
        if(statusEl) {
            statusEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Offline';
            statusEl.classList.add('text-red-500', 'border-red-500/50');
        }
    } finally {
        if (!cached) hideLoader();
    }
}

        // --- Sync Ratings with Guard ---
        // Fetches ratings from Trakt if token is present, preserving local map
        async function syncUserRatings() {
            // First load any locally saved ratings (from imports/offline saves) so they persist
            if (currentUser) {
                try {
                    const localRatingsSnap = await getDocs(collection(db, `users/${currentUser.uid}/ratings`));
                    localRatingsSnap.forEach(doc => {
                        const d = doc.data();
                        userRatings.set(parseInt(doc.id), d.rating);
                        if (d.tmdbId) userRatings.set(parseInt(d.tmdbId), d.rating);
                    });
                } catch(e) { console.warn("Could not load local ratings", e); }
            }

            if (!traktAccessToken) return; // Skip Trakt request if token is missing
            try {
                const [movies, shows, episodes] = await Promise.all([ 
                    fetchDirect('/sync/ratings/movies?limit=1000'), 
                    fetchDirect('/sync/ratings/shows?limit=1000'), 
                    fetchDirect('/sync/ratings/episodes?limit=1000') 
                ]);
                // Merge Trakt ratings on top of local ratings
                movies.forEach(r => userRatings.set(r.movie.ids.trakt, r.rating));
                shows.forEach(r => userRatings.set(r.show.ids.trakt, r.rating));
                episodes.forEach(r => userRatings.set(r.episode.ids.trakt, r.rating));
            } catch(e) { console.warn("Could not sync ratings", e); }
        }

        // --- Sync Playback / Progress with Guard ---
        async function syncPlayback() {
            userPlayback.clear();
            
            // 1. Sync from Trakt
            if (traktAccessToken && primaryDataSource === 'trakt') {
                try {
                    const [movies, episodes] = await Promise.all([
                        fetchDirect('/sync/playback/movies?limit=50'),
                        fetchDirect('/sync/playback/episodes?limit=50')
                    ]);
                    movies.forEach(p => userPlayback.set(p.movie.ids.trakt, p));
                    episodes.forEach(p => userPlayback.set(p.episode.ids.trakt, p));
                } catch(e) { console.warn("Could not sync Trakt playback", e); }
            }
            
            // 2. Sync from Firebase (Local)
            if (currentUser) {
                try {
                    const snap = await getDocs(collection(db, `users/${currentUser.uid}/playback`));
                    snap.forEach(doc => {
                        // Firebase overrides Trakt if conflict to prioritize local edits
                        userPlayback.set(parseInt(doc.id), doc.data());
                    });
                } catch(e) { console.warn("Could not sync Firebase playback", e); }
            }
        }

            } catch(e) { showToast('Action failed', 'error'); }

async function loadUpNext() {
    await runSmart(
        'up_next_local_v4', // Cache Key
        
        // --- FETCHER: Builds Up Next from local Firebase history ---
        async () => {
            if (!currentUser) return [];

            try {
                // Fetch user history from Firebase
                const q = query(collection(db, `users/${currentUser.uid}/history`), orderBy("watchedAt", "desc"), limit(400));
                const snapshot = await getDocs(q);
                if (snapshot.empty) return [];

                const historyItems = [];
                snapshot.forEach(docSnap => historyItems.push(docSnap.data()));

                // 1. Group episodes by Show to find the latest watched position
                const showMap = new Map();

                historyItems.forEach(item => {
                    if (item.type !== 'episode') return;
                    
                    const media = item.media || item.episode;
                    if (!media) return;
                    
                    const showObj = media.show || item.show;
                    if (!showObj) return;

                    const tmdbId = showObj.ids?.tmdb || media.ids?.tmdb;
                    const identifier = tmdbId || showObj.title;

                    if (!identifier) return;

                    // Because the list is sorted by date descending, the first match is the most recently watched
                    if (!showMap.has(identifier)) {
                        showMap.set(identifier, {
                            showTmdbId: tmdbId,
                            showTitle: showObj.title,
                            showObj: showObj,
                            s: parseInt(media.season || media.season_number || 1),
                            e: parseInt(media.number || media.episode_number || 1),
                            watchedAt: item.watchedAt || item.loggedAt
                        });
                    }
                });

                // 2. Query TMDB to check if the show is completed, and if not, grab the next episode
                const activeShows = Array.from(showMap.values()).slice(0, 12);
                
                const nextEpisodesPromises = activeShows.map(async (entry) => {
                    try {
                        let tmdbId = entry.showTmdbId;
                        
                        // If no TMDB ID, fallback to searching TMDB by title
                        if (!tmdbId && entry.showTitle) {
                            const searchRes = await fetchTMDB(`/search/tv?query=${encodeURIComponent(entry.showTitle)}`);
                            if (searchRes.results && searchRes.results.length > 0) {
                                tmdbId = searchRes.results[0].id;
                                entry.showObj.ids = entry.showObj.ids || {};
                                entry.showObj.ids.tmdb = tmdbId;
                            }
                        }
                        if (!tmdbId) return null;

                        // Fetch show details to get season counts and episode limits
                        const showDetails = await fetchTMDB(`/tv/${tmdbId}`);
                        if (!showDetails || !showDetails.seasons) return null;

                        let nextS = entry.s;
                        let nextE = entry.e + 1;

                        // Check current season
                        const currentSeason = showDetails.seasons.find(x => x.season_number === nextS);
                        
                        if (currentSeason) {
                            // If the next episode exceeds the current season's episode count, bump to next season
                            if (nextE > currentSeason.episode_count) {
                                nextS += 1;
                                nextE = 1;
                            }
                        }

                        // Verify the target season exists and has episodes
                        const targetSeason = showDetails.seasons.find(x => x.season_number === nextS);
                        if (!targetSeason || targetSeason.episode_count === 0) {
                            // Show is completed / caught up!
                            return null; 
                        }

                        // Fetch the exact next episode data
                        const nextEpData = await fetchTMDB(`/tv/${tmdbId}/season/${nextS}/episode/${nextE}`);
                        if (!nextEpData || nextEpData.status_code === 34) return null; // 34 = Not Found

                        return {
                            type: 'episode',
                            isResume: false,
                            show: entry.showObj,
                            episode: {
                                ...nextEpData,
                                title: nextEpData.name,
                                season: nextS,
                                number: nextE,
                                // Map to a combined string ID so the router can load it correctly
                                ids: { trakt: `${tmdbId}-${nextS}-${nextE}`, tmdb: nextEpData.id }
                            },
                            ids: { trakt: `${tmdbId}-${nextS}-${nextE}`, tmdb: nextEpData.id },
                            title: nextEpData.name,
                            watched_at: entry.watchedAt
                        };
                    } catch(err) {
                        return null;
                    }
                });

                const results = await Promise.all(nextEpisodesPromises);
                const nextEpisodes = results.filter(i => i !== null);
                
                // Incorporate partial watch (resume) items if available
                const resumeItems = Array.from(userPlayback.values()).map(p => ({
                    ...p,
                    isResume: true,
                    playbackId: p.id,
                    type: p.type || (p.movie ? 'movie' : 'episode')
                })).sort((a, b) => new Date(b.paused_at) - new Date(a.paused_at));

                const finalItems = [...resumeItems, ...nextEpisodes].slice(0, 18);
                
                await window.enrichTMDBImages(finalItems);
                return finalItems;
            } catch(e) {
                console.error("Local Up Next calculation error:", e);
                return [];
            }
        },

        // --- RENDERER: Updates the DOM ---
        (items) => {
            const container = document.getElementById('up-next-container');
            if (!container) return;

            const hiddenItems = JSON.parse(localStorage.getItem('vidtrackr_hidden_upnext') || '[]');
            items = items.filter(item => {
                const isMovie = item.type === 'movie';
                const data = isMovie ? (item.movie || item) : (item.episode || item.episode);
                if (!data) return true;

                // Extract all possible IDs safely
                const itemIdTrakt = data.ids?.trakt;
                const itemIdTmdb = data.ids?.tmdb || data.id;
                const showIdTrakt = !isMovie && item.show?.ids ? item.show.ids.trakt : null;
                const showIdTmdb = !isMovie && item.show?.ids ? item.show.ids.tmdb : (!isMovie ? item.show?.id : null);

                // Sweep against the hidden list to determine if it should be displayed
            return !hiddenItems.some(h => {
                const hiddenIdStr = String(h.id);
                
                // 1. Match specific Movie or Episode
                if (h.type === item.type) {
                    if (hiddenIdStr === String(itemIdTrakt) || hiddenIdStr === String(itemIdTmdb)) return true;
                    // Properly match composite TMDB episode IDs (e.g. showId-season-episode)
                    if (item.type === 'episode') {
                        const sNum = data.season || data.season_number;
                        const eNum = data.number || data.episode_number;
                        if (hiddenIdStr === `${showIdTmdb}-${sNum}-${eNum}`) return true;
                    }
                }
                // 2. Match Parent Show (If the show is hidden, hide its Up Next episodes)
                if (h.type === 'show' && !isMovie) {
                    if (hiddenIdStr === String(showIdTrakt) || hiddenIdStr === String(showIdTmdb)) return true;
                }
                
                return false;
            });
            });

            if (items.length === 0) {
                container.classList.add('hidden');
                return;
            }

            const createCard = (item) => {
                if (!item || (!item.movie && !item.episode && !item.show)) return ''; 

                const isMovie = item.type === 'movie';
                const data = isMovie ? (item.movie || item) : (item.episode || item.episode);
                
                if (!data || !data.ids || !data.ids.trakt) return '';

                const showTitle = !isMovie ? item.show.title : null;
                const title = isMovie ? (item.movie?.title || item.title) : data.title;
                const sub = isMovie ? (item.movie?.year || item.year) : `S${data.season} E${data.number}`;
                const img = getImage(item, null, true);
                const progress = item.progress || 0;
                let typeBadge = '';
                if (!isMovie && data.episode_type && data.episode_type !== 'standard') {
                    const formatType = data.episode_type.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                    let typeColor = 'bg-purple-900/50 text-purple-300 border-purple-800';
                    if (data.episode_type.includes('finale')) typeColor = 'bg-red-900/50 text-red-300 border-red-800';
                    if (data.episode_type.includes('premiere')) typeColor = 'bg-blue-900/50 text-blue-300 border-blue-800';
                    typeBadge = `<span class="text-[9px] ${typeColor} border px-1 py-0.5 rounded uppercase font-bold tracking-wide shadow-sm ml-2 align-middle inline-block">${formatType}</span>`;
                }
                
                const jsonStr = JSON.stringify({
                    ids: data.ids, 
                    title: isMovie ? title : `${showTitle}: ${title}`, 
                    name: data.title || data.name,
                    type: item.type, 
                    runtime: data.runtime,
                    season: data.season || data.season_number,
                    number: data.number || data.episode_number,
                    still_path: data.still_path,
                    backdrop_path: data.backdrop_path,

                }).replace(/'/g, "&apos;");

                let actionBtns = '';
                
                if (item.isResume) {
                    actionBtns = `
                    <div class="flex gap-2 w-full h-10">
                        <button onclick="event.stopPropagation(); window.rateDirect(${data.ids.trakt}, '${item.type}', 10)" class="h-full bg-gray-700 hover:bg-green-600 text-white text-xs px-3 rounded-lg transition font-bold shadow flex items-center justify-center" title="Mark Fully Watched"><i class="fa-solid fa-check"></i></button>
                        <button onclick='event.stopPropagation(); window.openScrobbleModal(${jsonStr})' class="flex-grow h-full bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white text-xs font-bold rounded-lg border border-blue-600/30 transition flex items-center justify-center gap-2"><i class="fa-solid fa-sliders"></i> Update</button>

                    </div>`;

                    const hideId = !isMovie ? (item.show?.ids?.tmdb || item.show?.ids?.trakt || item.show?.id || data.ids.trakt) : data.ids.trakt;
                    const hideType = !isMovie ? 'show' : 'movie';
                    const hideTitle = !isMovie ? showTitle : title;

                    actionBtns = `
                    <div class="flex gap-2 w-full relative z-20 h-10">
                         <button onclick='event.stopPropagation(); window.openScrobbleModal(${jsonStr})' class="flex-grow h-10 bg-[var(--primary)] hover:bg-red-700 text-white text-xs font-bold rounded-lg transition shadow-md flex items-center justify-center"><i class="fa-solid fa-play mr-1"></i> Log Watch</button>
                         <button onclick="event.stopPropagation(); window.openQuickRate(${data.ids.trakt}, '${item.type}', '${(isMovie ? title : `${showTitle}: ${title}`).replace(/'/g, "\\'")}')" class="h-10 w-12 bg-gray-700 hover:bg-yellow-500 hover:text-black text-white rounded-lg font-bold transition shadow-md flex items-center justify-center border border-gray-600"><i class="fa-solid fa-star"></i></button>
                         <button onclick="event.stopPropagation(); window.hideUpNext('${hideId}', '${hideType}', '${hideTitle.replace(/'/g, "\\'").replace(/"/g, '&quot;')}')" class="h-10 w-12 bg-gray-800 hover:bg-gray-600 text-gray-400 hover:text-white rounded-lg font-bold transition shadow-md flex items-center justify-center border border-gray-700" title="Hide ${!isMovie ? 'Show' : 'Movie'} from Up Next"><i class="fa-solid fa-eye-slash"></i></button>

                }

                return `
                <div class="card p-0 rounded-xl flex flex-row overflow-hidden border ${item.isResume ? 'border-blue-500/50 shadow-[0_0_10px_rgba(59,130,246,0.15)]' : 'border-gray-800'} hover:border-[var(--primary)] transition cursor-pointer shadow-lg group relative animate-fade" onclick="location.hash='#detail/${item.type}/${data.ids.trakt}'">
                    
                    <div class="w-[40%] sm:w-1/3 aspect-video relative bg-gray-900 flex-shrink-0">
                        <img src="${img}" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition" onerror="this.src='${PLACEHOLDER_IMG}'">
                        ${item.isResume ? `<div class="absolute bottom-0 left-0 right-0 h-1 bg-gray-700"><div class="bg-blue-500 h-full shadow-[0_0_5px_#3b82f6]" style="width: ${progress}%"></div></div>` : ''}

async function loadFriendsFeed() {
    const container = document.getElementById('friends-feed-container');
    if (!container) return;

    try {
        // Step 1: Get your list of friends (Limit to 6 to prevent hitting API limits)
        const friends = await fetchDirect('/users/me/friends?limit=6');
        
        if (!friends || friends.length === 0) {
            // Optional: Hide container if no friends
            return; 
        }

        // Step 2: Fetch the last 1 history item for each friend in parallel
        const feedPromises = friends.map(async (friendObj) => {
            try {
                const slug = friendObj.user.ids.slug || friendObj.user.username;
                const history = await fetchDirect(`/users/${slug}/history?limit=1&extended=images`);
                if (history && history.length > 0) {
                    // Attach the user info to the history item so we can display their avatar
                    return { ...history[0], user: friendObj.user };
                }
                return null;
            } catch (e) { 
                return null; // Ignore errors for single friends (e.g. private profiles)
            }
        });

        const results = await Promise.all(feedPromises);
        
        // Step 3: Filter out nulls and sort by "watched_at" date (newest first)
        const feed = results.filter(item => item !== null)
                            .sort((a, b) => new Date(b.watched_at) - new Date(a.watched_at));

        // Hydrate friend data with live images
        await window.enrichTMDBImages(feed);

        // Step 4: Render the feed
        if (feed.length > 0) {
            const html = `
                <h2 class="text-2xl font-bold mb-6 px-2 border-l-4 border-purple-500">Friends Recently Watched</h2>
                <div class="flex gap-4 overflow-x-auto pb-4 hide-scroll">
                    ${feed.map(item => {
                        const user = item.user;
                        const mediaType = item.type; // 'movie' or 'episode'
                        const media = item[mediaType];
                        const show = item.show; // exists if episode
                        
                        const title = mediaType === 'movie' ? media.title : show.title;
                        const sub = mediaType === 'movie' ? media.year : `S${media.season}E${media.number}`;
                        const img = getImage(media, mediaType);
                        const userImg = user.images?.avatar?.full || 'https://placehold.co/100x100/333/FFF?text=User';
                        
                        return `
                        <div class="flex-shrink-0 w-64 card p-3 rounded-xl border border-gray-800 hover:border-purple-500 transition cursor-pointer relative group" onclick="location.hash='#detail/${mediaType}/${media.ids.trakt}'">
                            <div class="flex items-center gap-3 mb-3 border-b border-gray-800 pb-2">
                                <img src="${userImg}" class="w-8 h-8 rounded-full border border-gray-600">
                                <div class="min-w-0">
                                    <p class="text-xs font-bold text-gray-300 truncate">${user.name || user.username}</p>
                                    <p class="text-[10px] text-gray-500">${new Date(item.watched_at).toLocaleDateString()}</p>
                                </div>
                            </div>
                            <div class="flex gap-3">
                                <img src="${img}" class="w-12 h-16 object-cover rounded shadow bg-gray-900" onerror="this.src='${PLACEHOLDER_IMG}'">
                                <div class="min-w-0 flex-1">
                                    <p class="font-bold text-sm leading-tight line-clamp-2 text-purple-100 mb-1">${title}</p>
                                    <p class="text-xs text-gray-500">${sub}</p>
                                </div>
                            </div>
                        </div>`;
                    }).join('')}
                </div>`;
            container.innerHTML = html;
            container.classList.remove('hidden');
        }
    } catch (e) { 
        console.warn("Friends feed error", e); 
    }
}

        async function renderDetail(type, id, initialSeason = null, forceAllHistory = false) {
            if (type === 'tv') type = 'show'; // Intercept any cached 'tv' routes and force them to 'show'
            window.renderDetail = renderDetail; // Expose globally for inline onclick
            const historyLimit = forceAllHistory ? 10000 : 100;
            showLoader(); els.content.innerHTML = '';
            try {
                const isEpisode = type === 'episode';
                let canonicalId = id; // Will be resolved to TMDB or Trakt ID dynamically to fix note linking
                let noteKey = `${type}_${id}`;
                let localWlKey = `${type}_${id}`;
                
                // Initialize variables
                let item, notes, history = [], related = [], showInfo = null, people = null, comments = null, collectionList = [], showProgress = null;
                let localWlSnap = null, localColSnap = null, showPeople = null;

                const fetchCommentsSafe = (url) => {
                    if (primaryDataSource === 'tmdb') return Promise.resolve([]); // TMDB doesn't have Trakt-style comments
                    return fetchDirect(url).catch(err => { console.warn("Comments unavailable", err); return []; });
                };

                const localHistoryFetch = async () => {
                    if (!currentUser) return [];
                    const q = query(collection(db, `users/${currentUser.uid}/history`));
                    const snap = await getDocs(q);
                    const items = [];
                    
                    const matchTraktId = String(item?.ids?.trakt || id || '');
                    const matchTmdbId = String(item?.ids?.tmdb || item?.id || (typeof tmdbId !== 'undefined' ? tmdbId : '') || '');
                    
                    const targetSeason = String(item?.season || item?.season_number || (typeof epSeason !== 'undefined' ? epSeason : 1));
                    const targetEpNum = String(item?.number || item?.episode_number || (typeof epNum !== 'undefined' ? epNum : 1));
                    const currentShowTitle = String(showInfo?.title || showInfo?.name || '').toLowerCase().trim();
                    const currentShowTmdbId = String(showInfo?.ids?.tmdb || (typeof resolvedShowId !== 'undefined' ? resolvedShowId : ''));

                    snap.forEach(d => {
                        const data = d.data();
                        if (data.type !== type) return;

                        const media = data.media || {};
                        const histTrakt = String(media.ids?.trakt || '');
                        const histTmdb = String(media.ids?.tmdb || media.id || '');
                        const histItemId = String(data.itemId || '');
                        
                        const isIdMatch = (histTrakt && (histTrakt === matchTraktId || histTrakt === matchTmdbId)) ||
                                          (histTmdb && (histTmdb === matchTmdbId || histTmdb === matchTraktId)) ||
                                          (histItemId && (histItemId === matchTraktId || histItemId === matchTmdbId || histItemId === String(id)));

                        if (type === 'episode') {
                            const hSeason = String(media.season || media.season_number || '');
                            const hEp = String(media.number || media.episode_number || '');
                            const hShowTitle = String(media.show?.title || media.show?.name || '').toLowerCase().trim();
                            const hShowTmdbId = String(media.show?.ids?.tmdb || '');
                            
                            const isShowMatch = (hShowTitle && currentShowTitle && hShowTitle === currentShowTitle) || 
                                                (hShowTmdbId && currentShowTmdbId && hShowTmdbId === currentShowTmdbId) ||
                                                (media.show?.ids?.trakt && String(media.show.ids.trakt) === String(showInfo?.ids?.trakt));

                            if (isIdMatch || (isShowMatch && hSeason === targetSeason && hEp === targetEpNum)) {
                                items.push({ id: d.id, watched_at: data.watchedAt || data.loggedAt, rated_at: data.ratedAt, episode: media, rating: data.rating, _originalItemId: histItemId || histTrakt || histTmdb });
                            }
                        } else {
                            if (isIdMatch) {
                                items.push({ id: d.id, watched_at: data.watchedAt || data.loggedAt, rated_at: data.ratedAt, [type]: media, rating: data.rating, _originalItemId: histItemId || histTrakt || histTmdb });
                            }
                        }
                    });
                    return items.sort((a, b) => new Date(b.watched_at) - new Date(a.watched_at));
                };

                // --- FETCH DATA ---
                
                // FIX: Support TMDB fetching by automatically resolving Trakt IDs imported from history
                if (primaryDataSource === 'tmdb') {
                    // TMDB API Fetch Logic
                    let tmdbEndpoint = '';
                    let tmdbType = type === 'show' ? 'tv' : type;
                    let tmdbId = id;
                    let resolvedShowId = id;
                    let epSeason = 1;
                    let epNum = 1;

                    // If we receive a raw Trakt ID for an episode from the history log, translate it to a TMDB ID first
                    if (type === 'episode' && !id.includes('-')) {
                        const searchRes = await fetch(`${TRAKT_API_URL}/search/trakt/${id}?type=episode`, { headers: { 'Content-Type': 'application/json', 'trakt-api-version': '2', 'trakt-api-key': TRAKT_CLIENT_ID } });

                } else {
                    // Legacy Trakt API Fetch Logic
                    if (isEpisode) {

                            traktHist.forEach(th => {

                const safeJson = encodeURIComponent(JSON.stringify(item)).replace(/'/g, "%27");

                const checkInJsonStr = JSON.stringify(isEpisode ? {

                if (title === 'Watching...' && activeData.id) {
                    try {
                        if (activeData.type === 'episode') {

                            if (String(activeData.id).includes('-')) {
                                const parts = String(activeData.id).split('-');
                                const showRes = await fetchTMDB(`/tv/${parts[0]}`).catch(() => null);

                banner.classList.remove('hidden');

                // Clear any existing live timer loop
                if (window.liveCheckinInterval) clearInterval(window.liveCheckinInterval);

                if (expiresAt) {
                    const endTime = new Date(expiresAt).getTime();
                    // Fallback to exactly 120 minutes ago if the start time is completely missing from API
                    const startTime = startedAt ? new Date(startedAt).getTime() : (endTime - (120 * 60000)); 
                    const totalDur = endTime - startTime;

                    // Execute a 1-second live loop 
                    const updateLiveTimer = () => {
                        const now = Date.now();
                        const remaining = endTime - now;
                        const elapsed = now - startTime;

                        if (remaining <= 0) {
                            clearInterval(window.liveCheckinInterval);
                            return;

                        // Calculate width percentage safely between 0-100%
                        const pct = Math.min(100, Math.max(0, (elapsed / totalDur) * 100));
                        
                        // Calculate formatted countdown string (e.g., "-43:05")
                        const mins = Math.floor(remaining / 60000);
                        const secs = Math.floor((remaining % 60000) / 1000);

                        if (barEl) barEl.style.width = `${pct}%`;

                    const timeRemaining = endTime - Date.now();

                            : `<span id="hist-runtime-${item.id}"></span>`;

                        let headerHtml = '';
                        if (dateStr !== lastDate) {
                            if (page === 1 || lastDate !== null) {
                                const totalMins = dailyTotals[dateStr] || 0;

                    container.innerHTML = listHtml; // Use innerHTML to redraw the full paginated list properly instead of appending duplicates
                    
                    if (fetchedCount >= page * 100) {
                        loadMoreContainer.innerHTML = `<button id="btn-load-more" class="bg-gray-800 hover:bg-gray-700 text-white px-8 py-3 rounded-full font-bold transition shadow-lg border border-gray-600 hover:border-white">Load More</button>`;

                        loadMoreContainer.innerHTML = `<p class="text-gray-600 text-sm italic opacity-50">End of history.</p>`;
                    }
                    
                    isFetchingHistory = false; hideLoader();

                    // --- NEW: Non-Blocking Background Hydration (1-by-1) ---
                    // Silently fetches missing TMDB images and updates the UI instantly per-item
                    window.enrichTMDBImages(data, (itemId, enrichedData, rawItem) => {
                        const displayImageObj = rawItem.type === 'episode' ? rawItem.episode : rawItem.movie;
                        const newImg = getImage(displayImageObj, rawItem.type, true);
                        const imgEl = document.getElementById(`hist-img-${itemId}`);
                        
                        // Update movie/episode image smoothly if hydrated from TMDB
                        if (imgEl && newImg && newImg !== PLACEHOLDER_IMG && !imgEl.src.includes(newImg)) {
                            imgEl.style.opacity = 0; // Quick fade out
                            setTimeout(() => {
                                imgEl.src = newImg;
                                imgEl.style.opacity = ''; // Restore default classes (fade in)
                            }, 150);
                        }

                        // Update missing movie runtime length badge once TMDB fetches metadata
                        const runtimeEl = document.getElementById(`hist-runtime-${itemId}`);
                        if (runtimeEl && displayImageObj && displayImageObj.runtime) {
                            const mins = parseInt(displayImageObj.runtime) || 0;

                            // Dynamically recalculate and update the daily total header
                            const dStr = new Date(rawItem.watched_at).toLocaleDateString();
                            const dateId = dStr.replace(/[^a-zA-Z0-9]/g, '-');

                                        const rt = i.type === 'episode' ? (i.episode.runtime || 0) : (i.movie.runtime || 0);
                                        totalMins += parseInt(rt) || 0;
                                    }
                                });

                                    const tHrs = Math.floor(totalMins / 60);
                                    const tMins = totalMins % 60;

                                }

                            <i class="fa-solid fa-heart"></i> Import Favorites

                        <button id="wipe-history-btn" class="bg-red-900/30 hover:bg-red-600 text-red-400 hover:text-white px-4 py-2.5 rounded-lg font-bold shadow-lg transition border border-red-900/50 hover:border-red-600 text-xs"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Wipe History DB</button>
                    </div>
                </div>
                <div class="card p-8 rounded-2xl max-w-2xl border border-gray-800">
                    <h2 class="text-xl font-bold mb-4 flex items-center"><i class="fa-solid fa-database mr-3 text-blue-500"></i> Storage</h2>
                    <p class="text-gray-400 mb-6">If images look broken or data is stale, try clearing the local cache.</p>
                    <button id="clear-cache-btn" class="bg-gray-700 hover:bg-gray-600 text-white px-6 py-3 rounded-lg font-bold shadow-lg transition">Clear Local Cache</button>
                </div>
                <div class="card p-8 rounded-2xl max-w-2xl border border-gray-800">
                    <h2 class="text-xl font-bold mb-4 flex items-center"><i class="fa-solid fa-eye-slash mr-3 text-purple-500"></i> Hidden Items</h2>
                    <p class="text-gray-400 mb-6">Manage the list of shows and movies you have hidden from your 'Up Next' queue.</p>
                    <div id="hidden-items-list" class="mb-6 max-h-60 overflow-y-auto hide-scroll space-y-2 border border-gray-800 rounded-xl bg-gray-900/50 p-2"></div>
                    <button id="clear-hidden-btn" class="w-full bg-gray-700 hover:bg-gray-600 text-white px-6 py-3 rounded-lg font-bold shadow-lg transition">Reset All Hidden Items</button>
                </div>
            </div>`; 

            setTimeout(() => { 
                const exportBtn = document.getElementById('export-btn'); 
                const clearBtn = document.getElementById('clear-cache-btn'); 
                const clearHiddenBtn = document.getElementById('clear-hidden-btn'); 
                const tmdbBtn = document.getElementById('source-tmdb-btn');
                const traktBtn = document.getElementById('source-trakt-btn');
                const wipeBtn = document.getElementById('wipe-history-btn');

                if (wipeBtn) wipeBtn.onclick = async () => {
                    if (!confirm("WARNING: This will permanently delete ALL imported and logged history in your VidTrackr database. Are you absolutely sure?")) return;
                    showLoader();
                    try {
                        const snap = await getDocs(collection(db, `users/${currentUser.uid}/history`));
                        const deletePromises = [];
                        snap.forEach(d => deletePromises.push(deleteDoc(doc(db, `users/${currentUser.uid}/history`, d.id))));

                if(tmdbBtn) tmdbBtn.onclick = () => {

                if(exportBtn) exportBtn.onclick = async () => {

                    try {
                        const q = query(collection(db, `users/${currentUser.uid}/history`), orderBy("watchedAt", "desc"), limit(10000));
                        const snapshot = await getDocs(q);
                        const data = [];
                        snapshot.forEach(d => data.push(d.data()));
                        
                        if(!data.length) return showToast('No history', 'error'); 
                        const csv = "Title,Type,WatchedAt\n" + data.map(i => `${(i.type==='episode'?`${i.media.show?.title || 'Show'}: ${i.media.title}`:i.media.title).replace(/,/g,'')},${i.type},${i.watchedAt}`).join("\n"); 
                        const link = document.createElement("a"); 
                        link.href = encodeURI("data:text/csv;charset=utf-8,"+csv); 
                        link.download = "history.csv"; 
                        document.body.appendChild(link); 
                        link.click(); 
                        link.remove(); 
                        showToast('Exported'); 
                    } catch(e) { 
                        showToast('Export failed', 'error'); 
                    } 
                    hideLoader(); 
                }; 

                // --- UNIVERSAL TRAKT JSON EXPORT IMPORTER ---
                const setupImporter = (elementId, importCategory = null) => {
                    const inputEl = document.getElementById(elementId);
                    if (!inputEl) return;

                    inputEl.onchange = async (e) => {
                        const file = e.target.files[0];
                        if (!file) return;

                        showLoader();
                        const fileName = file.name;
                        const reader = new FileReader();
                        reader.onload = async (event) => {
                            try {
                                const json = JSON.parse(event.target.result);
                                if (!Array.isArray(json)) throw new Error("Invalid format. Expected JSON array.");

                                // Auto-detect import category from filename or contents if not specified
                                let category = importCategory;
                                if (!category) {
                                    if (fileName.includes('rating')) category = 'ratings';
                                    else if (fileName.includes('collection')) category = 'collections';
                                    else if (fileName.includes('list')) category = 'lists';
                                    else if (fileName.includes('hidden')) category = 'hidden';
                                    else if (fileName.includes('note')) category = 'notes';
                                    else if (fileName.includes('favorite')) category = 'favorites';
                                    else category = 'history';
                                }

                                // Clean and derive list name from custom list exports (e.g. lists-list-25570272-partially-watched.json -> Partially Watched)
                                let listName = '';
                                if (category === 'lists') {
                                    const cleanName = fileName.replace(/\.json$/i, '').replace(/^lists-list-\d+-/i, '').replace(/^lists-/i, '').replace(/[-_]/g, ' ');
                                    listName = cleanName.charAt(0).toUpperCase() + cleanName.slice(1);
                                }

                                const validItems = [];
                                for (const item of json) {
                                    // Account for Trakt's nested "attached_to" structure used in Notes exports
                                    const target = item.attached_to ? item.attached_to : item;
                                    let type = item.type || target.type;

                                    if (!type) {
                                        if (target.episode) type = 'episode';
                                        else if (target.season) type = 'season';
                                        else if (target.show) type = 'show';
                                        else if (target.movie) type = 'movie';
                                        else continue;
                                    }

                                    let mediaData = null;
                                    let displayTitle = '';

                                    if (type === 'episode') {
                                        mediaData = target.episode || {};
                                        if (target.show) mediaData.show = target.show;
                                        displayTitle = `${target.show?.title || 'Show'}: S${mediaData.season || mediaData.season_number || '?'}E${mediaData.number || mediaData.episode_number || '?'} ${mediaData.title || mediaData.name || ''}`;
                                    } else if (type === 'season') {
                                        mediaData = target.season || {};
                                        if (target.show) mediaData.show = target.show;
                                        displayTitle = `${target.show?.title || 'Show'}: Season ${mediaData.number || mediaData.season_number || '?'}`;
                                    } else if (type === 'show') {
                                        mediaData = target.show || {};
                                        displayTitle = mediaData.title || mediaData.name || 'Unknown Show';
                                    } else if (type === 'movie') {
                                        mediaData = target.movie || target; // fallback if flat
                                        displayTitle = mediaData.title || mediaData.name || 'Unknown Movie';
                                    }

                                    if (!mediaData || (!mediaData.ids && !mediaData.id)) continue;

                                    // Extract the correct date
                                    const dateVal = item.watched_at || item.collected_at || item.listed_at || item.hidden_at || item.rated_at || item.updated_at || item.created_at || item.note?.created_at || new Date().toISOString();
                                    
                                    // Extract the note text natively
                                    let noteText = '';
                                    if (typeof item.notes === 'string') noteText = item.notes;
                                    else if (item.note && typeof item.note === 'string') noteText = item.note;
                                    else if (item.note?.notes) noteText = item.note.notes;
                                    else if (item.text) noteText = item.text;

                                    validItems.push({
                                        mediaData,
                                        type,
                                        displayTitle: displayTitle.trim(),
                                        dateVal,
                                        rating: item.rating,
                                        rank: item.rank || 0,
                                        noteText
                                    });
                                }

                                hideLoader();
                                if (validItems.length === 0) {
                                    showToast('No valid items found in file.', 'error');
                                    return;
                                }

                                // Inject or reuse preview modal
                                let previewModal = document.getElementById('import-preview-modal');
                                if (!previewModal) {
                                    document.body.insertAdjacentHTML('beforeend', `

                                                    <button id="import-confirm-btn" class="bg-[var(--primary)] hover:bg-red-700 text-white py-3 rounded-lg font-bold shadow-[0_0_15px_rgba(237,34,36,0.3)] transition flex items-center justify-center gap-2">Confirm Import</button>
                                                </div>
                                            </div>
                                        </div>
                                    `);
                                    previewModal = document.getElementById('import-preview-modal');
                                }

                                // Custom List Name Input UI
                                const headerArea = document.getElementById('import-header-area');
                                if (category === 'lists') {
                                    headerArea.innerHTML = `

                                            <input type="text" id="import-list-name-input" value="${listName}" class="w-full p-3 rounded-lg bg-gray-800 border border-gray-700 text-white font-bold text-lg outline-none focus:border-[var(--primary)] transition">
                                        </div>
                                    `;
                                } else {
                                    headerArea.innerHTML = `<h3 class="text-2xl font-bold mb-1 text-white">Import Preview: ${category.toUpperCase()}</h3>`;
                                }

                                // Update Table Headers dynamically according to import category
                                const theadTr = document.getElementById('import-thead-row');
                                if (category === 'ratings') {
                                    theadTr.innerHTML = `<th class="p-3 font-bold">Title</th><th class="p-3 font-bold">Type</th><th class="p-3 font-bold text-center">Rating</th><th class="p-3 font-bold hidden md:table-cell">Rated At</th>`;
                                } else if (category === 'lists') {
                                    theadTr.innerHTML = `<th class="p-3 font-bold">Title</th><th class="p-3 font-bold">Type</th><th class="p-3 font-bold text-center">Rank</th><th class="p-3 font-bold hidden md:table-cell">Listed At</th>`;
                                } else if (category === 'notes') {
                                    theadTr.innerHTML = `<th class="p-3 font-bold">Title</th><th class="p-3 font-bold">Type</th><th class="p-3 font-bold">Note Excerpt</th>`;
