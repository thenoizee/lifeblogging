<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IconGenerator - Dynamic Icon Generator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'128'%20height%3D'128'%20viewBox%3D'0%200%20128%20128'%3E%3Cdefs%3E%3C%2Fdefs%3E%3Crect%20width%3D'128'%20height%3D'128'%20rx%3D'25.6'%20fill%3D'%234f46e5'%20fill-opacity%3D'0'%20%2F%3E%3Cg%20transform%3D'translate(0%2C%200)%20rotate(0%2C%2064%2C%2064)'%3E%3Csvg%20x%3D'16'%20y%3D'16'%20width%3D'96'%20height%3D'96'%20viewBox%3D'0%200%20448%20512'%3E%3Cpath%20fill%3D'%23c49aca'%20fill-opacity%3D'1'%20d%3D'M50.7%2058.5L0%20160H208V32H93.7C75.5%2032%2058.9%2042.3%2050.7%2058.5zM240%20160H448L397.3%2058.5C389.1%2042.3%20372.5%2032%20354.3%2032H240V160zm208%2032H0V416c0%2035.3%2028.7%2064%2064%2064H384c35.3%200%2064-28.7%2064-64V192z'%20%2F%3E%3C%2Fsvg%3E%3C%2Fg%3E%3C%2Fsvg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" data-auto-replace-svg="false"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-main: #1a202c;
            --input-bg: #edf2f7;
            --border-color: #e2e8f0;
        }
        .dark {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --input-bg: #334155;
            --border-color: #475569;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text-main); transition: all 0.3s; }
        .control-group { margin-bottom: 1.25rem; }
        .control-label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; }
        input[type="color"] { -webkit-appearance: none; border: none; width: 32px; height: 32px; padding: 0; overflow: hidden; border-radius: 50%; cursor: pointer; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; }
        
        .preview-area {
            background-color: #e5e5f7;
            background-image:  repeating-linear-gradient(45deg, #d4d4ea 25%, transparent 25%, transparent 75%, #d4d4ea 75%, #d4d4ea), repeating-linear-gradient(45deg, #d4d4ea 25%, #e5e5f7 25%, #e5e5f7 75%, #d4d4ea 75%, #d4d4ea);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="min-h-screen pb-20">

    <div class="container mx-auto px-4 max-w-6xl mt-6">
        <!-- Wrapper for Studio View - Renamed to tab-studio for automatic sharednav hooking -->
        <div id="tab-studio" class="block">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-4 space-y-4">
                
                <div class="bg-[var(--card-bg)] p-4 rounded-xl shadow-sm border border-[var(--border-color)]">
                     <button id="btn-toggle-import" class="w-full text-left font-bold text-sm flex justify-between items-center text-blue-600 hover:text-blue-700">
                         <span><i class="fa-solid fa-file-import mr-2"></i>Import / Reverse Search</span>
                         <i class="fa-solid fa-chevron-down"></i>
                     </button>
                     <div id="import-panel" class="hidden mt-3">
                        <textarea id="import-input" class="w-full text-xs font-mono p-2 bg-[var(--input-bg)] rounded border border-[var(--border-color)] h-24 mb-2" placeholder="Paste HTML, CSS, or <link rel='icon'> tag here..."></textarea>
                        <button id="btn-process-import" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2 rounded">
                            Parse & Apply
                        </button>
                     </div>
                </div>

                <!-- CARD 1: CONTENT -->
                <div class="bg-[var(--card-bg)] p-5 rounded-2xl shadow-sm border border-[var(--border-color)]">
                    <!-- DEBUG: Adding modular card headers to break up the settings -->
                    <h2 class="text-xs font-bold mb-4 text-gray-500 dark:text-gray-400 uppercase tracking-wider flex items-center"><i class="fa-solid fa-layer-group mr-2"></i>Content & Theme</h2>
                    
                    <div class="control-group">
                        <label class="control-label text-xs">Quick Presets</label>
                        <select id="preset-select" class="w-full bg-[var(--input-bg)] rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none text-[var(--text-main)] border border-[var(--border-color)]">
                            <option value="">Select a theme...</option>
                            <option value="dashboard">Dashboard (Slate)</option>
                            <option value="logger">Logger (Green)</option>
                            <option value="analyser">Analyser (Indigo)</option>
                            <option value="medicine">MediManagr (Pink)</option>
                            <option value="vidtrackr">VidTrackr (Red)</option>
                            <option value="podtrackr">PodTrackr (Purple)</option>
                            <option value="tasktrackr">TaskTrackr (Blue)</option>
                            <option value="foodtrackr">FoodTrackr (Orange)</option>
                        </select>
                    </div>

                    <div class="control-group mb-0">
                        <div class="flex justify-between items-center mb-2">
                            <label class="control-label mb-0 text-xs">Source Type</label>
                            <div class="flex bg-[var(--input-bg)] rounded-lg p-1 border border-[var(--border-color)]">
                                <button id="mode-icon-btn" class="px-3 py-1 text-xs font-bold rounded-md bg-white dark:bg-gray-600 shadow-sm transition-all">Icon</button>
                                <button id="mode-text-btn" class="px-3 py-1 text-xs font-bold rounded-md text-gray-500 hover:text-gray-700 dark:text-gray-400 transition-all">Text</button>
                            </div>
                        </div>

                        <div id="input-group-icon">
                            <input type="text" id="icon-class" value="fa-solid fa-rocket" class="w-full bg-[var(--input-bg)] rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none border border-[var(--border-color)]">
                        </div>

                        <div id="input-group-text" class="hidden space-y-2">
                            <input type="text" id="text-content" value="A" maxlength="3" class="w-full bg-[var(--input-bg)] rounded-lg px-3 py-2 text-sm font-bold text-center focus:ring-2 focus:ring-blue-500 outline-none border border-[var(--border-color)]" placeholder="Type text...">
                            <select id="font-family" class="w-full bg-[var(--input-bg)] rounded-lg px-3 py-2 text-xs border border-[var(--border-color)]">
                                <option value="'Inter', sans-serif">Inter (Default)</option>
                                <option value="serif">Serif</option>
                                <option value="monospace">Monospace</option>
                                <option value="cursive">Handwritten</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- CARD 2: COLORS & BACKGROUND -->
                <div class="bg-[var(--card-bg)] p-5 rounded-2xl shadow-sm border border-[var(--border-color)]">
                    <h2 class="text-xs font-bold mb-4 text-gray-500 dark:text-gray-400 uppercase tracking-wider flex items-center"><i class="fa-solid fa-palette mr-2"></i>Colors & Fill</h2>
                    
                    <div class="control-group">
                        <div class="grid grid-cols-3 gap-3">
                            <div class="text-center flex flex-col items-center bg-[var(--input-bg)] p-2 rounded-lg border border-[var(--border-color)]">
                                <label class="text-[10px] font-bold text-gray-500 mb-1">Icon</label>
                                <input type="color" id="color-icon" value="#ffffff" class="mb-1 cursor-pointer">
                                <label class="text-[9px] mt-1 flex items-center gap-1 cursor-pointer">
                                    <input type="checkbox" id="trans-icon" class="rounded text-blue-600 focus:ring-blue-500 w-3 h-3">
                                    <span class="opacity-70">Clear</span>
                                </label>
                            </div>
                            <div class="text-center flex flex-col items-center bg-[var(--input-bg)] p-2 rounded-lg border border-[var(--border-color)]">
                                <label class="text-[10px] font-bold text-gray-500 mb-1">Bg 1</label>
                                <input type="color" id="color-bg-1" value="#4f46e5" class="mb-1 cursor-pointer">
                                <label class="text-[9px] mt-1 flex items-center gap-1 cursor-pointer">
                                    <input type="checkbox" id="trans-bg-1" class="rounded text-blue-600 focus:ring-blue-500 w-3 h-3">
                                    <span class="opacity-70">Clear</span>
                                </label>
                            </div>
                            <div class="text-center flex flex-col items-center bg-[var(--input-bg)] p-2 rounded-lg border border-[var(--border-color)]">
                                <label class="text-[10px] font-bold text-gray-500 mb-1">Bg 2</label>
                                <input type="color" id="color-bg-2" value="#9333ea" class="mb-1 cursor-pointer">
                                <label class="text-[9px] mt-1 flex items-center gap-1 cursor-pointer">
                                    <input type="checkbox" id="trans-bg-2" class="rounded text-blue-600 focus:ring-blue-500 w-3 h-3">
                                    <span class="opacity-70">Clear</span>
                                </label>
                            </div>
                        </div>
                        
                        <div class="flex items-center justify-between mt-4 mb-3 bg-[var(--input-bg)] p-2.5 rounded-lg border border-[var(--border-color)]">
                            <label for="use-gradient" class="text-xs font-bold cursor-pointer">Gradient Background</label>
                            <input type="checkbox" id="use-gradient" checked class="rounded text-blue-600 focus:ring-blue-500 cursor-pointer">
                        </div>

                        <!-- Gradient Settings (Simplified layout) -->
                        <div class="grid grid-cols-2 gap-3 mb-4 p-3 bg-[var(--input-bg)] rounded-lg border border-[var(--border-color)]">
                            <div>
                                <label class="text-[10px] font-bold text-gray-500 uppercase">Angle</label>
                                <div class="flex items-center gap-2 mt-1">
                                    <input type="range" id="grad-angle" min="0" max="360" value="135" class="flex-1 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-lg cursor-pointer">
                                    <span id="val-grad-angle" class="text-[10px] font-mono w-6 text-right">135°</span>
                                </div>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-gray-500 uppercase">Style</label>
                                <select id="grad-type" class="w-full bg-white dark:bg-gray-700 rounded px-2 py-1 mt-1 text-[10px] border border-[var(--border-color)] outline-none">
                                    <option value="linear">Linear</option>
                                    <option value="radial">Radial</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="text-xs font-bold mb-1 block">Pattern Overlay</label>
                            <select id="bg-pattern" class="w-full bg-[var(--input-bg)] rounded-lg px-3 py-2 text-xs border border-[var(--border-color)] outline-none">
                                <option value="none">None</option>
                                <option value="dots">Polka Dots</option>
                                <option value="lines">Diagonal Lines</option>
                                <option value="grid">Graph Grid</option>
                            </select>
                        </div>
                    </div>
                </div>

<!-- CARD 3: DIMENSIONS & SHAPE -->
                <div class="bg-[var(--card-bg)] p-5 rounded-2xl shadow-sm border border-[var(--border-color)]">
                    <h2 class="text-xs font-bold mb-4 text-gray-500 dark:text-gray-400 uppercase tracking-wider flex items-center"><i class="fa-solid fa-ruler-combined mr-2"></i>Dimensions</h2>
                    
                    <div class="control-group">
                        <div class="flex justify-between mb-1"><label class="control-label text-xs">Container Size</label><span id="val-size" class="text-xs font-mono text-gray-500">128px</span></div>
                        <input type="range" id="size-container" min="32" max="512" value="128" class="w-full h-1.5 bg-gray-300 dark:bg-gray-600 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <div class="control-group">
                        <div class="flex justify-between mb-1"><label class="control-label text-xs">Icon Size</label><span id="val-icon-size" class="text-xs font-mono text-gray-500">50%</span></div>
                        <input type="range" id="size-icon" min="10" max="100" value="50" class="w-full h-1.5 bg-gray-300 dark:bg-gray-600 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <div class="control-group mb-0">
                        <div class="flex justify-between mb-1"><label class="control-label text-xs">Border Radius</label><span id="val-radius" class="text-xs font-mono text-gray-500">20%</span></div>
                        <input type="range" id="radius" min="0" max="50" value="20" class="w-full h-1.5 bg-gray-300 dark:bg-gray-600 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>

                <!-- CARD 4: ADVANCED TWEAKS (COLLAPSIBLE) -->
                <details class="group bg-[var(--card-bg)] rounded-2xl shadow-sm border border-[var(--border-color)] [&_summary::-webkit-details-marker]:hidden">
                    <summary class="flex items-center justify-between p-5 cursor-pointer outline-none">
                        <h2 class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider flex items-center mb-0"><i class="fa-solid fa-sliders mr-2"></i>Advanced Tweaks</h2>
                        <i class="fa-solid fa-chevron-down text-gray-400 group-open:rotate-180 transition-transform"></i>
                    </summary>
                    
                    <div class="p-5 border-t border-[var(--border-color)] space-y-5">
                        
                        <!-- Transform -->
                        <div>
                            <label class="control-label text-xs border-b border-[var(--border-color)] pb-1 mb-3">Transform</label>
                            <div class="mb-3">
                                <div class="flex justify-between mb-1"><label class="text-[10px] text-gray-500 uppercase font-bold">Rotation</label><span id="val-rotate" class="text-[10px] font-mono text-gray-500">0°</span></div>
                                <input type="range" id="icon-rotate" min="-180" max="180" value="0" class="w-full h-1.5 bg-gray-300 dark:bg-gray-600 rounded-lg cursor-pointer">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <div class="flex justify-between mb-1"><label class="text-[10px] text-gray-500 uppercase font-bold">Offset X</label><span id="val-off-x" class="text-[10px] font-mono text-gray-500">0</span></div>
                                    <input type="range" id="icon-off-x" min="-50" max="50" value="0" class="w-full h-1.5 bg-gray-300 dark:bg-gray-600 rounded-lg cursor-pointer">
                                </div>
                                <div>
                                    <div class="flex justify-between mb-1"><label class="text-[10px] text-gray-500 uppercase font-bold">Offset Y</label><span id="val-off-y" class="text-[10px] font-mono text-gray-500">0</span></div>
                                    <input type="range" id="icon-off-y" min="-50" max="50" value="0" class="w-full h-1.5 bg-gray-300 dark:bg-gray-600 rounded-lg cursor-pointer">
                                </div>
                            </div>
                        </div>

                        <!-- Border Setup -->
                        <div>
                            <label class="control-label text-xs border-b border-[var(--border-color)] pb-1 mb-3">Outer Border</label>
                            <div class="flex gap-2 items-center mb-3">
                                <input type="color" id="color-border" value="#ffffff" class="w-8 h-8 rounded cursor-pointer">
                                <select id="border-style" class="flex-1 bg-[var(--input-bg)] rounded-lg px-2 py-1.5 text-xs border border-[var(--border-color)] outline-none">
                                    <option value="solid">Solid</option>
                                    <option value="dashed">Dashed</option>
                                    <option value="dotted">Dotted</option>
                                    <option value="double">Double</option>
                                </select>
                            </div>
                            <label class="text-[10px] flex items-center gap-2 cursor-pointer mb-3 bg-[var(--input-bg)] p-2 rounded-lg border border-[var(--border-color)]">
                                 <input type="checkbox" id="trans-border" class="rounded text-blue-600 focus:ring-blue-500 w-3 h-3">
                                 <span class="opacity-70 font-bold uppercase">Transparent Border</span>
                            </label>
                            <div class="flex items-center gap-3">
                                <label class="text-[10px] text-gray-500 uppercase font-bold w-12">Width</label>
                                <input type="range" id="border-width" min="0" max="20" value="0" class="flex-1 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-lg appearance-none cursor-pointer">
                                <span id="val-border" class="text-[10px] font-mono text-gray-500 w-6 text-right">0px</span>
                            </div>
                        </div>

                        <!-- Drop Shadows -->
                        <div>
                            <label class="control-label text-xs border-b border-[var(--border-color)] pb-1 mb-3">Effects</label>
                            <div class="space-y-3">
                                <div class="flex items-center gap-3">
                                    <label class="text-[10px] text-gray-500 uppercase font-bold w-16">Box Blur</label>
                                    <input type="range" id="shadow-blur" min="0" max="50" value="10" class="flex-1 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-lg cursor-pointer">
                                </div>
                                <div class="flex items-center gap-3">
                                    <label class="text-[10px] text-gray-500 uppercase font-bold w-16">Box Shadow</label>
                                    <input type="range" id="shadow-opacity" min="0" max="1" step="0.1" value="0.3" class="flex-1 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-lg cursor-pointer">
                                </div>
                                <div class="flex items-center gap-3">
                                    <label class="text-[10px] text-gray-500 uppercase font-bold w-16">Icon Shadow</label>
                                    <input type="range" id="icon-shadow" min="0" max="1" step="0.1" value="0" class="flex-1 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-lg cursor-pointer">
                                </div>
                                <div class="flex items-center gap-3 pt-2">
                                    <label class="text-[10px] text-gray-500 uppercase font-bold w-16">Icon Alpha</label>
                                    <input type="range" id="icon-opacity" min="0.1" max="1" step="0.1" value="1" class="flex-1 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-lg cursor-pointer">
                                </div>
                            </div>
                        </div>

                    </div>
                </details>
            </div>

            <div class="lg:col-span-8 relative">
                <!-- DEBUG: Added sticky wrapper so preview stays pinned to the screen while configuring left panel details -->
                <div class="sticky top-24 space-y-6">
                
                <div class="bg-[var(--card-bg)] p-8 rounded-2xl shadow-xl border border-[var(--border-color)] flex flex-col items-center justify-center min-h-[400px]">
                    <h3 class="text-gray-400 text-sm font-bold uppercase tracking-wider mb-6">Live Preview</h3>
                    
                    <div class="preview-area p-10 rounded-xl border border-dashed border-gray-300 dark:border-gray-600">
                        <div id="icon-preview" class="flex items-center justify-center transition-all duration-200">
                            <i id="preview-i" class=""></i>
                        </div>
                    </div>

                    <div class="mt-8 flex flex-wrap justify-center gap-3">
                        <button id="btn-dl-png" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-bold shadow-lg transition-transform hover:-translate-y-0.5">
                            <i class="fa-solid fa-download mr-2"></i>Download PNG
                        </button>
                        <button id="btn-dl-svg" class="bg-gray-700 hover:bg-gray-800 text-white px-6 py-2 rounded-lg font-bold shadow-lg transition-transform hover:-translate-y-0.5">
    <i class="fa-solid fa-vector-square mr-2"></i>SVG
</button>
                        <button id="btn-copy-code" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2 rounded-lg font-bold shadow-lg transition-transform hover:-translate-y-0.5">
                            <i class="fa-solid fa-copy mr-2"></i>Copy Code
                        </button>
                    </div>
                </div>

                <div class="bg-[var(--card-bg)] rounded-2xl shadow-xl border border-[var(--border-color)] overflow-hidden">
                    <div class="bg-gray-100 dark:bg-gray-800 px-4 py-2 border-b border-[var(--border-color)] flex justify-between items-center">
                        <span class="text-xs font-mono font-bold text-gray-500">GENERATED CODE</span>
                        <div class="flex gap-2">
                            <button id="mode-html" class="mode-btn active text-xs font-bold px-3 py-1 bg-white dark:bg-gray-600 text-blue-600 dark:text-blue-300 rounded shadow-sm border border-gray-200 dark:border-gray-500 transition-colors">HTML</button>
                            <button id="mode-css-base64" class="mode-btn text-xs font-bold px-3 py-1 bg-transparent text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700 rounded transition-colors">CSS (Base64)</button>
                            <button id="mode-favicon" class="mode-btn text-xs font-bold px-3 py-1 bg-transparent text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700 rounded transition-colors">Favicon Tag</button>
                        </div>
                    </div>
                    <textarea id="code-output" readonly class="w-full h-64 p-4 font-mono text-sm bg-[var(--card-bg)] text-[var(--text-main)] outline-none resize-y border-0 focus:ring-0"></textarea>
                </div>
                
                </div> <!-- End Sticky Wrapper -->
            </div>
        </div>
        </div> <!-- End tab-studio -->

        <!-- NEW: Library View (IcoMoon style management) - Renamed to tab-library -->
        <div id="tab-library" class="hidden">
            <div class="bg-[var(--card-bg)] p-6 rounded-2xl shadow-xl border border-[var(--border-color)]">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold"><i class="fa-solid fa-layer-group mr-2 text-blue-500"></i>Glyph Set Manager</h2>
                    <div class="flex gap-2">
                        <button id="btn-export-sprite" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow transition-transform">
                            <i class="fa-solid fa-file-export mr-2"></i>Export SVG Sprite
                        </button>
                        <button id="btn-clear-library" class="bg-red-100 text-red-600 hover:bg-red-200 px-4 py-2 rounded-lg text-sm font-bold shadow transition-transform">
                            Clear
                        </button>
                    </div>
                </div>
                
                <!-- Search / Add -->
                <div class="flex gap-3 mb-1">
                    <input type="text" id="library-input" placeholder="e.g. fa-solid fa-user, fa-solid fa-home..." class="flex-1 bg-[var(--input-bg)] border border-[var(--border-color)] rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none text-[var(--text-main)]">
                    <button id="btn-add-glyph" class="bg-gray-800 hover:bg-gray-900 dark:bg-gray-200 dark:hover:bg-white text-white dark:text-gray-900 px-6 py-2 rounded-lg font-bold">Add Glyph</button>
                </div>
                <p class="text-xs text-gray-500 mb-6 font-mono">You can paste multiple icons separated by commas to bulk-import.</p>

                <!-- Collection Grid -->
                <div id="library-grid" class="grid grid-cols-4 md:grid-cols-8 lg:grid-cols-10 gap-4 min-h-[300px] content-start bg-[var(--input-bg)] p-4 rounded-xl border border-dashed border-[var(--border-color)]">
                    <!-- Added Glyphs will render here -->
                </div>
            </div>
            
            <div class="mt-6 bg-[var(--card-bg)] rounded-2xl shadow-xl border border-[var(--border-color)] overflow-hidden">
                <div class="bg-gray-100 dark:bg-gray-800 px-4 py-2 border-b border-[var(--border-color)]">
                    <span class="text-xs font-mono font-bold text-gray-500">SPRITE USAGE (HTML)</span>
                </div>
                <textarea id="library-output" readonly class="w-full h-32 p-4 font-mono text-sm bg-[var(--card-bg)] text-[var(--text-main)] outline-none resize-y border-0"></textarea>
            </div>
        </div> <!-- End view-library -->

    </div>

    <script type="module">
    import { AppNavigation } from '../shared-nav.js';

    // Initialize Native Shared Nav - Theme and Tab switching are now handled automatically
    const nav = new AppNavigation({
        appName: 'IconGenerator',
        appIcon: 'fa-box',
        themeColor: 'pink',
        tabs: [
            { id: 'studio', label: 'Icon Studio', icon: 'fa-palette' },
            { id: 'library', label: 'Glyph Library', icon: 'fa-layer-group' }
        ],
        activeTab: 'studio'
    });

    // Elements
    const el = {
        class: document.getElementById('icon-class'),
        colorIcon: document.getElementById('color-icon'),
        colorBg1: document.getElementById('color-bg-1'),
        colorBg2: document.getElementById('color-bg-2'),
        useGradient: document.getElementById('use-gradient'),
        transIcon: document.getElementById('trans-icon'),
transBg1: document.getElementById('trans-bg-1'),
transBg2: document.getElementById('trans-bg-2'),
transBorder: document.getElementById('trans-border'),
        sizeContainer: document.getElementById('size-container'),
        sizeIcon: document.getElementById('size-icon'),
        radius: document.getElementById('radius'),
        modeIconBtn: document.getElementById('mode-icon-btn'),
    modeTextBtn: document.getElementById('mode-text-btn'),
    groupIcon: document.getElementById('input-group-icon'),
    groupText: document.getElementById('input-group-text'),
    textContent: document.getElementById('text-content'),
    fontFamily: document.getElementById('font-family'),
        
        // Border
        colorBorder: document.getElementById('color-border'),
        borderWidth: document.getElementById('border-width'),
        borderStyle: document.getElementById('border-style'),
        
        // Shadow
        shadowOpacity: document.getElementById('shadow-opacity'),
        shadowBlur: document.getElementById('shadow-blur'),
        
        // New Controls
        gradAngle: document.getElementById('grad-angle'),
        gradType: document.getElementById('grad-type'),
        iconRotate: document.getElementById('icon-rotate'),
        iconOffX: document.getElementById('icon-off-x'),
        iconOffY: document.getElementById('icon-off-y'),
        iconShadow: document.getElementById('icon-shadow'),
        iconOpacity: document.getElementById('icon-opacity'),

        // UI Refs
        presetSelect: document.getElementById('preset-select'),
        previewBox: document.getElementById('icon-preview'),
        previewIcon: document.getElementById('preview-i'),
        codeOutput: document.getElementById('code-output'),
        
        // Value Labels
        valSize: document.getElementById('val-size'),
        valIconSize: document.getElementById('val-icon-size'),
        valRadius: document.getElementById('val-radius'),
        valBorder: document.getElementById('val-border'),
        valGradAngle: document.getElementById('val-grad-angle'),
        valRotate: document.getElementById('val-rotate'),
        valOffX: document.getElementById('val-off-x'),
        valOffY: document.getElementById('val-off-y'),

        // Import
        btnToggleImport: document.getElementById('btn-toggle-import'),
        importPanel: document.getElementById('import-panel'),
        importInput: document.getElementById('import-input'),
        btnProcessImport: document.getElementById('btn-process-import'),

        // New Library Elements for Icon Management
        libraryInput: document.getElementById('library-input'),
        btnAddGlyph: document.getElementById('btn-add-glyph'),
        libraryGrid: document.getElementById('library-grid'),
        btnExportSprite: document.getElementById('btn-export-sprite'),
        btnClearLibrary: document.getElementById('btn-clear-library'),
        libraryOutput: document.getElementById('library-output')
    };

    // State
    let currentMode = 'html'; 
    let contentMode = 'icon'; // 'icon' or 'text'
    
    // Load existing library from local storage, or initialize empty array if none exists
    let glyphLibrary = JSON.parse(localStorage.getItem('savedGlyphLibrary')) || []; 
    console.log("[DEBUG] Initialized glyphLibrary state. Total items:", glyphLibrary.length);

    // Tab switching is now natively handled by shared-nav.js AppNavigation via the 'tab-[id]' wrappers

    // Library Logic (IcoMoon style management)
    el.btnAddGlyph.addEventListener('click', () => {
        const val = el.libraryInput.value.trim();
        console.log("[DEBUG] Attempting to add glyph(s):", val);
        
        if (val) {
            // Support bulk import: split by commas to handle pasted lists
            const newGlyphs = val.split(',').map(g => g.trim()).filter(g => g !== '');
            let addedCount = 0;

            newGlyphs.forEach(glyph => {
                // Prevent adding empty or duplicate classes
                if (glyph && !glyphLibrary.includes(glyph)) {
                    console.log("[DEBUG] Successfully added glyph:", glyph);
                    glyphLibrary.push(glyph);
                    addedCount++;
                } else {
                    console.warn("[DEBUG] Skipped invalid or duplicate glyph:", glyph);
                }
            });

            if (addedCount > 0) {
                el.libraryInput.value = '';
                // Save the updated array to local storage to persist across reloads
                localStorage.setItem('savedGlyphLibrary', JSON.stringify(glyphLibrary));
                console.log("[DEBUG] Saved updated library to localStorage. New total:", glyphLibrary.length);
                renderLibrary();
            }
        }
    });
    
    // Quick Add on Enter key
    el.libraryInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') el.btnAddGlyph.click();
    });

    el.btnClearLibrary.addEventListener('click', () => {
        console.log("[DEBUG] Clearing glyph library completely");
        // Empty the active array
        glyphLibrary = [];
        // Delete the saved library from the browser memory
        localStorage.removeItem('savedGlyphLibrary');
        renderLibrary();
    });

    function renderLibrary() {
        // Redraw the grid of selected icons
        el.libraryGrid.innerHTML = '';
        if(glyphLibrary.length === 0) {
            el.libraryGrid.innerHTML = '<div class="col-span-full text-center text-gray-400 py-10">No glyphs added. Try adding "fa-solid fa-star".</div>';
            el.libraryOutput.value = '';
            return;
        }

        glyphLibrary.forEach((iconClass, index) => {
            const card = document.createElement('div');
            card.className = "relative bg-[var(--card-bg)] border border-[var(--border-color)] rounded-lg p-4 flex flex-col items-center justify-center hover:border-blue-500 transition-colors group";
            
            // Render the actual Icon preview
            const i = document.createElement('i');
            i.className = iconClass + " text-2xl text-[var(--text-main)]";
            
            // Delete button (appears on hover) for easy list editing
            const delBtn = document.createElement('button');
            delBtn.className = "absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs opacity-0 group-hover:opacity-100 transition-opacity z-10";
            delBtn.innerHTML = '<i class="fa-solid fa-times"></i>';
            delBtn.onclick = () => {
                console.log("[DEBUG] Removing glyph index:", index, "| Class:", iconClass);
                // Remove item from the active array
                glyphLibrary.splice(index, 1);
                // Update local storage so the deletion remains permanent on reload
                localStorage.setItem('savedGlyphLibrary', JSON.stringify(glyphLibrary));
                renderLibrary();
            };

            // New: Copy button for individual icons (appears on hover)
            const copyBtn = document.createElement('button');
            copyBtn.className = "absolute -top-2 -left-2 bg-emerald-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs opacity-0 group-hover:opacity-100 transition-opacity z-10";
            copyBtn.innerHTML = '<i class="fa-solid fa-copy"></i>';
            copyBtn.onclick = () => {
                console.log("[DEBUG] Copying individual icon HTML to clipboard:", iconClass);
                // Copy the raw HTML tag for the icon to the user's clipboard
                navigator.clipboard.writeText(`<i class="${iconClass}"></i>`);
                
                // Temporarily swap icon to give visual feedback to the user
                copyBtn.innerHTML = '<i class="fa-solid fa-check"></i>';
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="fa-solid fa-copy"></i>';
                }, 1000);
            };

            // Label to identify class
            const label = document.createElement('span');
            label.className = "text-[10px] text-gray-500 mt-2 truncate w-full text-center";
            label.innerText = iconClass.split('-').pop();

            // Attach all UI elements to the library grid card
            card.appendChild(delBtn);
            card.appendChild(copyBtn); // Inject the newly created copy button
            card.appendChild(i);
            card.appendChild(label);
            
            el.libraryGrid.appendChild(card);
        });
    }

    // Generate SVG Sprite payload (equivalent to IcoMoon's symbol export)
    el.btnExportSprite.addEventListener('click', () => {
        if(glyphLibrary.length === 0) return alert("Add some glyphs first!");
        console.log("[DEBUG] Generating SVG Sprite for", glyphLibrary.length, "icons");
        
        let symbols = '';
        let usageHTML = '<!-- Usage Example -->\n';

        glyphLibrary.forEach(iconClass => {
            // Check FontAwesome logic to extract SVG path vectors natively
            if(window.FontAwesome) {
                const parts = iconClass.split(' ');
                let prefix = 'fas'; 
                let iconName = '';
                
                parts.forEach(p => {
                    if (p === 'fa-brands' || p === 'fab') prefix = 'fab';
                    if (p === 'fa-regular' || p === 'far') prefix = 'far';
                    if (p.startsWith('fa-') && !['fa-solid','fa-brands','fa-regular','fa-fw'].includes(p)) {
                        iconName = p.replace('fa-', '');
                    }
                });

                const iconDef = window.FontAwesome.findIconDefinition({ prefix, iconName });
                if(iconDef) {
                    const pathData = iconDef.icon[4];
                    const viewBox = `0 0 ${iconDef.icon[0]} ${iconDef.icon[1]}`;
                    
                    // Create <symbol> wrapper
                    symbols += `  <symbol id="icon-${iconName}" viewBox="${viewBox}">\n    <path fill="currentColor" d="${pathData}"></path>\n  </symbol>\n`;
                    usageHTML += `<svg class="icon"><use href="sprite.svg#icon-${iconName}"></use></svg>\n`;
                } else {
                    console.log("[DEBUG] Icon not found in FA definition:", iconClass);
                }
            }
        });

        if(symbols) {
            // Encapsulate inside SVG defs
            const spriteSvg = `<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">\n${symbols}</svg>`;
            
            // Trigger automatic file download
            const blob = new Blob([spriteSvg], {type: 'image/svg+xml'});
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `sprite-${Date.now()}.svg`;
            link.click();

            el.libraryOutput.value = usageHTML + '\n<!-- Place the downloaded sprite.svg in your project folder -->';
        } else {
            alert("Could not generate sprite. Ensure you are using valid FontAwesome classes.");
        }
    });

    // Initialize an empty state view on load
    renderLibrary();

    el.modeIconBtn.addEventListener('click', () => toggleContentMode('icon'));
el.modeTextBtn.addEventListener('click', () => toggleContentMode('text'));

    // Presets
    const presets = {
        dashboard: { c1: '#0f172a', c2: '#1e293b', icon: 'fa-solid fa-gauge-high' },
        logger: { c1: '#16a34a', c2: '#15803d', icon: 'fa-solid fa-pen-to-square' },
        analyser: { c1: '#4f46e5', c2: '#4338ca', icon: 'fa-solid fa-chart-line' },
        medicine: { c1: '#db2777', c2: '#be185d', icon: 'fa-solid fa-pills' },
        vidtrackr: { c1: '#ed2224', c2: '#c01e1f', icon: 'fa-solid fa-ticket' },
        podtrackr: { c1: '#6d28d9', c2: '#5b21b6', icon: 'fa-solid fa-podcast' },
        tasktrackr: { c1: '#3b82f6', c2: '#2563eb', icon: 'fa-solid fa-check-double' },
        foodtrackr: { c1: '#EA580C', c2: '#C2410C', icon: 'fa-solid fa-utensils' }
    };

    function toggleContentMode(mode) {
    contentMode = mode;
    if(mode === 'icon') {
        el.modeIconBtn.classList.add('bg-white', 'dark:bg-gray-600', 'shadow-sm');
        el.modeIconBtn.classList.remove('text-gray-500');
        el.modeTextBtn.classList.remove('bg-white', 'dark:bg-gray-600', 'shadow-sm');
        el.modeTextBtn.classList.add('text-gray-500');
        el.groupIcon.classList.remove('hidden');
        el.groupText.classList.add('hidden');
    } else {
        el.modeTextBtn.classList.add('bg-white', 'dark:bg-gray-600', 'shadow-sm');
        el.modeTextBtn.classList.remove('text-gray-500');
        el.modeIconBtn.classList.remove('bg-white', 'dark:bg-gray-600', 'shadow-sm');
        el.modeIconBtn.classList.add('text-gray-500');
        el.groupText.classList.remove('hidden');
        el.groupIcon.classList.add('hidden');
    }
    generate();
}

    // --- IMPORT LOGIC ---
    el.btnToggleImport.addEventListener('click', () => {
        el.importPanel.classList.toggle('hidden');
    });

    el.btnProcessImport.addEventListener('click', () => {
        const input = el.importInput.value;
        if(!input) return;
        
        // Parse Class
        const classMatch = input.match(/class=["']([^"']*(fa-|ph-|bi-|ri-|bx-)[^"']*)["']/);
        if(classMatch) {
            const classes = classMatch[1].split(' ').filter(c => 
                c.startsWith('fa-') || c.startsWith('ph-') || c.startsWith('bi-') || c.startsWith('ri-') || c.startsWith('bx-') || c === 'bi' || c === 'bx'
            ).join(' ');
            if(classes) el.class.value = classes;
        }

        // Parse Colors
        const hexColors = input.match(/#[0-9a-fA-F]{6}/g);
        if(hexColors) {
            if(hexColors.length === 1) {
                el.colorBg1.value = hexColors[0];
                el.useGradient.checked = false;
            } else if(hexColors.length >= 2) {
                if(input.includes('gradient')) {
                    el.colorBg1.value = hexColors[0];
                    el.colorBg2.value = hexColors[1];
                    el.useGradient.checked = true;
                } else {
                     el.colorBg1.value = hexColors[0];
                     el.colorIcon.value = hexColors[1];
                     el.useGradient.checked = false;
                }
            }
        }
        
        generate();
        el.btnToggleImport.click(); 
    });

    el.presetSelect.addEventListener('change', (e) => {
        const p = presets[e.target.value];
        if(p) {
            el.colorBg1.value = p.c1;
            el.colorBg2.value = p.c2;
            el.class.value = p.icon;
            el.useGradient.checked = true;
            generate();
        }
    });

    function getSVGString() {
        const size = parseInt(el.sizeContainer.value);
        const iconClass = el.class.value;
        const isGrad = el.useGradient.checked;
        const radius = (parseInt(el.radius.value) / 100) * size;
        const iconRatio = parseInt(el.sizeIcon.value) / 100;
        const iconSize = size * iconRatio;
        const iconOffset = (size - iconSize) / 2;

        // Transform vars
        const rotate = parseInt(el.iconRotate.value);
        const offX = parseInt(el.iconOffX.value);
        const offY = parseInt(el.iconOffY.value);
        const gradAngle = parseInt(el.gradAngle.value);

        // Resolve Colors & Opacities
        const cBg1 = el.colorBg1.value;
        const opBg1 = el.transBg1.checked ? 0 : 1;
        
        const cBg2 = el.colorBg2.value;
        const opBg2 = el.transBg2.checked ? 0 : 1;
        
        const cIcon = el.colorIcon.value;
        const opIcon = el.transIcon.checked ? 0 : 1;

        // Get Path
        let pathData = null;
        let viewBox = '0 0 512 512';

        if (window.FontAwesome) {
            const parts = iconClass.split(' ');
            let prefix = 'fas'; 
            let iconName = '';
            parts.forEach(p => {
                if (p === 'fa-brands' || p === 'fab') prefix = 'fab';
                if (p === 'fa-regular' || p === 'far') prefix = 'far';
                if (p.startsWith('fa-') && !['fa-solid','fa-brands','fa-regular','fa-fw'].includes(p)) {
                    iconName = p.replace('fa-', '');
                }
            });
            const icon = window.FontAwesome.findIconDefinition({ prefix, iconName });
            if(icon) {
                pathData = icon.icon[4];
                viewBox = `0 0 ${icon.icon[0]} ${icon.icon[1]}`;
            }
        }

        if(!pathData) return null; 

        let svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${size}' height='${size}' viewBox='0 0 ${size} ${size}'>`;
        svg += `<defs>`;
        
        // Define Gradient even if not used, or conditionally
        if (isGrad) {
            const rad = (gradAngle - 90) * (Math.PI / 180);
            const x1 = 50 + 50 * Math.cos(rad);
            const y1 = 50 + 50 * Math.sin(rad);
            const x2 = 50 + 50 * Math.cos(rad + Math.PI);
            const y2 = 50 + 50 * Math.sin(rad + Math.PI);
            
            svg += `<linearGradient id='g' x1='${x1}%' y1='${y1}%' x2='${x2}%' y2='${y2}%'>
                <stop offset='0%' style='stop-color:${cBg1};stop-opacity:${opBg1}' />
                <stop offset='100%' style='stop-color:${cBg2};stop-opacity:${opBg2}' />
            </linearGradient>`;
        }
        svg += `</defs>`;
        
        // Determine fill for rect
        let fillAttr = '';
        if (isGrad) {
            fillAttr = `fill='url(#g)'`;
        } else {
            fillAttr = `fill='${cBg1}' fill-opacity='${opBg1}'`;
        }

        svg += `<rect width='${size}' height='${size}' rx='${radius}' ${fillAttr} />`;
        
        // Apply Transforms
        const centerX = size / 2;
        const centerY = size / 2;
        
        svg += `<g transform='translate(${offX}, ${offY}) rotate(${rotate}, ${centerX}, ${centerY})'>`;
        svg += `<svg x='${iconOffset}' y='${iconOffset}' width='${iconSize}' height='${iconSize}' viewBox='${viewBox}'>`;
        svg += `<path fill='${cIcon}' fill-opacity='${opIcon}' d='${pathData}' />`;
        svg += `</svg></g></svg>`;
        return svg;
    }

    function generate() {
        // 1. Get standard values
        const size = el.sizeContainer.value;
        const iSize = el.sizeIcon.value;
        const rad = el.radius.value;
        const bWidth = el.borderWidth.value;
        const bStyle = el.borderStyle.value;
        
        // --- MODIFIED SECTION: Handle Transparency ---
        const cIcon = el.transIcon.checked ? 'transparent' : el.colorIcon.value;
        const cBg1 = el.transBg1.checked ? 'transparent' : el.colorBg1.value;
        const cBg2 = el.transBg2.checked ? 'transparent' : el.colorBg2.value;
        const bColor = el.transBorder.checked ? 'transparent' : el.colorBorder.value;
        // ---------------------------------------------

        const isGrad = el.useGradient.checked;
        const sOp = el.shadowOpacity.value;
        const sBlur = el.shadowBlur.value;
        const iconClass = el.class.value;
        const textVal = el.textContent.value;
        const fontVal = el.fontFamily.value;

        // ... rest of the generate function stays mostly the same ...
        // (Existing logic handles 'transparent' correctly in CSS)
        
        // 2. Get new advanced values
        const gAngle = el.gradAngle.value;
        const gType = el.gradType.value;
        const rot = el.iconRotate.value;
        const ox = el.iconOffX.value;
        const oy = el.iconOffY.value;
        const iShadow = el.iconShadow.value;
        const iOp = el.iconOpacity.value;

        // 3. Update UI Labels
        el.valSize.textContent = `${size}px`;
        el.valIconSize.textContent = `${iSize}%`;
        el.valRadius.textContent = `${rad}%`;
        el.valBorder.textContent = `${bWidth}px`;
        el.valGradAngle.textContent = `${gAngle}°`;
        el.valRotate.textContent = `${rot}°`;
        el.valOffX.textContent = ox;
        el.valOffY.textContent = oy;

        // 4. Calculate Base Styles
        let bgStyle = cBg1;
        if (isGrad) {
            if (gType === 'linear') bgStyle = `linear-gradient(${gAngle}deg, ${cBg1}, ${cBg2})`;
            else bgStyle = `radial-gradient(circle, ${cBg1}, ${cBg2})`;
        }
        
        // ... Keep remaining logic (Pattern, Assign Styles, Output) ...
        // Note: Copy the rest of the existing generate function here
        // The pattern logic and assignment code below this point in your file
        // will work perfectly with 'transparent' string values.
        
        // ... (Pattern Logic from previous file) ...
        const boxShadow = sOp > 0 ? `0 4px ${sBlur}px rgba(0,0,0,${sOp})` : 'none';
        
        // Render Logic (Icon vs Text)
        if (contentMode === 'icon') {
            el.previewIcon.className = iconClass;
            el.previewIcon.textContent = '';
            el.previewIcon.style.fontFamily = '';
        } else {
            el.previewIcon.className = '';
            el.previewIcon.textContent = textVal;
            el.previewIcon.style.fontFamily = fontVal;
            el.previewIcon.style.fontStyle = 'normal';
        }

        const iconTransform = `rotate(${rot}deg) translate(${ox}px, ${oy}px)`;
        const iconFilter = iShadow > 0 ? `drop-shadow(0 2px 2px rgba(0,0,0,${iShadow}))` : 'none';

        const pattern = document.getElementById('bg-pattern').value;
        let patternCSS = '';
        let patternSize = 'auto';

        if (pattern === 'dots') {
            patternCSS = `radial-gradient(rgba(255,255,255,0.15) 1px, transparent 1px)`;
            patternSize = '10px 10px';
        } else if (pattern === 'lines') {
            patternCSS = `repeating-linear-gradient(45deg, rgba(255,255,255,0.1) 0, rgba(255,255,255,0.1) 1px, transparent 0, transparent 50%)`;
            patternSize = '10px 10px';
        } else if (pattern === 'grid') {
            patternCSS = `linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px)`;
            patternSize = '20px 20px';
        }

        const baseBg = isGrad ? bgStyle : cBg1; 
        const finalBg = pattern !== 'none' ? `${patternCSS}, ${baseBg}` : baseBg;

        Object.assign(el.previewBox.style, {
            width: `${size}px`,
            height: `${size}px`,
            borderRadius: `${rad}%`,
            border: `${bWidth}px ${bStyle} ${bColor}`,
            boxShadow: boxShadow,
            color: cIcon,
            fontSize: `${Math.round(size * (iSize / 100))}px`,
            background: finalBg,
            backgroundSize: pattern !== 'none' ? `${patternSize}, cover` : 'cover'
        });

        el.previewIcon.style.transform = iconTransform;
        el.previewIcon.style.opacity = iOp;
        el.previewIcon.style.filter = iconFilter;

        let output = '';

        if (currentMode === 'html') {
            output = `
<div style="
display: inline-flex;
align-items: center;
justify-content: center;
width: ${size}px;
height: ${size}px;
background: ${baseBg}; 
border-radius: ${rad}%;
border: ${bWidth}px ${bStyle} ${bColor};
box-shadow: ${boxShadow};
color: ${cIcon};
font-size: ${Math.round(size * (iSize / 100))}px;
overflow: hidden;
">
<i class="${contentMode === 'icon' ? iconClass : ''}" style="transform: ${iconTransform}; opacity: ${iOp}; filter: ${iconFilter}; font-style: normal; font-family: ${contentMode === 'text' ? fontVal : 'inherit'}">${contentMode === 'text' ? textVal : ''}</i>
</div>`.trim();
        } else if (currentMode === 'css-base64' || currentMode === 'favicon') {
            const svgStr = getSVGString();
            if (svgStr) {
                const dataUri = `data:image/svg+xml,${encodeURIComponent(svgStr)}`;
                if (currentMode === 'favicon') {
                    output = `<link rel="icon" href="${dataUri}">`;
                } else {
                    output = `background-image: url('${dataUri}');\nwidth: ${size}px;\nheight: ${size}px;\nbackground-size: contain;\nbackground-repeat: no-repeat;`;
                }
            } else {
                output = "SVG generation currently supports standard Icons. Text/Emoji and Patterns are best saved as PNG.";
            }
        }

        el.codeOutput.value = output;
    }

    document.getElementById('btn-dl-svg').addEventListener('click', () => {
    const svgContent = getSVGString(); 
    if(!svgContent) {
        alert("SVG export is currently only supported for FontAwesome icons.");
        return;
    }
    const blob = new Blob([svgContent], {type: 'image/svg+xml'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `icon-${Date.now()}.svg`;
    link.click();
});

    // Mode Switching
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.mode-btn').forEach(b => {
                b.classList.remove('active', 'bg-white', 'dark:bg-gray-600', 'text-blue-600', 'dark:text-blue-300', 'shadow-sm', 'border');
                b.classList.add('bg-transparent', 'text-gray-500', 'dark:text-gray-400');
            });
            e.target.classList.remove('bg-transparent', 'text-gray-500', 'dark:text-gray-400');
            e.target.classList.add('active', 'bg-white', 'dark:bg-gray-600', 'text-blue-600', 'dark:text-blue-300', 'shadow-sm', 'border', 'border-gray-200', 'dark:border-gray-500');
            
            if(e.target.id === 'mode-html') currentMode = 'html';
            if(e.target.id === 'mode-css-base64') currentMode = 'css-base64';
            if(e.target.id === 'mode-favicon') currentMode = 'favicon';
            generate();
        });
    });

    

    // Listeners
    Object.values(el).forEach(element => {
        if(element && (element.tagName === 'INPUT' || element.tagName === 'SELECT')) {
            element.addEventListener('input', generate);
        }
    });

    document.getElementById('btn-dl-png').addEventListener('click', () => {
        html2canvas(el.previewBox, { backgroundColor: null, scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = `icon-${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        });
    });

    document.getElementById('btn-copy-code').addEventListener('click', () => {
        el.codeOutput.select();
        navigator.clipboard.writeText(el.codeOutput.value);
        const btn = document.getElementById('btn-copy-code');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check mr-2"></i>Copied!';
        setTimeout(() => btn.innerHTML = originalText, 2000);
    });

    // Init
    generate();
</script>
</body>
</html>
